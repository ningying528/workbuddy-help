<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">

<meta name="theme-color" content="#0a0a1a">

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: 'Microsoft YaHei', sans-serif; background: #0a0a1a; color: #e0e0e0; padding: 16px; max-width: 1200px; margin: 0 auto; }

h1 { text-align: center; color: #00d4ff; font-size: 28px; margin-bottom: 16px; }

.query-box { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }

.query-box input { padding: 10px 12px; font-size: 18px; border: 2px solid #333; border-radius: 8px; background: #1a1a2e; color: #fff; width: 140px; }

.query-box button { padding: 10px 20px; font-size: 18px; background: #00d4ff; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

.query-box button:hover { background: #00b4dd; }

.query-box button:disabled { background: #555; cursor: not-allowed; }

.key-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }

.key-row input { padding: 8px 12px; font-size: 16px; border: 2px solid #555; border-radius: 8px; background: #111; color: #ffd700; width: 320px; }

.key-row button { padding: 8px 16px; font-size: 16px; background: #444; color: #fff; border: none; border-radius: 8px; cursor: pointer; }

.key-hint { text-align: center; font-size: 14px; color: #888; margin-bottom: 8px; }

.key-hint a { color: #00d4ff; }

.result { display: none; }

.cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

.card { background: #1a1a2e; border-radius: 12px; padding: 16px; flex: 1; min-width: 280px; max-width: 500px; border: 1px solid #333; }

.card h2 { color: #00d4ff; font-size: 22px; margin-bottom: 12px; text-align: center; }

.metric { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 17px; }

.metric:last-child { border-bottom: none; }

.label { color: #aaa; }

.value { color: #fff; font-weight: bold; }

.value.up { color: #ff4444; }

.value.down { color: #00cc00; }

.section-title { color: #00d4ff; font-size: 19px; margin: 16px 0 10px 0; border-left: 4px solid #00d4ff; padding-left: 10px; }

.summary { background: #0d1117; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 16px; line-height: 1.8; color: #ccc; }

table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 16px; }

th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }

th { color: #00d4ff; background: #0d1117; }

td { color: #e0e0e0; }

tr:hover { background: #161625; }

.error { color: #ff4444; text-align: center; font-size: 18px; padding: 20px; }

.loading { text-align: center; color: #00d4ff; font-size: 20px; padding: 30px; }

#keyStatus { text-align: center; font-size: 13px; color: #0f0; margin-bottom: 8px; min-height: 20px; }

</style>

<body>



<h1>股票分析对比</h1>



<div class="key-hint">

  需要 <a href="https://finnhub.io/register" target="_blank">Finnhub API Key</a>（免费注册，60次/分钟）→ 粘贴到下方输入框

</div>

<div class="key-row">

  <input id="apiKey" type="text" placeholder="输入 Finnhub API Key" autocomplete="off">

</div>

<div id="keyStatus"></div>



<div class="query-box">

  <input id="s1" placeholder="股票代码1" value="NVDA">

  <input id="s2" placeholder="股票代码2" value="AMD">

  <button id="btn" onclick="compare()">开始对比</button>

</div>



<div style="text-align:center;margin-bottom:10px;">

  <button id="installBtn" onclick="installPWA()" style="display:none;padding:12px 24px;font-size:18px;background:#ff6b35;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">安装到桌面（像小程序一样）</button>

</div>



<div id="result"></div>



<script>

// ===== Cookie 读写工具 =====

function setCookie(name, value, days) {

  var expires = "";

  if (days) {

    var d = new Date();

    d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));

    expires = "; expires=" + d.toUTCString();

  }

  document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/; SameSite=Lax";

}

function getCookie(name) {

  var n = name + "=";

  var ca = document.cookie.split(';');

  for (var i = 0; i < ca.length; i++) {

    var c = ca[i].trim();

    if (c.indexOf(n) === 0) return decodeURIComponent(c.substring(n.length, c.length));

  }

  return null;

}



// ===== 辅助函数 =====

function isAShare(sym) {

  return /^\d{6}$/.test(sym) || /\.(SZ|SS|BJ)$/i.test(sym);

}

function getEastmoneySecid(sym) {

  sym = sym.replace(/\.(SZ|SS|BJ)$/i, '');

  if (sym.length !== 6) return '0.' + sym;

  return (sym.charAt(0) === '6' || sym.charAt(0) === '5' ? '1.' : '0.') + sym;

}



// ===== API Key 管理（localStorage + Cookie 双保险）=====

function getKey() {

  var urlKey = new URL(location.href).searchParams.get('key');

  if (urlKey) {

    localStorage.setItem('finnhub_key', urlKey);

    setCookie('finnhub_key', urlKey, 365);

    history.replaceState(null, '', location.pathname + location.hash);

  }

  var k = localStorage.getItem('finnhub_key');

  if (k) return k;

  k = getCookie('finnhub_key');

  if (k) {

    localStorage.setItem('finnhub_key', k);

  }

  return k || '';

}

function saveKey() {

  var k = document.getElementById('apiKey').value.trim();

  if (k) {

    localStorage.setItem('finnhub_key', k);

    setCookie('finnhub_key', k, 365);

    var status = document.getElementById('keyStatus');

    status.textContent = 'Key 已保存！关闭APP重新打开也不会丢失。';

    status.style.color = '#0f0';

    setTimeout(function() { status.textContent = ''; }, 5000);

  } else {

    alert('请输入有效的 Key');

  }

}

function clearKey() {

  localStorage.removeItem('finnhub_key');

  setCookie('finnhub_key', '', -1);

  document.getElementById('apiKey').value = '';

  var status = document.getElementById('keyStatus');

  status.textContent = 'Key 已清除';

  status.style.color = '#f44';

  setTimeout(function() { status.textContent = ''; status.style.color = '#0f0'; }, 3000);

}



document.addEventListener('DOMContentLoaded', function() {

  var k = getKey();

  document.getElementById('apiKey').value = k;

  if (k) {

    var status = document.getElementById('keyStatus');

    status.textContent = 'Key 已加载（来自本地存储）';

    setTimeout(function() { status.textContent = ''; }, 3000);

  }

});



// ===== PWA 安装按钮 =====

var installPrompt = null;

window.addEventListener('beforeinstallprompt', function(e) {

  e.preventDefault();

  installPrompt = e;

  document.getElementById('installBtn').style.display = 'inline-block';

});

function installPWA() {

  if (installPrompt) {

    installPrompt.prompt();

    installPrompt.userChoice.then(function(r) {

      if (r.outcome === 'accepted') { alert('安装成功！桌面会出现图标'); }

      installPrompt = null;

      document.getElementById('installBtn').style.display = 'none';

    });

  } else {

    alert('请刷新页面后再试，或点浏览器菜单 -> 应用 -> 安装此站点为应用');

  }

}



// ===== A股数据：东方财富（仅用可跨域接口）=====
async function fetchEastmoney(secid) {
  var code = secid.split('.')[1];

  // 接口1：基本行情 + 估值（push2.eastmoney.com，已验证可用）
  var baseUrl = 'https://push2.eastmoney.com/api/qt/stock/get?secid=' + secid +
                '&fields=f43,f44,f45,f46,f57,f58,f60,f107,f108,f109,f116,f117,f127,f128,f136,f162,f167,f168,f169,f170,f171';

  // 接口2：公司信息（行业、主营业务、简介）—— 同域名，无跨域问题
  var infoUrl = 'https://push2.eastmoney.com/api/qt/stock/get?secid=' + secid +
                '&fields=f57,f58,f107,f127,f128';

  // 接口3：财务摘要（尝试 emweb 接口，JSONP 方式绕过跨域）
  var finJsonpCb = 'emfin_' + Date.now();
  var finUrl = 'https://emweb.securities.eastmoney.com/PC_HSF10/NewFinanceAnalysis/zcfzbDate?type=web&code=' + code + '&cb=' + finJsonpCb;

  var rBase = null, rInfo = null;
  try { rBase = await fetch(baseUrl, { signal: AbortSignal.timeout(10000) }).then(r=>r.json()); } catch(e) {}
  try { rInfo = await fetch(infoUrl, { signal: AbortSignal.timeout(8000) }).then(r=>r.json()); } catch(e) {}

  // 尝试用 JSONP 获取财务数据（A股财报：总资产、总负债、ROE等）
  var finData = null;
  try {
    finData = await new Promise(function(resolve, reject) {
      var script = document.createElement('script');
      window[finJsonpCb] = function(data) {
        try { delete window[finJsonpCb]; } catch(e) {}
        try { document.body.removeChild(script); } catch(e) {}
        resolve(data);
      };
      script.src = finUrl;
      script.onerror = function() {
        try { delete window[finJsonpCb]; } catch(e) {}
        try { document.body.removeChild(script); } catch(e) {}
        resolve(null);
      };
      setTimeout(function() {
        try { delete window[finJsonpCb]; } catch(e) {}
        try { document.body.removeChild(script); } catch(e) {}
        resolve(null);
      }, 8000);
      document.body.appendChild(script);
    });
  } catch(e) {}

  var d   = (rBase && rBase.data) || {};
  var inf = (rInfo && rInfo.data) || {};

  var price      = (d.f43  || 0) / 100;
  var prevClose  = (d.f60  || 0) / 100;
  var change     = (d.f169 || 0) / 100;
  var changePct  = (d.f170 || 0);

  // 从基本API获取的估值数据
  var marketCap  = d.f116 ? d.f116 * 10000      : null;  // 总市值(万元)→元
  var pe         = d.f162 || null;                      // 市盈率(动态)
  var pb         = d.f167 || null;                      // 市净率
  var turnover   = d.f171 || null;                      // 换手率(%)

  // 从财务JSONP尝试获取数据
  var roe         = null;
  var grossMargin  = null;
  var profitMargin = null;
  var revenueGrowth = null;
  var eps           = null;
  var debtToEquity = null;

  if (finData && finData.data && finData.data.length > 0) {
    // zcfzbDate 返回资产负债表数据，取最新一期
    var latest = finData.data[0];
    if (latest) {
      var totalAsset  = parseFloat(latest.TOTALASSET)      || null;
      var totalLiab  = parseFloat(latest.TOTALLIAB)       || null;
      var netProfit   = parseFloat(latest.PARENTNETPROFIT) || null;
      var revenue     = parseFloat(latest.TOTALOPERATEREVE) || null;
      var grossProfit = parseFloat(latest.GROSSPROFIT)      || null;
      eps             = parseFloat(latest.BASICEPS)         || null;
      if (totalAsset && totalLiab && totalAsset > totalLiab) {
        debtToEquity = totalLiab / (totalAsset - totalLiab);
      }
      if (revenue && grossProfit)   grossMargin  = grossProfit / revenue;
      if (revenue && netProfit)     profitMargin = netProfit / revenue;
    }
  }

  var name      = d.f58 || inf.f58 || secid;
  var industry  = d.f128 || inf.f128 || '';
  var exchange  = secid.startsWith('1.') ? '上交所' : '深交所';

  return {
    name: name,
    price: price,
    prevClose: prevClose,
    open:      (d.f46 || 0) / 100,
    high:      (d.f44 || 0) / 100,
    low:       (d.f45 || 0) / 100,
    change: change,
    changePct: changePct,
    marketCap: marketCap,
    pe: pe,
    pb: pb,
    forwardPe: null,
    peg: null,
    profitMargin: profitMargin,
    revenueGrowth: revenueGrowth,
    roe: roe,
    grossMargin: grossMargin,
    debtToEquity: debtToEquity,
    currentRatio: null,
    eps: eps,
    turnoverRate: turnover,
    week52High: null,
    week52Low: null,
    beta: null,
    industry: industry,
    exchange: exchange,
    currency: 'CNY',
    mainBusiness: '',       // 东方财富暂未返回此字段
    profile: exchange + '上市公司，行业：' + (industry || '未知'),
    isAShare: true
  };
}
