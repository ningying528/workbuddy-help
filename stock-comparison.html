// ============================================================
// 工具函数
// ============================================================
function detectMarket(code) {
  return /^\d{6}$/.test(code.trim()) ? 'CN' : 'US';
}

function fmtNum(num, decimals) {
  if (num == null || isNaN(num)) return 'N/A';
  var abs = Math.abs(num);
  if (abs >= 1e12) return (num / 1e12).toFixed(decimals||2) + '万亿';
  if (abs >= 1e8) return (num / 1e8).toFixed(decimals||2) + '亿';
  if (abs >= 1e4) return (num / 1e4).toFixed(decimals||2) + '万';
  return num.toFixed(decimals||2);
}

function fmtPct(num) {
  if (num == null || isNaN(num)) return 'N/A';
  return (num > 0 ? '+' : '') + (num * 100).toFixed(1) + '%';
}

function fmtPrice(num, currency) {
  if (num == null || isNaN(num)) return 'N/A';
  var sym = currency === 'CNY' ? '¥' : '$';
  if (currency === 'CNY') {
    return sym + (num >= 100 ? num.toFixed(0) : num.toFixed(2));
  }
  return sym + num.toFixed(2);
}

// 股价涨跌颜色（中国惯例：涨红跌绿）
function colorClass(num) {
  if (num == null || isNaN(num)) return 'gray';
  return num >= 0 ? 'up' : 'down';
}

function getFinnhubKey() {
  return localStorage.getItem('finnhub_key') || '';
}

function saveKey() {
  var key = document.getElementById('finnhubKey').value.trim();
  if (!key) { alert('请输入有效的 API Key'); return; }
  localStorage.setItem('finnhub_key', key);
  document.getElementById('apiSettings').style.display = 'none';
  alert('✅ API Key 已保存！现在可以查询非预设股票了。');
}

function toggleSettings() {
  var el = document.getElementById('apiSettings');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  if (el.style.display === 'block') {
    document.getElementById('finnhubKey').value = getFinnhubKey();
  }
}

// ============================================================
// 评分引擎（九维）
// ============================================================
function score(dataA, dataB) {
  var s = {
    pe:{A:0,B:0}, growth:{A:0,B:0}, profit:{A:0,B:0},
    finance:{A:0,B:0}, fcf:{A:0,B:0}, roe:{A:0,B:0},
    analyst:{A:0,B:0}, valuation:{A:0,B:0}, trend:{A:0,B:0}
  };

  // PE评分（科技股：PE>100视为高增长，不是简单越低越好）
  function scPE(d) {
    if (!d.pe || d.pe <= 0) return 4;
    var g = d.revenueGrowth || 0;
    // 用PEG逻辑：PE / (增速*100)，越低越合理
    if (d.peg && d.peg > 0) return d.peg < 1 ? 9 : d.peg < 1.5 ? 7 : d.peg < 2 ? 5 : d.peg < 3 ? 4 : 2;
    // 没有PEG用增长调整后的PE
    var adjPE = d.pe / (1 + g * 5); // 高增长打折
    return adjPE < 20 ? 9 : adjPE < 40 ? 7 : adjPE < 60 ? 5 : adjPE < 100 ? 4 : 2;
  }
  s.pe.A = scPE(dataA);
  s.pe.B = scPE(dataB);

  // 成长性（营收增速）
  function scG(g) { return g == null ? 5 : Math.min(10, Math.max(0, g * 30 + 3)); }
  s.growth.A = scG(dataA.revenueGrowth);
  s.growth.B = scG(dataB.revenueGrowth);

  // 盈利能力（毛利率+净利率）
  function scP(gm, pm) {
    var v = (gm != null ? gm * 12 : 5) + (pm != null ? pm * 18 : 3);
    return Math.min(10, Math.max(0, v));
  }
  s.profit.A = scP(dataA.grossMargin, dataA.profitMargin);
  s.profit.B = scP(dataB.grossMargin, dataB.profitMargin);

  // 财务稳健（D/E + 流动比率）
  function scF(d2e, cr) {
    var v = 5;
    if (d2e != null) v += d2e < 0.1 ? 3 : d2e < 0.3 ? 2 : d2e < 0.6 ? 1 : d2e < 1.0 ? 0 : -1;
    if (cr != null) v += cr > 3 ? 2 : cr > 2 ? 1 : cr > 1 ? 0 : -1;
    return Math.min(10, Math.max(1, v));
  }
  s.finance.A = scF(dataA.debtToEquity, dataA.currentRatio);
  s.finance.B = scF(dataB.debtToEquity, dataB.currentRatio);

  // 现金流
  function scFCF(fcf) {
    if (!fcf) return 5;
    return fcf > 5e10 ? 10 : fcf > 1e10 ? 9 : fcf > 5e9 ? 8 : fcf > 1e9 ? 6 : fcf > 0 ? 4 : 2;
  }
  s.fcf.A = scFCF(dataA.freeCashFlow);
  s.fcf.B = scFCF(dataB.freeCashFlow);

  // ROE
  function scROE(r) {
    if (r == null) return 5;
    return r > 0.5 ? 10 : r > 0.3 ? 9 : r > 0.2 ? 8 : r > 0.1 ? 6 : r > 0.05 ? 4 : r > 0 ? 2 : 1;
  }
  s.roe.A = scROE(dataA.roe);
  s.roe.B = scROE(dataB.roe);

  // 分析师共识
  function scAn(d) {
    var ac = d.analystCounts; if (!ac) return 5;
    var total = (ac.strongBuy||0)+(ac.buy||0)+(ac.hold||0)+(ac.sell||0)+(ac.strongSell||0);
    if (total === 0) return 5;
    var buyRatio = ((ac.strongBuy||0)+(ac.buy||0)) / total;
    var strongBuyBonus = (ac.strongBuy||0) / total * 2;
    return Math.min(10, buyRatio * 8 + strongBuyBonus + 1);
  }
  s.analyst.A = scAn(dataA);
  s.analyst.B = scAn(dataB);

  // 估值合理性（科技股用指数折现逻辑）
  function scV(d) {
    if (d.peg && d.peg > 0) {
      return d.peg < 0.8 ? 10 : d.peg < 1.2 ? 8 : d.peg < 1.8 ? 6 : d.peg < 2.5 ? 4 : 2;
    }
    if (d.pe && d.pe > 0 && d.revenueGrowth > 0) {
      var peg = d.pe / (d.revenueGrowth * 100);
      return peg < 1 ? 9 : peg < 1.5 ? 7 : peg < 2 ? 5 : peg < 3 ? 3 : 2;
    }
    if (d.pe && d.pe > 0) return d.pe < 15 ? 9 : d.pe < 25 ? 7 : d.pe < 40 ? 5 : 3;
    return 5;
  }
  s.valuation.A = scV(dataA);
  s.valuation.B = scV(dataB);

  // 成长趋势（三年营收/毛利率/研发趋势）
  function scTrend(d) {
    var v = 5;
    // 毛利率趋势
    if (d.grossMarginHistory && d.grossMarginHistory[2] != null && d.grossMarginHistory[0] != null) {
      var gmTrend = d.grossMarginHistory[2] - d.grossMarginHistory[0];
      if (gmTrend > 0.03) v += 1.5; else if (gmTrend > 0) v += 0.5; else if (gmTrend < -0.05) v -= 1.5; else if (gmTrend < 0) v -= 0.5;
    }
    // 营收趋势（近3年是否持续增长）
    if (d.revenueHistory && d.revenueHistory.length >= 3) {
      var r = d.revenueHistory;
      var grow1 = r[1].amount > r[0].amount;
      var grow2 = r[2].amount > r[1].amount;
      if (grow1 && grow2) v += 2; else if (grow2) v += 1; else if (!grow1 && !grow2) v -= 2;
    }
    // 净利率趋势
    if (d.netMarginHistory && d.netMarginHistory.length >= 3) {
      var nmTrend = d.netMarginHistory[2] - d.netMarginHistory[0];
      if (nmTrend > 0.05) v += 1.5; else if (nmTrend > 0) v += 0.5; else if (nmTrend < -0.1) v -= 1.5;
    }
    return Math.min(10, Math.max(1, v));
  }
  s.trend.A = scTrend(dataA);
  s.trend.B = scTrend(dataB);

  // 总分（9维）
  var dims = ['pe','growth','profit','finance','fcf','roe','analyst','valuation','trend'];
  s.totalA = 0; s.totalB = 0;
  for (var i = 0; i < dims.length; i++) {
    s.totalA += s[dims[i]].A;
    s.totalB += s[dims[i]].B;
  }
  s.totalA = Math.round(s.totalA * 10) / 10;
  s.totalB = Math.round(s.totalB * 10) / 10;
  return s;
}

// ============================================================
// 深度报告生成
// ============================================================
function generateDeepReport(dataA, dataB, scores) {
  var isCnA = dataA.market === 'CN';
  var isCnB = dataB.market === 'CN';

  // 上行空间
  var upsideA = dataA.targetMean && dataA.price ? ((dataA.targetMean / dataA.price - 1) * 100) : null;
  var upsideB = dataB.targetMean && dataB.price ? ((dataB.targetMean / dataB.price - 1) * 100) : null;

  var dimNames = {
    pe:'估值(PE/PEG)', growth:'营收成长性', profit:'盈利能力',

  };

  var dims = ['pe','growth','profit','finance','fcf','roe','analyst','valuation','trend'];
  var winA = 0, winB = 0;
  for (var i = 0; i < dims.length; i++) {
    if (scores[dims[i]].A > scores[dims[i]].B) winA++;
    else if (scores[dims[i]].B > scores[dims[i]].A) winB++;
  }

  var html = '';

  // ===== 一、核心结论 =====
  html += '<div class="report-section">';
  html += '<h2>一、核心结论</h2>';
  html += '<table class="report-table">';
  html += '<tr><th>维度</th><th>' + dataA.symbol + ' (' + dataA.name + ')</th><th>' + dataB.symbol + ' (' + dataB.name + ')</th><th>胜出</th></tr>';

  for (var i = 0; i < dims.length; i++) {
    var d = dims[i];
    var aVal = 'N/A', bVal = 'N/A';
    if (d === 'pe') { aVal = dataA.pe > 0 ? dataA.pe.toFixed(0)+'x' : 'N/A'; bVal = dataB.pe > 0 ? dataB.pe.toFixed(0)+'x' : 'N/A'; }
    else if (d === 'growth') { aVal = dataA.revenueGrowth != null ? fmtPct(dataA.revenueGrowth) : 'N/A'; bVal = dataB.revenueGrowth != null ? fmtPct(dataB.revenueGrowth) : 'N/A'; }
    else if (d === 'profit') { aVal = (dataA.grossMargin != null ? fmtPct(dataA.grossMargin)+'毛利' : '') + (dataA.profitMargin != null ? ' ' + fmtPct(dataA.profitMargin)+'净利' : ''); bVal = (dataB.grossMargin != null ? fmtPct(dataB.grossMargin)+'毛利' : '') + (dataB.profitMargin != null ? ' ' + fmtPct(dataB.profitMargin)+'净利' : ''); }
    else if (d === 'finance') { aVal = dataA.debtToEquity != null ? 'D/E '+dataA.debtToEquity.toFixed(2) : 'N/A'; bVal = dataB.debtToEquity != null ? 'D/E '+dataB.debtToEquity.toFixed(2) : 'N/A'; }
    else if (d === 'fcf') { aVal = dataA.freeCashFlow ? fmtNum(dataA.freeCashFlow) : 'N/A'; bVal = dataB.freeCashFlow ? fmtNum(dataB.freeCashFlow) : 'N/A'; }
    else if (d === 'roe') { aVal = dataA.roe != null ? fmtPct(dataA.roe) : 'N/A'; bVal = dataB.roe != null ? fmtPct(dataB.roe) : 'N/A'; }
    else if (d === 'analyst') {
      var acA = dataA.analystCounts; var acB = dataB.analystCounts;
      if (acA) { var tA = Object.values(acA).reduce(function(s,v){return s+v},0); aVal = (acA.strongBuy+acA.buy)+'/'+tA+'买'; }
      if (acB) { var tB = Object.values(acB).reduce(function(s,v){return s+v},0); bVal = (acB.strongBuy+acB.buy)+'/'+tB+'买'; }
    }
    else if (d === 'valuation') { aVal = dataA.peg ? 'PEG '+dataA.peg.toFixed(1) : (dataA.pe > 0 ? 'PE '+dataA.pe.toFixed(0) : 'N/A'); bVal = dataB.peg ? 'PEG '+dataB.peg.toFixed(1) : (dataB.pe > 0 ? 'PE '+dataB.pe.toFixed(0) : 'N/A'); }
    else if (d === 'trend') {
      function trendDesc(dd) {
        if (!dd.revenueHistory || dd.revenueHistory.length < 3) return 'N/A';
        var r = dd.revenueHistory;
        var g1 = ((r[1].amount/r[0].amount - 1)*100).toFixed(0);
        var g2 = ((r[2].amount/r[1].amount - 1)*100).toFixed(0);
        var sign1 = g1 >= 0 ? '+' : '';
        var sign2 = g2 >= 0 ? '+' : '';
        return r[0].year+'→'+r[1].year+':'+sign1+g1+'%<br>'+r[1].year+'→'+r[2].year+':'+sign2+g2+'%';
      }
      aVal = trendDesc(dataA); bVal = trendDesc(dataB);
    }

    var winner = scores[d].A > scores[d].B ? dataA.symbol : scores[d].B > scores[d].A ? dataB.symbol : '—';
    var wc = scores[d].A > scores[d].B ? 'style="color:#ffd700;font-weight:bold"' : scores[d].B > scores[d].A ? 'style="color:#00d4ff;font-weight:bold"' : '';
    html += '<tr><td>' + dimNames[d] + '<br><small style="color:#666">' + scores[d].A.toFixed(1) + ' / ' + scores[d].B.toFixed(1) + '</small></td><td>' + aVal + '</td><td>' + bVal + '</td><td '+wc+'>' + winner + '</td></tr>';
  }
  // 总分
  html += '<tr style="background:#1a1a0a"><td><b>综合总分</b></td><td><b style="color:' + (scores.totalA >= scores.totalB ? '#ffd700' : '#aaa') + '">' + scores.totalA.toFixed(1) + '</b></td><td><b style="color:' + (scores.totalB >= scores.totalA ? '#00d4ff' : '#aaa') + '">' + scores.totalB.toFixed(1) + '</b></td><td><b>' + (scores.totalA > scores.totalB ? '<span style="color:#ffd700">'+dataA.symbol+'</span>' : scores.totalB > scores.totalA ? '<span style="color:#00d4ff">'+dataB.symbol+'</span>' : '平局') + '</b></td></tr>';
  html += '</table>';

  // 三年毛利率对比
  html += '<h3 style="margin-top:14px">📊 三年毛利率趋势</h3>';
  html += '<table class="report-table"><tr><th>年份</th><th>' + dataA.symbol + ' 毛利率</th><th>' + dataB.symbol + ' 毛利率</th></tr>';
  var gmYears = [2022, 2023, 2024];
  for (var y = 0; y < 3; y++) {
    var gmA = dataA.grossMarginHistory ? dataA.grossMarginHistory[y] : null;
    var gmB = dataB.grossMarginHistory ? dataB.grossMarginHistory[y] : null;
    var arrowA = '', arrowB = '';
    if (y > 0) {
      var prevA = dataA.grossMarginHistory ? dataA.grossMarginHistory[y-1] : null;
      var prevB = dataB.grossMarginHistory ? dataB.grossMarginHistory[y-1] : null;
      if (gmA != null && prevA != null) arrowA = gmA > prevA ? ' <span class="up">▲</span>' : gmA < prevA ? ' <span class="down">▼</span>' : ' —';
      if (gmB != null && prevB != null) arrowB = gmB > prevB ? ' <span class="up">▲</span>' : gmB < prevB ? ' <span class="down">▼</span>' : ' —';
    }
    html += '<tr><td>' + gmYears[y] + '</td><td>' + (gmA != null ? (gmA*100).toFixed(1)+'%' + arrowA : 'N/A') + '</td><td>' + (gmB != null ? (gmB*100).toFixed(1)+'%' + arrowB : 'N/A') + '</td></tr>';
  }
  html += '</table>';

  // 三年研发费用对比
  html += '<h3 style="margin-top:14px">🔬 三年研发费用趋势</h3>';

  for (var y = 0; y < 3; y++) {
    var rdA = dataA.rdHistory ? dataA.rdHistory[y] : null;
    var rdB = dataB.rdHistory ? dataB.rdHistory[y] : null;
    var rdRatioA = dataA.rdToRevenue ? dataA.rdToRevenue[y] : null;
    var rdRatioB = dataB.rdToRevenue ? dataB.rdToRevenue[y] : null;
    html += '<tr><td>' + (rdA ? rdA.year : gmYears[y]) + '</td>';
    html += '<td>' + (rdA && rdA.amount > 0 ? '$' + fmtNum(rdA.amount * 1e6) : rdA ? 'N/A' : 'N/A') + '</td>';
    html += '<td>' + (rdRatioA != null ? (rdRatioA*100).toFixed(1)+'%' : 'N/A') + '</td>';
    html += '<td>' + (rdB && rdB.amount > 0 ? (dataB.currency === 'CNY' ? '¥' : '$') + fmtNum(rdB.amount * 1e6) : rdB ? 'N/A' : 'N/A') + '</td>';
    html += '<td>' + (rdRatioB != null ? (rdRatioB*100).toFixed(1)+'%' : 'N/A') + '</td></tr>';
  }
  html += '</table>';

  // 结论
  var winner = scores.totalA > scores.totalB + 2 ? 'A' : scores.totalB > scores.totalA + 2 ? 'B' : 'tie';
  html += '<div class="verdict-box" style="margin-top:12px">';
  if (winner === 'A') html += '<p>🏆 <b style="color:#ffd700">' + dataA.symbol + '</b> 综合评分更高（' + scores.totalA.toFixed(1) + ' vs ' + scores.totalB.toFixed(1) + '），在 ' + winA + '/9 维度胜出。</p>';
  else if (winner === 'B') html += '<p>🏆 <b style="color:#00d4ff">' + dataB.symbol + '</b> 综合评分更高（' + scores.totalB.toFixed(1) + ' vs ' + scores.totalA.toFixed(1) + '），在 ' + winB + '/9 维度胜出。</p>';
  else html += '<p>⚖️ 两只股票综合评分接近（' + scores.totalA.toFixed(1) + ' vs ' + scores.totalB.toFixed(1) + '），各有优势。</p>';

  html += '<tr><td>市值</td><td>' + (dataA.marketCap ? (dataA.currency==='CNY'?'¥':'$') + fmtNum(dataA.marketCap) : 'N/A') + '</td><td>' + (dataB.marketCap ? (dataB.currency==='CNY'?'¥':'$') + fmtNum(dataB.marketCap) : 'N/A') + '</td></tr>';

  priceB += '</span>';
  html += '<tr><td>当前股价<br><small style="color:#666">2026-06-03盘后</small></td><td>' + priceA + '</td><td>' + priceB + '</td></tr>';
  html += '<tr><td>52周高/低</td><td>' + (dataA.week52High ? fmtPrice(dataA.week52High, dataA.currency)+' / '+fmtPrice(dataA.week52Low, dataA.currency) : 'N/A') + '</td><td>' + (dataB.week52High ? fmtPrice(dataB.week52High, dataB.currency)+' / '+fmtPrice(dataB.week52Low, dataB.currency) : 'N/A') + '</td></tr>';
  html += '</table>';

  if (dataA.business || dataB.business) {
    html += '<h3>业务定位</h3>';
    html += '<p style="color:#ccc;line-height:1.8"><b style="color:#ffd700">' + dataA.symbol + '：</b>' + (dataA.business||'N/A') + '</p>';
    html += '<p style="color:#ccc;line-height:1.8"><b style="color:#00d4ff">' + dataB.symbol + '：</b>' + (dataB.business||'N/A') + '</p>';
  }
  if (dataA.moat || dataB.moat) {
    html += '<h3>护城河</h3>';
    html += '<p style="color:#ccc;line-height:1.8"><b style="color:#ffd700">' + dataA.symbol + '：</b>' + (dataA.moat||'N/A') + '</p>';
    html += '<p style="color:#ccc;line-height:1.8"><b style="color:#00d4ff">' + dataB.symbol + '：</b>' + (dataB.moat||'N/A') + '</p>';
  }
  // 长期持有逻辑
  if (dataA.longTermView || dataB.longTermView) {
    html += '<h3>长期持有逻辑</h3>';
    if (dataA.longTermView) html += '<p style="color:#ccc;line-height:1.8;background:#0a0a1a;border-radius:8px;padding:10px;margin:4px 0"><b style="color:#ffd700">' + dataA.symbol + '：</b>' + dataA.longTermView + '</p>';
    if (dataB.longTermView) html += '<p style="color:#ccc;line-height:1.8;background:#0a0a1a;border-radius:8px;padding:10px;margin:4px 0"><b style="color:#00d4ff">' + dataB.symbol + '：</b>' + dataB.longTermView + '</p>';
  }
  html += '</div>';

  // ===== 三、财务数据 =====
  html += '<div class="report-section">';
  html += '<h2>三、财务数据对比</h2>';
  html += '<table class="report-table">';
  html += '<tr><th>指标</th><th>' + dataA.symbol + '</th><th>' + dataB.symbol + '</th><th>对比</th></tr>';

  function addRow(label, aStr, bStr, aRaw, bRaw, lowerBetter) {
    var cmp = '';
    if (aRaw != null && bRaw != null && !isNaN(aRaw) && !isNaN(bRaw)) {
      if (lowerBetter) cmp = aRaw < bRaw ? '✅ A优' : bRaw < aRaw ? '✅ B优' : '=';
      else cmp = aRaw > bRaw ? '✅ A优' : bRaw > aRaw ? '✅ B优' : '=';
    }
    html += '<tr><td>' + label + '</td><td>' + (aStr||'N/A') + '</td><td>' + (bStr||'N/A') + '</td><td>' + cmp + '</td></tr>';
  }

  addRow('股价（盘后）', fmtPrice(dataA.price, dataA.currency), fmtPrice(dataB.price, dataB.currency), null, null, false);
  addRow('PE (TTM)', dataA.pe > 0 ? dataA.pe.toFixed(0)+'x' : 'N/A', dataB.pe > 0 ? dataB.pe.toFixed(0)+'x' : 'N/A', null, null, false);
  addRow('远期PE', dataA.forwardPe ? dataA.forwardPe.toFixed(0)+'x' : 'N/A', dataB.forwardPe ? dataB.forwardPe.toFixed(0)+'x' : 'N/A', null, null, false);
  addRow('PEG', dataA.peg ? dataA.peg.toFixed(1) : 'N/A', dataB.peg ? dataB.peg.toFixed(1) : 'N/A', dataA.peg, dataB.peg, true);
  addRow('PB', dataA.pb ? dataA.pb.toFixed(1)+'x' : 'N/A', dataB.pb ? dataB.pb.toFixed(1)+'x' : 'N/A', null, null, false);
  addRow('PS', dataA.ps ? dataA.ps.toFixed(1)+'x' : 'N/A', dataB.ps ? dataB.ps.toFixed(1)+'x' : 'N/A', null, null, false);
  html += '<tr style="background:#0f0f2a"><td colspan="4" style="text-align:left;padding:8px 6px;color:#ffd700;font-size:13px">── 盈利能力 ──</td></tr>';
  addRow('毛利率', dataA.grossMargin != null ? fmtPct(dataA.grossMargin) : 'N/A', dataB.grossMargin != null ? fmtPct(dataB.grossMargin) : 'N/A', dataA.grossMargin, dataB.grossMargin, false);
  addRow('净利润率', dataA.profitMargin != null ? fmtPct(dataA.profitMargin) : 'N/A', dataB.profitMargin != null ? fmtPct(dataB.profitMargin) : 'N/A', dataA.profitMargin, dataB.profitMargin, false);
  addRow('经营利润率', dataA.operatingMargin != null ? fmtPct(dataA.operatingMargin) : 'N/A', dataB.operatingMargin != null ? fmtPct(dataB.operatingMargin) : 'N/A', dataA.operatingMargin, dataB.operatingMargin, false);
  html += '<tr style="background:#0f0f2a"><td colspan="4" style="text-align:left;padding:8px 6px;color:#ffd700;font-size:13px">── 成长性 ──</td></tr>';
  addRow('营收增速(YoY)', dataA.revenueGrowth != null ? fmtPct(dataA.revenueGrowth) : 'N/A', dataB.revenueGrowth != null ? fmtPct(dataB.revenueGrowth) : 'N/A', dataA.revenueGrowth, dataB.revenueGrowth, false);
  addRow('净利润增速', dataA.earningsGrowth != null ? fmtPct(dataA.earningsGrowth) : 'N/A', dataB.earningsGrowth != null ? fmtPct(dataB.earningsGrowth) : 'N/A', dataA.earningsGrowth, dataB.earningsGrowth, false);
  html += '<tr style="background:#0f0f2a"><td colspan="4" style="text-align:left;padding:8px 6px;color:#ffd700;font-size:13px">── 财务健康 ──</td></tr>';
  addRow('ROE', dataA.roe != null ? fmtPct(dataA.roe) : 'N/A', dataB.roe != null ? fmtPct(dataB.roe) : 'N/A', dataA.roe, dataB.roe, false);
  addRow('债务/权益(D/E)', dataA.debtToEquity != null ? dataA.debtToEquity.toFixed(2) : 'N/A', dataB.debtToEquity != null ? dataB.debtToEquity.toFixed(2) : 'N/A', dataA.debtToEquity, dataB.debtToEquity, true);
  addRow('流动比率', dataA.currentRatio != null ? dataA.currentRatio.toFixed(2) : 'N/A', dataB.currentRatio != null ? dataB.currentRatio.toFixed(2) : 'N/A', dataA.currentRatio, dataB.currentRatio, false);
  addRow('自由现金流', dataA.freeCashFlow ? fmtNum(dataA.freeCashFlow) : 'N/A', dataB.freeCashFlow ? fmtNum(dataB.freeCashFlow) : 'N/A', dataA.freeCashFlow, dataB.freeCashFlow, false);
  addRow('Beta', dataA.beta != null ? dataA.beta.toFixed(2) : 'N/A', dataB.beta != null ? dataB.beta.toFixed(2) : 'N/A', null, null, false);

  html += '</table></div>';

  // ===== 四、估值分析（科技股指数增长逻辑）=====
  html += '<div class="report-section">';
  html += '<h2>四、估值分析</h2>';
  html += '<p style="color:#888;font-size:13px;margin-bottom:10px">💡 科技高成长股用指数折现逻辑：若年增速 g%，N年后利润=当前×(1+g%)^N；合理PE需折现该增长序列。对于>50%增速的公司，当前高PE可能是合理的。</p>';

  function valuationDetail(d, clr) {
    html += '<div style="background:#0a0a1a;border:1px solid #222;border-radius:10px;padding:12px;margin:8px 0">';
    html += '<div style="font-size:17px;font-weight:bold;color:' + clr + ';margin-bottom:8px">' + d.symbol + '</div>';
    if (d.pe > 0) {
      var lv = d.pe > 150 ? '极高' : d.pe > 80 ? '很高' : d.pe > 40 ? '偏高' : d.pe > 20 ? '合理' : '偏低';
      html += '<p>PE ' + d.pe.toFixed(0) + 'x — 当前估值<b>' + lv + '</b>';
      if (d.forwardPe) html += '，远期PE ' + d.forwardPe.toFixed(0) + 'x';
      html += '</p>';
    }
    if (d.peg) {
      html += '<p>PEG ' + d.peg.toFixed(1) + '（' + (d.peg < 1 ? '低估' : d.peg < 1.5 ? '合理' : d.peg < 2.5 ? '偏高' : '高估') + '）</p>';
    } else if (d.pe > 0 && d.revenueGrowth > 0) {
      var implPeg = d.pe / (d.revenueGrowth * 100);
      html += '<p>隐含PEG ≈ ' + implPeg.toFixed(1) + '（' + (implPeg < 1 ? '估值低' : implPeg < 1.5 ? '估值合理' : implPeg < 2.5 ? '偏高' : '高估') + '）</p>';
    }
    // 指数增长分析：用当前PE算，增速g%下，5年后理论PE
    if (d.pe > 0 && d.revenueGrowth > 0) {
      var g = d.revenueGrowth;
      var profitGrowth5Y = Math.pow(1 + g, 5);
      var pe5Y = d.pe / profitGrowth5Y;
      html += '<p>📈 指数增长测试：若营收维持 <b>' + fmtPct(g) + '</b> 年增速，5年后利润是现在的 <b>' + profitGrowth5Y.toFixed(1) + 'x</b>，届时有效PE约 <b>' + pe5Y.toFixed(0) + 'x</b>（' + (pe5Y < 20 ? '届时估值合理' : pe5Y < 35 ? '届时估值尚可' : '届时仍偏贵，增速需更快') + '）</p>';
    }
    if (d.targetMean && d.price) {
      var ups = (d.targetMean / d.price - 1) * 100;
      html += '<p>机构目标价 <b>' + fmtPrice(d.targetMean, d.currency) + '</b>，上行空间 <b class="' + (ups > 0 ? 'up' : 'down') + '">' + (ups > 0 ? '+' : '') + ups.toFixed(1) + '%</b>';
      if (d.targetHigh && d.targetLow) html += '<br>区间：' + fmtPrice(d.targetLow, d.currency) + ' ~ ' + fmtPrice(d.targetHigh, d.currency);
      html += '</p>';
    }
    html += '</div>';
  }

  valuationDetail(dataA, '#ffd700');
  valuationDetail(dataB, '#00d4ff');

  if (dataA.pe > 0 && dataB.pe > 0) {
    html += '<div class="verdict-box">';
    html += '<p><b>估值对比：</b>';
    if (dataA.peg && dataB.peg) {
      if (dataA.peg < dataB.peg) html += dataA.symbol + ' PEG(' + dataA.peg.toFixed(1) + ') 低于 ' + dataB.symbol + ' PEG(' + dataB.peg.toFixed(1) + ')，估值效率更高。';
      else if (dataB.peg < dataA.peg) html += dataB.symbol + ' PEG(' + dataB.peg.toFixed(1) + ') 低于 ' + dataA.symbol + ' PEG(' + dataA.peg.toFixed(1) + ')，估值效率更高。';
      else html += '两者PEG相近，估值效率相当。';
    } else {
      html += '需综合考量增速与估值匹配度。';
    }
    html += '</p></div>';
  }
  html += '</div>';

  // ===== 五、分析师共识 =====
  html += '<div class="report-section">';
  html += '<h2>五、分析师共识</h2>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';

  function analystDetail(d, clr) {
    var ac = d.analystCounts;
    if (!ac) { html += '<div style="background:#0a0a1a;border-radius:10px;padding:12px"><p style="color:#888">暂无数据</p></div>'; return; }
    var total = (ac.strongBuy||0)+(ac.buy||0)+(ac.hold||0)+(ac.sell||0)+(ac.strongSell||0);
    if (total === 0) { html += '<div style="background:#0a0a1a;border-radius:10px;padding:12px"><p style="color:#888">暂无数据</p></div>'; return; }
    var buyPct = ((ac.strongBuy||0)+(ac.buy||0)) / total * 100;
    var cns = buyPct >= 75 ? '强烈看多' : buyPct >= 55 ? '偏多' : buyPct >= 35 ? '中性' : '偏空';
    var cnsColor = buyPct >= 75 ? '#4cff4c' : buyPct >= 55 ? '#a8ffa8' : buyPct >= 35 ? '#ffd700' : '#ff6666';

    html += '<div style="background:#0a0a1a;border:1px solid #222;border-radius:10px;padding:12px">';
    html += '<div style="text-align:center;margin-bottom:6px"><span style="font-size:17px;font-weight:bold;color:' + clr + '">' + d.symbol + '</span> · <span style="color:#aaa">' + total + '位分析师</span></div>';
    html += '<div style="text-align:center;margin-bottom:8px"><span style="color:' + cnsColor + ';font-weight:bold">' + cns + '</span> · 买入共识 ' + buyPct.toFixed(0) + '%</div>';

    // 评级条
    var bars = [
      {label:'强买', count:ac.strongBuy||0, color:'#00bb33'},
      {label:'买入', count:ac.buy||0, color:'#55dd77'},
      {label:'持有', count:ac.hold||0, color:'#777'},
      {label:'卖出', count:ac.sell||0, color:'#dd5555'},
      {label:'强卖', count:ac.strongSell||0, color:'#aa0000'}
    ];
    html += '<div style="margin:6px 0">';
    for (var b = 0; b < bars.length; b++) {
      if (bars[b].count === 0) continue;
      var pct = (bars[b].count / total * 100).toFixed(0);
      html += '<div style="display:flex;align-items:center;gap:6px;margin:3px 0">';
      html += '<span style="min-width:28px;font-size:12px;color:#aaa">' + bars[b].label + '</span>';
      html += '<div class="trend-bar-wrap" style="flex:1"><div class="trend-bar" style="width:' + pct + '%;background:' + bars[b].color + '"></div></div>';
      html += '<span style="min-width:24px;font-size:13px;color:#ccc">' + bars[b].count + '</span>';
      html += '</div>';
    }
    html += '</div>';

    // ★ 目标价（基于实际股价计算上行空间）
    if (d.targetMean && d.price) {
      var ups = (d.targetMean / d.price - 1) * 100;
      html += '<div style="text-align:center;font-size:14px;margin-top:6px">目标价均值 <b>' + fmtPrice(d.targetMean, d.currency) + '</b>';
      html += '｜上行空间 <b class="' + (ups > 0 ? 'up' : 'down') + '">' + (ups > 0 ? '+' : '') + ups.toFixed(1) + '%</b></div>';
      if (d.targetHigh && d.targetLow) {
        html += '<div style="text-align:center;font-size:12px;color:#888">区间：' + fmtPrice(d.targetLow, d.currency) + ' ~ ' + fmtPrice(d.targetHigh, d.currency) + '</div>';
      }
    }
    html += '</div>';
  }

  analystDetail(dataA, '#ffd700');
  analystDetail(dataB, '#00d4ff');
  html += '</div></div>';

  // ===== 六、成长趋势分析（新增）=====
  html += '<div class="report-section">';
  html += '<h2>六、成长趋势分析（三年）</h2>';
  html += '<table class="report-table">';
  html += '<tr><th>指标</th><th>年份</th><th>' + dataA.symbol + '</th><th>' + dataB.symbol + '</th></tr>';

  // 营收对比
  for (var y = 0; y < 3; y++) {
    var rA = dataA.revenueHistory ? dataA.revenueHistory[y] : null;
    var rB = dataB.revenueHistory ? dataB.revenueHistory[y] : null;
    var rowLabel = y === 0 ? '营收' : '';
    var yr = rA ? rA.year : (rB ? rB.year : gmYears[y]);
    var rValA = rA ? (dataA.currency === 'CNY' ? '¥' : '$') + fmtNum(rA.amount * 1e6) : 'N/A';
    var rValB = rB ? (dataB.currency === 'CNY' ? '¥' : '$') + fmtNum(rB.amount * 1e6) : 'N/A';
    // 增长率
    var growA = (y > 0 && dataA.revenueHistory && dataA.revenueHistory[y-1].amount > 0) ? ((dataA.revenueHistory[y].amount / dataA.revenueHistory[y-1].amount - 1)*100) : null;
    var growB = (y > 0 && dataB.revenueHistory && dataB.revenueHistory[y-1].amount > 0) ? ((dataB.revenueHistory[y].amount / dataB.revenueHistory[y-1].amount - 1)*100) : null;
    if (growA != null) rValA += ' <span style="font-size:12px;color:' + (growA >= 0 ? '#ff4444' : '#4cff4c') + '">' + (growA >= 0 ? '+' : '') + growA.toFixed(0) + '%</span>';
    if (growB != null) rValB += ' <span style="font-size:12px;color:' + (growB >= 0 ? '#ff4444' : '#4cff4c') + '">' + (growB >= 0 ? '+' : '') + growB.toFixed(0) + '%</span>';
    html += '<tr><td>' + rowLabel + '</td><td>' + yr + '</td><td>' + rValA + '</td><td>' + rValB + '</td></tr>';
  }
  // 毛利率趋势
  for (var y = 0; y < 3; y++) {
    var gmA = dataA.grossMarginHistory ? dataA.grossMarginHistory[y] : null;
    var gmB = dataB.grossMarginHistory ? dataB.grossMarginHistory[y] : null;
    var rowLabel = y === 0 ? '毛利率' : '';
    html += '<tr><td>' + rowLabel + '</td><td>' + gmYears[y] + '</td><td>' + (gmA != null ? (gmA*100).toFixed(1)+'%' : 'N/A') + '</td><td>' + (gmB != null ? (gmB*100).toFixed(1)+'%' : 'N/A') + '</td></tr>';
  }
  // 净利率趋势
  for (var y = 0; y < 3; y++) {
    var nmA = dataA.netMarginHistory ? dataA.netMarginHistory[y] : null;
    var nmB = dataB.netMarginHistory ? dataB.netMarginHistory[y] : null;
    var rowLabel = y === 0 ? '净利率' : '';
    html += '<tr><td>' + rowLabel + '</td><td>' + gmYears[y] + '</td><td>' + (nmA != null ? (nmA*100).toFixed(1)+'%' : 'N/A') + '</td><td>' + (nmB != null ? (nmB*100).toFixed(1)+'%' : 'N/A') + '</td></tr>';
  }
  html += '</table>';

  // 趋势小结
  html += '<div class="verdict-box" style="margin-top:10px">';
  html += '<p><b>成长趋势小结：</b>';
  var trendFindings = [];
  if (dataA.revenueHistory && dataA.revenueHistory.length >= 3) {
    var ra = dataA.revenueHistory;
    var cagr3A = Math.pow(ra[2].amount / ra[0].amount, 1/2) - 1;
    trendFindings.push(dataA.symbol + ' 两年营收CAGR: ' + (cagr3A*100).toFixed(0) + '%');
  }
  if (dataB.revenueHistory && dataB.revenueHistory.length >= 3) {
    var rb = dataB.revenueHistory;
    var cagr3B = Math.pow(rb[2].amount / rb[0].amount, 1/2) - 1;
    trendFindings.push(dataB.symbol + ' 两年营收CAGR: ' + (cagr3B*100).toFixed(0) + '%');
  }
  if (trendFindings.length > 0) html += trendFindings.join('；') + '。';
  html += '</p></div></div>';

  // ===== 七、投资风险 =====
  html += '<div class="report-section">';
  html += '<h2>七、投资风险</h2>';
  function riskSection(d, clr) {
    html += '<h3 style="color:' + clr + '">' + d.symbol + ' 主要风险</h3>';
    if (d.risks && d.risks.length > 0) {
      for (var j = 0; j < d.risks.length; j++) html += '<div class="risk-item">' + (j+1) + '. ' + d.risks[j] + '</div>';
    } else html += '<p style="color:#888">暂无风险数据</p>';
  }
  riskSection(dataA, '#ffd700');
  riskSection(dataB, '#00d4ff');
  html += '</div>';

  // ===== 八、核心优势 =====
  html += '<div class="report-section">';
  html += '<h2>八、核心优势</h2>';
  function strengthSection(d, clr) {
    html += '<h3 style="color:' + clr + '">' + d.symbol + ' 核心优势</h3>';
    if (d.strengths && d.strengths.length > 0) {
      for (var j = 0; j < d.strengths.length; j++) html += '<div class="strength-item">' + (j+1) + '. ' + d.strengths[j] + '</div>';
    } else html += '<p style="color:#888">暂无数据</p>';
  }
  strengthSection(dataA, '#ffd700');
  strengthSection(dataB, '#00d4ff');
  html += '</div>';

  // ===== 九、最终投资建议 =====
  html += '<div class="report-section">';
  html += '<h2>九、最终投资建议</h2>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';

  function adviceBox(d, sTotal, oTotal, clr) {
    html += '<div style="background:#0a0a1a;border:1px solid #333;border-radius:10px;padding:12px">';
    html += '<div style="font-size:18px;font-weight:bold;color:' + clr + ';margin-bottom:8px">' + d.symbol + '</div>';
    if (d.pe > 0) {
      var peLv = d.pe > 150 ? '⚠️ 估值极高' : d.pe > 80 ? '⚠️ 估值很高' : d.pe > 40 ? '⚡ 估值偏高' : '✅ 估值合理';
      html += '<p>' + peLv + '（PE ' + d.pe.toFixed(0) + 'x）</p>';
    }
    if (d.revenueGrowth != null) {
      var gLv = d.revenueGrowth > 0.5 ? '🚀 超高成长' : d.revenueGrowth > 0.2 ? '✅ 高成长' : d.revenueGrowth > 0.05 ? '📊 稳健成长' : d.revenueGrowth > 0 ? '⚡ 低增速' : '⚠️ 营收下滑';
      html += '<p>' + gLv + '（' + fmtPct(d.revenueGrowth) + '）</p>';
    }
    if (d.grossMargin != null) {
      var gmLv = d.grossMargin > 0.7 ? '✅ 毛利率极高' : d.grossMargin > 0.4 ? '✅ 毛利率良好' : d.grossMargin > 0.2 ? '⚡ 毛利率一般' : '⚠️ 毛利率偏低';
      html += '<p>' + gmLv + '（' + fmtPct(d.grossMargin) + '）</p>';
    }
    if (d.targetMean && d.price) {
      var ups = (d.targetMean / d.price - 1) * 100;
      html += '<p>机构目标上行：<b class="' + (ups > 0 ? 'up' : 'down') + '">' + (ups > 0 ? '+' : '') + ups.toFixed(1) + '%</b></p>';
    }
    var rating, stars;
    if (sTotal > oTotal + 5) { rating = '强烈推荐'; stars = '⭐⭐⭐⭐⭐'; }
    else if (sTotal > oTotal + 2) { rating = '推荐买入'; stars = '⭐⭐⭐⭐'; }
    else if (sTotal > oTotal) { rating = '谨慎买入'; stars = '⭐⭐⭐'; }
    else if (sTotal === oTotal) { rating = '持有观望'; stars = '⭐⭐⭐'; }
    else if (sTotal < oTotal - 2) { rating = '暂不推荐'; stars = '⭐⭐'; }
    else { rating = '谨慎'; stars = '⭐⭐'; }
    html += '<p style="font-size:16px;margin-top:8px">' + stars + ' <b style="color:' + clr + '">' + rating + '</b></p>';
    html += '</div>';
  }

  adviceBox(dataA, scores.totalA, scores.totalB, '#ffd700');
  adviceBox(dataB, scores.totalB, scores.totalA, '#00d4ff');
  html += '</div>';

  html += '<div class="verdict-box" style="margin-top:12px">';
  html += '<p><b>综合判断：</b>';
  if (scores.totalA > scores.totalB + 4) {
    html += dataA.symbol + ' 综合评分显著优于 ' + dataB.symbol + '（+' + (scores.totalA - scores.totalB).toFixed(1) + '分），在大多数维度领先。';
  } else if (scores.totalB > scores.totalA + 4) {
    html += dataB.symbol + ' 综合评分显著优于 ' + dataA.symbol + '（+' + (scores.totalB - scores.totalA).toFixed(1) + '分），在大多数维度领先。';
  } else {
    html += '两只股票综合评分接近（差距 ' + Math.abs(scores.totalA - scores.totalB).toFixed(1) + '分），选择应基于：①对增长赛道的判断；②估值与增速的匹配度（PEG）；③自身风险偏好（Beta）。';
  }
  html += '</p>';
  html += '<p style="color:#666;font-size:13px;margin-top:8px">⚠️ 以上为数据模型分析，不构成投资建议。股市有风险，投资需谨慎。<br>数据说明：内置数据基于2026-06-03公开信息，股价为盘后价格。</p>';
  html += '</div></div>';

  return html;
}

function getStaticData(symbol) {
  var s = symbol.trim().toUpperCase();
  if (STATIC_DATA[s]) {
    var d = {};
    for (var k in STATIC_DATA[s]) d[k] = STATIC_DATA[s][k];
    d.market = detectMarket(s);
    d.dataSource = 'static';
    return d;
  }
  return null;
}

async function fetchFinnhubData(symbol) {
  var key = getFinnhubKey();
  if (!key) return {error: 'NO_KEY', symbol: symbol};
  try {
    var quoteUrl   = 'https://finnhub.io/api/v1/quote?symbol=' + symbol + '&token=' + key;
    var profileUrl = 'https://finnhub.io/api/v1/stock/profile2?symbol=' + symbol + '&token=' + key;
    var metricUrl  = 'https://finnhub.io/api/v1/stock/metric?symbol=' + symbol + '&metric=all&token=' + key;
    var recUrl     = 'https://finnhub.io/api/v1/stock/recommendation?symbol=' + symbol + '&token=' + key;
    var ptUrl      = 'https://finnhub.io/api/v1/stock/price-target?symbol=' + symbol + '&token=' + key;

    var fetchOne = async function(url) {
      try { var r = await fetch(url, {signal: AbortSignal.timeout(8000)}); return r.ok ? await r.json() : {}; } catch(e) { return {}; }
    };
    var [quote, profile, metricData, recommends, pt] = await Promise.all([quoteUrl, profileUrl, metricUrl, recUrl, ptUrl].map(fetchOne));

    var m = (metricData && metricData.metric) || {};
    var d = {
      symbol: symbol, name: profile.name || symbol,
      currency: profile.currency || 'USD', exchange: profile.exchange || '',
      price: quote.c || null, prevClose: quote.pc || null, changePct: quote.dp || null,
      marketCap: profile.marketCapitalization ? profile.marketCapitalization * 1e6 : null,
      market: 'US', dataSource: 'finnhub',
      pe: m.peBasicExclExtraTTM || null, forwardPe: m['peExclExtraAnnual'] || null,
      peg: m['pegForwardPeBasicExclExtraAnnual'] || null,
      pb: m['pbAnnual'] || null, ps: m['psAnnual'] || null,
      revenueGrowth: m.revenueGrowthTTMYoy ? m.revenueGrowthTTMYoy / 100 : null,
      earningsGrowth: m.epsGrowthTTMYoy ? m.epsGrowthTTMYoy / 100 : null,
      grossMargin: m.grossMarginTTM ? m.grossMarginTTM / 100 : null,
      profitMargin: m.netProfitMarginTTM ? m.netProfitMarginTTM / 100 : null,
      operatingMargin: m.operatingMarginTTM ? m.operatingMarginTTM / 100 : null,
      roe: m.roeTTM ? m.roeTTM / 100 : null,
      debtToEquity: m.totalDebtEquityQuarterly || null,
      currentRatio: m.currentRatioQuarterly || null,
      freeCashFlow: m.freeCashFlowTTM ? m.freeCashFlowTTM * 1e6 : null,
      operatingCashFlow: m.cashFlowFromOperationsTTM ? m.cashFlowFromOperationsTTM * 1e6 : null,
      week52High: m['52WeekHigh'] || null, week52Low: m['52WeekLow'] || null,
      beta: m.beta || null, industry: profile.finnhubIndustry || null
    };
    if (Array.isArray(recommends) && recommends.length > 0) {
      var lat = recommends[0];
      d.analystCounts = {strongBuy: lat.strongBuy||0, buy: lat.buy||0, hold: lat.hold||0, sell: lat.sell||0, strongSell: lat.strongSell||0};
    }
    if (pt) { d.targetMean = pt.targetMean||null; d.targetHigh = pt.targetHigh||null; d.targetLow = pt.targetLow||null; }
    return d;
  } catch(e) {
    return {error: 'FETCH_ERROR', symbol: symbol, msg: e.message};
  }
}

async function fetchStockData(symbol) {
  var st = getStaticData(symbol);
  if (st) return st;
  var fh = await fetchFinnhubData(symbol);
  if (!fh.error) return fh;
  return {symbol: symbol, error: 'UNSUPPORTED', market: detectMarket(symbol)};
}

// ============================================================
// 主流程
// ============================================================
function quickCompare(a, b) {
  document.getElementById('tickerA').value = a;
  document.getElementById('tickerB').value = b;
  compare();
}

async function compare() {
  var codeA = document.getElementById('tickerA').value.trim().toUpperCase();
  var codeB = document.getElementById('tickerB').value.trim().toUpperCase();
  if (!codeA || !codeB) { showError('请输入两只股票的代码'); return; }
  showLoading(true);
  hideError();
  document.getElementById('result').innerHTML = '';
  setTimeout(async function() {
    var dataA = await fetchStockData(codeA);
    var dataB = await fetchStockData(codeB);
    var errMsg = '';
    if (dataA.error === 'UNSUPPORTED') errMsg += '「' + codeA + '」不在预设列表，且未配置 Finnhub API Key。\n请点"设置"填入 Key 后重试。\n\n';
    if (dataA.error === 'FETCH_ERROR') errMsg += '获取「' + codeA + '」数据失败：' + (dataA.msg||'网络错误') + '\n\n';
    if (dataB.error === 'FETCH_ERROR') errMsg += '获取「' + codeB + '」数据失败：' + (dataB.msg||'网络错误') + '\n';
    if (dataB.error === 'UNSUPPORTED') errMsg += '「' + codeB + '」不在预设列表，且未配置 Finnhub API Key。\n请点"设置"填入 Key 后重试。';
    if (errMsg) {
      showError(errMsg + '\n\n💡 预设股票（ARM/MRVL/NVDA/MSFT/GOOGL/AAPL/AVGO/AMD + A股8只）可直接使用，无需Key。');
      showLoading(false); return;
    }
    var scores = score(dataA, dataB);
    var html = generateDeepReport(dataA, dataB, scores);
    document.getElementById('result').innerHTML = html;
    showLoading(false);
  }, 100);
}

function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
  document.getElementById('searchBtn').disabled = show;
}

function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('error').classList.remove('show');
}
