.search-btn{padding:14px 20px;font-size:18px;background:#e94560;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:bold;white-space:nowrap;flex-shrink:0}

.search-btn:disabled{background:#555;cursor:not-allowed}

/* 预设按钮区 */
.presets-section{margin:10px 0}
.presets-label{font-size:14px;color:#888;text-align:center;margin-bottom:6px}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.preset-btn{padding:6px 12px;font-size:14px;background:#1a1a3a;border:1px solid #333;color:#aaa;border-radius:14px;cursor:pointer}
.preset-btn:hover{background:#222255;border-color:#00d4ff;color:#00d4ff}
.preset-btn.cn{border-color:#442222;color:#cc6666}
.preset-btn.cn:hover{border-color:#e94560;color:#ff8888}
.preset-hint{font-size:12px;color:#555;text-align:center;margin-top:4px}

#apiSettings{display:none;background:#111133;border:1px solid #222266;border-radius:10px;padding:12px;margin:8px 0}

#apiSettings button{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:bold}
#apiSettings .save-btn{background:#4cff4c;color:#000}
#apiSettings .close-btn{background:#333;color:#ccc}

/* 加载/错误 */
.loading{display:none;text-align:center;padding:24px;font-size:20px;color:#ffd700}
.loading.show{display:block}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid #333;border-top:3px solid #e94560;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.error{display:none;background:#200;border:1px solid #500;border-radius:10px;padding:12px;margin:10px 0;color:#ff6666;font-size:16px;text-align:center;white-space:pre-wrap;line-height:1.6}
.error.show{display:block}

.score-bar{height:100%;border-radius:6px}

    <button class="close-btn" onclick="toggleSettings()">关闭</button>

<!-- 主输入区 -->

    <input type="text" id="tickerA" placeholder="股票A，如: ARM 或 600036" maxlength="10" autocomplete="off" enterkeyhint="next">

    <input type="text" id="tickerB" placeholder="股票B，如: MRVL 或 000858" maxlength="10" autocomplete="off" enterkeyhint="done">

  </div>

// ============================================================
// 工具函数
// ============================================================
function fmtPrice(num, currency) {
  if (num == null || isNaN(num)) return 'N/A';
  var sym = currency === 'CNY' ? '¥' : '$';
  if (currency === 'CNY') {
    if (num >= 100) return sym + num.toFixed(0);
    return sym + num.toFixed(2);
  }
  return sym + num.toFixed(2);
}

function fmtPct(num) {
  if (num == null || isNaN(num)) return 'N/A';
  return (num >= 0 ? '+' : '') + (num * 100).toFixed(2) + '%';
}

function fmtNum(num) {
  if (num == null || isNaN(num)) return 'N/A';
  if (Math.abs(num) >= 1e12) return (num / 1e12).toFixed(2) + '万亿';
  if (Math.abs(num) >= 1e8) return (num / 1e8).toFixed(2) + '亿';
  if (Math.abs(num) >= 1e4) return (num / 1e4).toFixed(2) + '万';
  return num.toFixed(2);
}

function fmtMarketCap(num, currency) {
  if (num == null || isNaN(num)) return 'N/A';
  if (currency === 'CNY') {
    return (num / 1e8).toFixed(2) + '亿' + (currency === 'CNY' ? '元' : '');
  }
  return '$' + (num / 1e9).toFixed(1) + 'B';
}

function colorClass(val) {
  if (val == null) return '';
  return val >= 0 ? 'up' : 'down';
}

function trendIcon(curr, prev) {
  if (curr == null || prev == null) return '';
  return curr > prev ? '▲' : (curr < prev ? '▼' : '■');
}

// ============================================================
// 市场识别 + API Key 管理
// ============================================================
function detectMarket(symbol) {
  if (/^\d{6}$/.test(symbol)) return 'CN';
  return 'US';
}

function getFinnhubKey() {
  return localStorage.getItem('finnhub_key') || '';
}

function saveKey() {
  var key = document.getElementById('finnhubKey').value.trim();
  if (!key) { alert('请输入 Key'); return; }
  localStorage.setItem('finnhub_key', key);
  document.getElementById('apiSettings').style.display = 'none';
  alert('✅ Key 已保存！现在可以查询任意美股了。');
}

function toggleSettings() {
  var el = document.getElementById('apiSettings');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  if (el.style.display === 'block') {
    document.getElementById('finnhubKey').value = getFinnhubKey();
    document.getElementById('finnhubKey').focus();
  }
}

// ============================================================
// 快捷填充（只填不查）
// ============================================================
function quickFill(a, b) {
  document.getElementById('tickerA').value = a;
  document.getElementById('tickerB').value = b;
  document.getElementById('tickerA').focus();
}

function getStaticData(symbol) {
  var s = symbol.trim().toUpperCase();
  if (STATIC_DATA[s]) {
    var d = {};
    for (var k in STATIC_DATA[s]) d[k] = STATIC_DATA[s][k];
    d.market = detectMarket(s);
    d.dataSource = 'static';
    return d;
  }
  return null;
}

async function fetchFinnhubData(symbol) {
  var key = getFinnhubKey();
  if (!key) return {error: 'NO_KEY', symbol: symbol};
  try {
    var base = 'https://finnhub.io/api/v1/';

      base + 'quote?symbol=' + symbol + '&token=' + key,
      base + 'stock/profile2?symbol=' + symbol + '&token=' + key,
      base + 'stock/metric?symbol=' + symbol + '&metric=all&token=' + key,
      base + 'stock/recommendation?symbol=' + symbol + '&token=' + key,
      base + 'stock/price-target?symbol=' + symbol + '&token=' + key
    ];
    var fetchOne = async function(url) {
      try { var r = await fetch(url, {signal: AbortSignal.timeout(8000)}); return r.ok ? await r.json() : {}; } catch(e) { return {}; }
    };
    var results = await Promise.all(urls.map(fetchOne));
    var quote = results[0], profile = results[1], metricData = results[2], recommends = results[3], pt = results[4];
    var m = (metricData && metricData.metric) || {};
    var d = {
      symbol: symbol, name: profile.name || symbol,
      currency: profile.currency || 'USD', exchange: profile.exchange || '',
      price: quote.c || null, prevClose: quote.pc || null, changePct: quote.dp || null,
      marketCap: profile.marketCapitalization ? profile.marketCapitalization * 1e6 : null,
      market: 'US', dataSource: 'finnhub',
      pe: m.peBasicExclExtraTTM || null, forwardPe: m['peExclExtraAnnual'] || null,
      peg: m['pegForwardPeBasicExclExtraAnnual'] || null,
      pb: m['pbAnnual'] || null, ps: m['psAnnual'] || null,
      revenueGrowth: m.revenueGrowthTTMYoy ? m.revenueGrowthTTMYoy / 100 : null,
      earningsGrowth: m.epsGrowthTTMYoy ? m.epsGrowthTTMYoy / 100 : null,
      grossMargin: m.grossMarginTTM ? m.grossMarginTTM / 100 : null,
      roe: m.roeTTM ? m.roeTTM / 100 : null,
      debtToEquity: m.totalDebtToEquityQuarterly ? m.totalDebtToEquityQuarterly / 100 : null,
      currentRatio: m.currentRatioQuarterly ? m.currentRatioQuarterly : null,
      freeCashFlow: m.freeCashFlowTTM || null,
      operatingCashFlow: m.cashFlowFromOperationsTTM || null,
      week52High: m['52WeekHigh'] || null, week52Low: m['52WeekLow'] || null,
      beta: m.beta || null,
      industry: profile.finnhubIndustry || '', sector: ''
    };
    // 分析师评级
    if (recommends && recommends.length > 0) {
      var latest = recommends[0];
      d.analystCounts = {
        strongBuy: latest.strongBuy || 0, buy: latest.buy || 0,
        hold: latest.hold || 0, sell: latest.sell || 0, strongSell: latest.strongSell || 0
      };
    }
    // 目标价
    if (pt && pt.targetMean) {
      d.targetMean = pt.targetMean;
      d.targetHigh = pt.targetHigh || null;
      d.targetLow = pt.targetLow || null;
    }
    return d;
  } catch(e) {
    return {error: 'FETCH_ERROR', symbol: symbol, msg: e.message};
  }
}

async function fetchAStockData(symbol) {
  // A股暂用静态数据，未来可接东方财富/新浪API
  var staticData = getStaticData(symbol);
  if (staticData) return staticData;
  return {error: 'UNSUPPORTED', symbol: symbol};
}

async function fetchStockData(symbol) {
  var s = symbol.trim().toUpperCase();
  // 先查静态数据
  var staticData = getStaticData(s);
  if (staticData) return staticData;

  var market = detectMarket(s);
  if (market === 'CN') {
    return {error: 'UNSUPPORTED', symbol: s};
  } else {
    // 美股：尝试 Finnhub
    if (getFinnhubKey()) {
      var data = await fetchFinnhubData(s);
      if (!data.error) return data;
    }
    return {error: 'UNSUPPORTED', symbol: s};
  }
}

// ============================================================
// 主比较函数
// ============================================================
async function compare() {
  var codeA = document.getElementById('tickerA').value.trim().toUpperCase();
  var codeB = document.getElementById('tickerB').value.trim().toUpperCase();
  if (!codeA || !codeB) { showError('请输入两只股票的代码'); return; }
  showLoading(true);
  hideError();
  document.getElementById('result').innerHTML = '';
  setTimeout(async function() {
    var dataA = await fetchStockData(codeA);
    var dataB = await fetchStockData(codeB);
    var errMsg = '';
    if (dataA.error === 'NO_KEY') errMsg += '「' + codeA + '」需要 Finnhub API Key 才能查询。\n请点"配置 API Key"填入 Key 后重试。';
    if (dataA.error === 'FETCH_ERROR') errMsg += '获取「' + codeA + '」数据失败：' + (dataA.msg||'网络错误') + '\n\n';
    if (dataA.error === 'UNSUPPORTED') errMsg += '「' + codeA + '」不在预设列表，且未配置 Finnhub API Key。\n\n请点"配置 API Key"填入 Key 后重试。';
    if (dataB.error === 'FETCH_ERROR') errMsg += '获取「' + codeB + '」数据失败：' + (dataB.msg||'网络错误') + '\n';
    if (dataB.error === 'UNSUPPORTED') errMsg += '「' + codeB + '」不在预设列表，且未配置 Finnhub API Key。\n请点"配置 API Key"填入 Key 后重试。';
    if (errMsg) {
      showError(errMsg + '\n\n💡 预设股票（ARM/MRVL/NVDA/MSFT/GOOGL/AAPL/AVGO/AMD/TSLA/META/TSM + A股8只）可直接使用，无需Key。');
      showLoading(false); return;
    }
    var scores = score(dataA, dataB);
    var html = generateDeepReport(dataA, dataB, scores);
    document.getElementById('result').innerHTML = html;
    showLoading(false);
  }, 100);
}

function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
  document.getElementById('searchBtn').disabled = show;
}

function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('error').classList.remove('show');
}

// ============================================================
// 评分引擎（九维）
// ============================================================
function score(A, B) {
  var dims = [
    {key:'估值',     fn:function(d){if(d.pe==null) return 5; if(d.pe<0) return 2; if(d.pe<15) return 9; if(d.pe<25) return 8; if(d.pe<35) return 7; if(d.pe<50) return 5; return 3;}, dir:'lowerBetter'},
    {key:'成长',     fn:function(d){if(d.revenueGrowth==null) return 5; if(d.revenueGrowth>0.3) return 9; if(d.revenueGrowth>0.2) return 8; if(d.revenueGrowth>0.1) return 7; if(d.revenueGrowth>0) return 6; return 3;}, dir:'higherBetter'},
    {key:'盈利',     fn:function(d){if(d.profitMargin==null) return 5; if(d.profitMargin>0.35) return 9; if(d.profitMargin>0.25) return 8; if(d.profitMargin>0.15) return 7; if(d.profitMargin>0.05) return 6; if(d.profitMargin>0) return 5; return 2;}, dir:'higherBetter'},
    {key:'财务健康', fn:function(d){if(d.debtToEquity==null) return 5; if(d.debtToEquity<0.2) return 9; if(d.debtToEquity<0.5) return 8; if(d.debtToEquity<1.0) return 7; if(d.debtToEquity<1.5) return 5; return 3;}, dir:'lowerBetter'},
    {key:'市值动量', fn:function(d){if(d.marketCap==null) return 5; if(d.marketCap>1e12) return 6; if(d.marketCap>5e11) return 7; if(d.marketCap>1e11) return 8; if(d.marketCap>5e10) return 7; return 6;}, dir:'midBetter'},
    {key:'现金流',   fn:function(d){if(d.freeCashFlow==null) return 5; if(d.marketCap && d.marketCap>0) {var r=d.freeCashFlow/d.marketCap; if(r>0.08) return 9; if(r>0.05) return 8; if(r>0.03) return 7; if(r>0) return 6;} return 5;}, dir:'higherBetter'},
    {key:'ROE',      fn:function(d){if(d.roe==null) return 5; if(d.roe>0.3) return 9; if(d.roe>0.2) return 8; if(d.roe>0.15) return 7; if(d.roe>0.1) return 6; if(d.roe>0) return 5; return 2;}, dir:'higherBetter'},
    {key:'波动率',   fn:function(d){if(d.beta==null) return 5; if(d.beta<0.8) return 8; if(d.beta<1.2) return 7; if(d.beta<1.5) return 5; return 3;}, dir:'lowerBetter'},
    {key:'PEG',      fn:function(d){if(d.peg==null||d.revenueGrowth==null||d.revenueGrowth<=0) return 5; if(d.peg<1) return 9; if(d.peg<1.5) return 8; if(d.peg<2) return 7; if(d.peg<3) return 5; return 3;}, dir:'lowerBetter'}
  ];
  var sA = 0, sB = 0;
  var detailA = {}, detailB = {};
  dims.forEach(function(dim, i) {
    var va = dim.fn(A), vb = dim.fn(B);
    detailA[dim.key] = va; detailB[dim.key] = vb;
    sA += va; sB += vb;
  });
  return {dims: dims, detailA: detailA, detailB: detailB, totalA: sA/9, totalB: sB/9, totalA_raw: sA, totalB_raw: sB};
}

// ============================================================
// 报告生成（九大模块）
// ============================================================
function generateDeepReport(A, B, scores) {
  var colorA = function(val) { return val >= 0 ? 'up' : 'down'; };
  var colorB = function(val) { return val >= 0 ? 'up' : 'down'; };

  // 评分柱状图
  var maxScore = 45;
  var barA = (scores.totalA_raw / maxScore * 100).toFixed(0);
  var barB = (scores.totalB_raw / maxScore * 100).toFixed(0);
  var winner = scores.totalA_raw > scores.totalB_raw + 3 ? A.symbol : (scores.totalB_raw > scores.totalA_raw + 3 ? B.symbol : '平局');

  var html = '';

  // ============================================================
  // 一、核心结论
  // ============================================================
  html += '<div class="report-section"><h2>一、核心结论（先说重点）</h2>';
  html += '<div style="text-align:center;margin:12px 0"><span class="big-price ' + colorA(A.changePct) + '">' + A.symbol + ' ' + fmtPrice(A.price, A.currency) + '</span>';
  html += ' <span style="color:#888;font-size:18px">VS</span> ';
  html += '<span class="big-price ' + colorB(B.changePct) + '">' + B.symbol + ' ' + fmtPrice(B.price, B.currency) + '</span></div>';

  // 综合评分卡
  html += '<table class="report-table"><tr><th>维度</th><th>' + A.symbol + '</th><th>' + B.symbol + '</th><th>胜出</th></tr>';
  scores.dims.forEach(function(dim) {
    var va = scores.detailA[dim.key], vb = scores.detailB[dim.key];
    var w = va > vb ? A.symbol : (vb > va ? B.symbol : '-');
    html += '<tr><td>' + dim.key + '</td><td>' + va + '</td><td>' + vb + '</td><td>' + (w!=='-'?'<span class="tag buy">'+w+'</span>':'-') + '</td></tr>';
  });
  html += '<tr style="font-weight:bold;background:#1a1a3a"><td>综合评分</td><td>' + scores.totalA_raw + ' (' + scores.totalA.toFixed(1) + ')</td><td>' + scores.totalB_raw + ' (' + scores.totalB.toFixed(1) + ')</td><td>' + (winner!=='平局'?'<span class="tag buy">'+winner+'</span>':'平局') + '</td></tr>';
  html += '</table>';

  // 综合评分条
  html += '<div style="margin:10px 0"><div style="font-size:14px;color:#aaa;margin-bottom:4px">综合评分可视化</div>';
  html += '<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="color:#ffd700;font-size:13px;width:60px">' + A.symbol + '</span><div class="score-bar-wrap" style="flex:1"><div class="score-bar" style="width:' + barA + '%;background:linear-gradient(90deg,#ff4444,#ff6666)"></div></div><span style="color:#ff4444;font-size:13px;width:40px">' + scores.totalA_raw + '</span></div>';
  html += '<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="color:#4cff4c;font-size:13px;width:60px">' + B.symbol + '</span><div class="score-bar-wrap" style="flex:1"><div class="score-bar" style="width:' + barB + '%;background:linear-gradient(90deg,#4cff4c,#88ff88)"></div></div><span style="color:#4cff4c;font-size:13px;width:40px">' + scores.totalB_raw + '</span></div>';
  html += '</div>';

  // 关键发现
  html += '<div class="verdict-box" style="margin-top:12px"><p><b>关键发现：</b>';
  var findings = [];
  if (A.pe && B.pe) findings.push(A.symbol + ' PE ' + A.pe.toFixed(1) + 'x vs ' + B.symbol + ' PE ' + B.pe.toFixed(1) + 'x，' + (A.pe < B.pe ? A.symbol : B.symbol) + '估值更低');
  if (A.revenueGrowth && B.revenueGrowth) findings.push('营收增速：' + A.symbol + ' ' + (A.revenueGrowth*100).toFixed(0) + '% vs ' + B.symbol + ' ' + (B.revenueGrowth*100).toFixed(0) + '%');
  if (A.roe && B.roe) findings.push('ROE：' + A.symbol + ' ' + (A.roe*100).toFixed(0) + '% vs ' + B.symbol + ' ' + (B.roe*100).toFixed(0) + '%，' + (A.roe > B.roe ? A.symbol : B.symbol) + '资本回报更高');
  if (A.profitMargin && B.profitMargin) findings.push('净利率：' + A.symbol + ' ' + (A.profitMargin*100).toFixed(0) + '% vs ' + B.symbol + ' ' + (B.profitMargin*100).toFixed(0) + '%');
  findings.forEach(function(f) { html += '• ' + f + '<br>'; });
  html += '</p></div>';

  // 三年毛利率趋势
  if (A.grossMarginHistory || B.grossMarginHistory) {
    html += '<div style="margin-top:12px"><div style="font-size:15px;color:#ffd700;margin-bottom:6px">📊 三年毛利率趋势对比</div>';
    html += '<table class="report-table"><tr><th>年份</th>';
    if (A.grossMarginHistory) html += '<th>' + A.symbol + '</th>';
    if (B.grossMarginHistory) html += '<th>' + B.symbol + '</th>';
    html += '</tr>';
    var years = ['2022','2023','2024'];
    for (var y = 0; y < 3; y++) {
      html += '<tr><td>' + years[y] + '</td>';
      if (A.grossMarginHistory) {
        var v = A.grossMarginHistory[y];
        var prev = y > 0 ? A.grossMarginHistory[y-1] : null;
        html += '<td>' + (v!=null?(v*100).toFixed(1)+'% '+(prev!=null?trendIcon(v,prev):''):'N/A') + '</td>';
      }
      if (B.grossMarginHistory) {
        var v2 = B.grossMarginHistory[y];
        var prev2 = y > 0 ? B.grossMarginHistory[y-1] : null;
        html += '<td>' + (v2!=null?(v2*100).toFixed(1)+'% '+(prev2!=null?trendIcon(v2,prev2):''):'N/A') + '</td>';
      }
      html += '</tr>';
    }
    html += '</table></div>';
  }

  // 三年研发费用
  if (A.rdHistory || B.rdHistory) {
    html += '<div style="margin-top:10px"><div style="font-size:15px;color:#ffd700;margin-bottom:6px">🔬 三年研发费用对比</div>';
    html += '<table class="report-table"><tr><th>年份</th>';
    if (A.rdHistory) html += '<th>' + A.symbol + '（金额/占营收）</th>';
    if (B.rdHistory) html += '<th>' + B.symbol + '（金额/占营收）</th>';
    html += '</tr>';
    for (var y = 0; y < 3; y++) {
      html += '<tr><td>' + (A.rdHistory? A.rdHistory[y].year : (B.rdHistory? B.rdHistory[y].year : '-')) + '</td>';
      if (A.rdHistory) {
        var rd = A.rdHistory[y], rdRatio = A.rdToRevenue ? (A.rdToRevenue[y]*100).toFixed(1) + '%' : 'N/A';
        html += '<td>' + fmtNum(rd.amount) + '（' + rdRatio + '）</td>';
      }
      if (B.rdHistory) {
        var rd2 = B.rdHistory[y], rdRatio2 = B.rdToRevenue ? (B.rdToRevenue[y]*100).toFixed(1) + '%' : 'N/A';
        html += '<td>' + fmtNum(rd2.amount) + '（' + rdRatio2 + '）</td>';
      }
      html += '</tr>';
    }
    html += '</table></div>';
  }

  html += '</div>'; // end section 1

  // ============================================================
  // 二、公司定位对比
  // ============================================================
  html += '<div class="report-section"><h2>二、公司定位对比</h2>';
  [A, B].forEach(function(d) {
    html += '<div class="card" style="margin:8px 0;padding:10px 12px">';
    html += '<div style="font-size:17px;color:#ffd700;font-weight:bold">' + d.symbol + ' —— ' + d.name + '</div>';
    if (d.business) html += '<div style="margin:6px 0;color:#ccc;line-height:1.8"><b>业务：</b>' + d.business + '</div>';
    if (d.moat) html += '<div style="margin:6px 0;color:#88ff88;line-height:1.8"><b>🛡️ 护城河：</b>' + d.moat + '</div>';
    if (d.longTermView) html += '<div style="margin:6px 0;color:#ffd700;line-height:1.8"><b>🔭 长期持有逻辑：</b>' + d.longTermView + '</div>';
    html += '</div>';
  });
  html += '</div>';

  // ============================================================
  // 三、财务数据对比
  // ============================================================
  html += '<div class="report-section"><h2>三、财务数据对比</h2>';
  html += '<table class="report-table"><tr><th>指标</th><th>' + A.symbol + '</th><th>' + B.symbol + '</th></tr>';
  var rows = [
    ['股价', fmtPrice(A.price,A.currency)+(A.changePct!=null?' ('+(A.changePct>=0?'+':'')+A.changePct.toFixed(2)+'%)':''), fmtPrice(B.price,B.currency)+(B.changePct!=null?' ('+(B.changePct>=0?'+':'')+B.changePct.toFixed(2)+'%)':'')],
    ['市值', fmtMarketCap(A.marketCap, A.currency), fmtMarketCap(B.marketCap, B.currency)],
    ['PE (TTM)', A.pe!=null?A.pe.toFixed(1)+'x':'N/A', B.pe!=null?B.pe.toFixed(1)+'x':'N/A'],
    ['远期PE', A.forwardPe!=null?A.forwardPe.toFixed(1)+'x':'N/A', B.forwardPe!=null?B.forwardPe.toFixed(1)+'x':'N/A'],
    ['PEG', A.peg!=null?A.peg.toFixed(2):'N/A', B.peg!=null?B.peg.toFixed(2):'N/A'],
    ['PB', A.pb!=null?A.pb.toFixed(2):'N/A', B.pb!=null?B.pb.toFixed(2):'N/A'],
    ['PS', A.ps!=null?A.ps.toFixed(2):'N/A', B.ps!=null?B.ps.toFixed(2):'N/A'],
    ['毛利率', A.grossMargin!=null?(A.grossMargin*100).toFixed(1)+'%':'N/A', B.grossMargin!=null?(B.grossMargin*100).toFixed(1)+'%':'N/A'],
    ['营收增速(YoY)', A.revenueGrowth!=null?(A.revenueGrowth*100).toFixed(1)+'%':'N/A', B.revenueGrowth!=null?(B.revenueGrowth*100).toFixed(1)+'%':'N/A'],
    ['净利润率', A.profitMargin!=null?(A.profitMargin*100).toFixed(1)+'%':'N/A', B.profitMargin!=null?(B.profitMargin*100).toFixed(1)+'%':'N/A'],

  rows.forEach(function(r) { html += '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; });

  // ============================================================

      html += '<td colspan="2"><span class="' + (cagrB>=0?'up':'down') + '"><b>' + cagrB.toFixed(1) + '%</b></span></td></tr>';
    }
    html += '</table></div>';
  }
  // 三年毛利率趋势（已在核心结论，这里省略避免重复）
  // 三年净利率趋势
  if (A.netMarginHistory || B.netMarginHistory) {

    html += '<table class="report-table"><tr><th>年份</th>';
    if (A.netMarginHistory) html += '<th>' + A.symbol + '</th>';
    if (B.netMarginHistory) html += '<th>' + B.symbol + '</th>';
    html += '</tr>';
    var yrs = ['2022','2023','2024'];
    for (var y = 0; y < 3; y++) {
      html += '<tr><td>' + yrs[y] + '</td>';
      if (A.netMarginHistory) { var v = A.netMarginHistory[y]; html += '<td>' + (v!=null?(v*100).toFixed(1)+'% '+(y>0?trendIcon(v,A.netMarginHistory[y-1]):''):'N/A') + '</td>'; }
      if (B.netMarginHistory) { var v2 = B.netMarginHistory[y]; html += '<td>' + (v2!=null?(v2*100).toFixed(1)+'% '+(y>0?trendIcon(v2,B.netMarginHistory[y-1]):''):'N/A') + '</td>'; }
      html += '</tr>';
    }
    html += '</table></div>';
  }
  html += '</div>';

  // ============================================================
  // 五、估值分析
  // ============================================================
  html += '<div class="report-section"><h2>五、估值分析</h2>';
  [A, B].forEach(function(d) {
    html += '<div class="card" style="margin:8px 0;padding:10px 12px">';
    html += '<div style="font-size:16px;color:#ffd700;font-weight:bold">' + d.symbol + ' 估值分析</div>';
    if (d.pe) html += '<p>PE (TTM)：<span class="' + (d.pe<20?'green':(d.pe<35?'yellow':'red')) + '">' + d.pe.toFixed(1) + 'x</span></p>';
    if (d.peg) html += '<p>PEG：<span class="' + (d.peg<1?'green':(d.peg<2?'yellow':'red')) + '">' + d.peg.toFixed(2) + '</span>（<1 表示估值合理）</p>';
    if (d.forwardPe) html += '<p>远期PE：' + d.forwardPe.toFixed(1) + 'x（反映市场预期）</p>';
    // 指数增长估值逻辑
    if (d.revenueGrowth && d.revenueGrowth > 0 && d.pe) {
      var years = 5;
      var futureMultiple = d.pe / Math.pow(1 + d.revenueGrowth, years);  //  simplified
      // 用更直观的方式：若维持当前增速，N年后利润增长多少
      var profitGrowth = Math.pow(1 + (d.earningsGrowth||d.revenueGrowth), years);
      html += '<p>📐 <b>科技股指数增长逻辑：</b>若维持当前增速（' + ((d.earningsGrowth||d.revenueGrowth)*100).toFixed(0) + '%/年），' + years + '年后利润增长 <b>' + profitGrowth.toFixed(1) + 'x</b>。<br>';
      html += '届时有效 PE 约为 ' + (d.pe / profitGrowth).toFixed(1) + 'x（当前 ' + d.pe.toFixed(1) + 'x），';
      if (d.pe / profitGrowth < 20) html += '<span class="green">估值将变得非常合理。</span>';
      else if (d.pe / profitGrowth < 35) html += '<span class="yellow">估值将变得较为合理。</span>';
      else html += '<span class="red">估值仍然偏高，需谨慎。</span>';
      html += '</p>';
    }
    if (d.targetMean && d.price) {
      var upside = (d.targetMean - d.price) / d.price * 100;
      html += '<p>分析师目标价均值：' + fmtPrice(d.targetMean, d.currency) + '，上行空间：<span class="' + (upside>=0?'up':'down') + '"><b>' + (upside>=0?'+':'') + upside.toFixed(1) + '%</b></span></p>';
    }
    html += '</div>';
  });
  html += '</div>';

  // ============================================================
  // 六、分析师共识
  // ============================================================
  html += '<div class="report-section"><h2>六、分析师共识</h2>';
  [A, B].forEach(function(d) {
    html += '<div class="card" style="margin:8px 0;padding:10px 12px">';
    html += '<div style="font-size:16px;color:#ffd700;font-weight:bold">' + d.symbol + ' 分析师评级</div>';
    if (d.analystCounts) {
      var total = d.analystCounts.strongBuy + d.analystCounts.buy + d.analystCounts.hold + d.analystCounts.sell + d.analystCounts.strongSell;
      var buyPct = total > 0 ? ((d.analystCounts.strongBuy + d.analystCounts.buy) / total * 100).toFixed(0) : 'N/A';
      html += '<div style="display:flex;gap:3px;margin:6px 0;height:22px">';
      ['strongBuy','buy','hold','sell','strongSell'].forEach(function(k) {
        var w = total > 0 ? d.analystCounts[k] / total * 100 : 0;
        var colors = {strongBuy:'#1a6a1a',buy:'#2a8a2a',hold:'#6a6a1a',sell:'#6a2a2a',strongSell:'#8a1a1a'};
        var colors2 = {strongBuy:'#4cff4c',buy:'#88ff88',hold:'#ffd700',sell:'#ff8888',strongSell:'#ff4444'};
        if (w > 0) html += '<div style="width:' + w + '%;background:' + colors[k] + ';border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:11px;color:' + colors2[k] + '">' + (w > 5 ? d.analystCounts[k] : '') + '</div>';
      });
      html += '</div>';
      html += '<div style="font-size:13px;color:#aaa">强力买入:' + d.analystCounts.strongBuy + ' 买入:' + d.analystCounts.buy + ' 持有:' + d.analystCounts.hold + ' 卖出:' + d.analystCounts.sell + ' 强力卖出:' + d.analystCounts.strongSell + '（共' + total + '位）</div>';
      html += '<div style="font-size:14px;margin-top:4px">买入共识：<span class="' + (buyPct > 70 ? 'green' : (buyPct > 50 ? 'yellow' : 'red')) + '"><b>' + buyPct + '%</b></span> → ' + (buyPct > 70 ? '强烈看多 📈' : (buyPct > 50 ? '偏多' : '偏空/分歧')) + '</div>';
    }
    if (d.targetMean && d.price) {
      var up = (d.targetMean - d.price) / d.price * 100;
      html += '<div style="margin-top:6px;font-size:14px">目标价：' + fmtPrice(d.targetMean, d.currency) + '（高:' + fmtPrice(d.targetHigh, d.currency) + ' 低:' + fmtPrice(d.targetLow, d.currency) + '） 上行空间：<span class="' + (up>=0?'up':'down') + '"><b>' + (up>=0?'+':'') + up.toFixed(1) + '%</b></span></div>';
    }
    html += '</div>';
  });
  html += '</div>';

  // ============================================================
  // 七、投资风险
  // ============================================================
  html += '<div class="report-section"><h2>七、投资风险 ⚠️</h2>';
  [A, B].forEach(function(d) {
    html += '<div style="margin:8px 0"><div style="font-size:16px;color:#ff8888;font-weight:bold">' + d.symbol + ' 主要风险</div>';
    if (d.risks && d.risks.length > 0) {
      d.risks.forEach(function(r) { html += '<div class="risk-item">' + r + '</div>'; });
    } else {
      html += '<div style="color:#666;font-size:14px">暂无风险提示数据</div>';
    }
    html += '</div>';
  });
  html += '</div>';

  // ============================================================
  // 八、核心优势
  // ============================================================
  html += '<div class="report-section"><h2>八、核心优势 ✅</h2>';
  [A, B].forEach(function(d) {
    html += '<div style="margin:8px 0"><div style="font-size:16px;color:#88ff88;font-weight:bold">' + d.symbol + ' 核心优势</div>';
    if (d.strengths && d.strengths.length > 0) {
      d.strengths.forEach(function(s) { html += '<div class="strength-item">' + s + '</div>'; });
    } else {
      html += '<div style="color:#666;font-size:14px">暂无优势分析数据</div>';
    }
    html += '</div>';
  });
  html += '</div>';

  // ============================================================
  // 九、最终建议
  // ============================================================
  html += '<div class="report-section"><h2>九、最终投资建议</h2>';
  var recs = [
    {score: scores.totalA_raw, sym: A.symbol, pe: A.pe, growth: A.revenueGrowth, roe: A.roe, longView: A.longTermView},
    {score: scores.totalB_raw, sym: B.symbol, pe: B.pe, growth: B.revenueGrowth, roe: B.roe, longView: B.longTermView}
  ];
  recs.sort(function(a,b){return b.score - a.score});
  recs.forEach(function(r, idx) {
    var rating = r.score >= 38 ? '⭐⭐⭐⭐⭐ 强烈推荐' : (r.score >= 34 ? '⭐⭐⭐⭐ 推荐' : (r.score >= 30 ? '⭐⭐⭐ 可考虑' : '⭐⭐ 谨慎'));
    var risk = r.pe > 50 ? '高风险' : (r.pe > 30 ? '中等风险' : '中低风险');
    html += '<div class="card" style="margin:8px 0;padding:12px">';
    html += '<div style="font-size:17px;color:#ffd700;font-weight:bold">' + r.sym + '</div>';
    html += '<div style="margin:6px 0">推荐度：' + rating + '</div>';
    html += '<div style="margin:6px 0">风险等级：' + risk + '（PE ' + (r.pe!=null?r.pe.toFixed(1)+'x':(r.pe<0?'亏损':'')) + '）</div>';
    if (r.longView) {
      html += '<div style="margin:6px 0;color:#ccc;line-height:1.8;font-size:14px"><b>长期逻辑：</b>' + r.longView + '</div>';
    }
    html += '</div>';
  });

  html += '<div class="verdict-box" style="margin-top:12px">';
  html += '<p><b>综合判断：</b>';
  if (scores.totalA_raw > scores.totalB_raw + 4) {
    html += A.symbol + ' 综合评分显著优于 ' + B.symbol + '（+' + (scores.totalA_raw - scores.totalB_raw).toFixed(1) + '分），在大多数维度领先。';
  } else if (scores.totalB_raw > scores.totalA_raw + 4) {
    html += B.symbol + ' 综合评分显著优于 ' + A.symbol + '（+' + (scores.totalB_raw - scores.totalA_raw).toFixed(1) + '分），在大多数维度领先。';
  } else {
    html += '两只股票综合评分接近（差距 ' + Math.abs(scores.totalA_raw - scores.totalB_raw).toFixed(1) + '分），选择应基于：①对增长赛道的判断；②估值与增速的匹配度（PEG）；③自身风险偏好（Beta）。';
  }
  html += '</p>';
  html += '<p style="color:#666;font-size:13px;margin-top:8px">⚠️ 以上为数据模型分析，不构成投资建议。股市有风险，投资需谨慎。<br>数据说明：内置数据基于2026-06-03公开信息，股价为盘后价格。</p>';
  html += '</div></div>';

  return html;
}
