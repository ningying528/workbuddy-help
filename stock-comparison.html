<script>
// ===== 设置管理 =====
let API_KEYS = { finnhub: '', sinaCookie: '' };

function loadSettings() {
  try {
    const saved = localStorage.getItem('stock_compare_keys');
    if (saved) API_KEYS = JSON.parse(saved);
  } catch(e) {}
  // 同步到设置面板输入框
  const fk = document.getElementById('finnhubKey');
  const sc = document.getElementById('sinaCookie');
  if (fk) fk.value = API_KEYS.finnhub || '';
  if (sc) sc.value = API_KEYS.sinaCookie || '';
}

function saveSettings() {
  const key = document.getElementById('finnhubKey').value.trim();
  const cookie = document.getElementById('sinaCookie').value.trim();
  API_KEYS.finnhub = key;
  API_KEYS.sinaCookie = cookie;
  localStorage.setItem('stock_compare_keys', JSON.stringify(API_KEYS));
  const msg = document.getElementById('settingsMsg');
  if (msg) {
    msg.style.color = '#4cff4c';
    msg.textContent = key ? '✅ Finnhub Key 已保存！美股数据可用。' : '已保存（未填写 Finnhub Key，将使用公开接口）';
  }
  updateKeyBanner();
  setTimeout(() => toggleSettings(), 1200);
}

function saveKeyFromBanner() {
  const keyInput = document.getElementById('bannerKeyInput');
  const status = document.getElementById('bannerStatus');
  if (!keyInput) return;
  const key = keyInput.value.trim();
  if (!key) {
    status.style.color = '#ff4444';
    status.textContent = '请先粘贴 API Key';
    return;
  }
  API_KEYS.finnhub = key;
  localStorage.setItem('stock_compare_keys', JSON.stringify(API_KEYS));
  status.style.color = '#4cff4c';
  status.textContent = '✅ 保存成功！正在刷新...';
  updateKeyBanner();
  setTimeout(() => { location.reload(); }, 800);
}

function dismissBanner() {
  localStorage.setItem('stock_compare_banner_dismissed', '1');
  updateKeyBanner();
}

function updateKeyBanner() {
  const banner = document.getElementById('keyBanner');
  if (!banner) return;
  const dismissed = localStorage.getItem('stock_compare_banner_dismissed');
  if (!API_KEYS.finnhub && !dismissed) {
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
  // 更新数据源状态
  const srcStatus = document.getElementById('srcStatus');
  if (srcStatus) {
    if (API_KEYS.finnhub) {
      srcStatus.innerHTML = '🟢 数据源：<span class="src-tag finnhub">Finnhub（已配置，支持CORS）</span>';
    } else {
      srcStatus.innerHTML = '🟡 数据源：<span class="src-tag yahoo">Yahoo Finance（可能被浏览器拦截，建议配置Finnhub Key）</span>';
    }
  }
}

function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  if (panel) {
    panel.classList.toggle('show');
    if (panel.classList.contains('show')) loadSettings();
  }
}

// ===== 市场识别 =====
function detectMarket(code) {
  const c = code.trim().toUpperCase();
  if (/^\d{6}$/.test(c)) return 'CN';
  return 'US';
}

function toSinaCode(code) {
  const c = code.trim();
  if (c.startsWith('6') || c.startsWith('68')) return 'sh' + c;
  return 'sz' + c;
}

// ===== 通用 CORS 请求函数 =====
// 尝试直连，失败则轮询多个 CORS 代理
async function corsFetch(url, options = {}, proxyList = null) {
  const defaultProxies = [
    'https://corsproxy.io/?url=',
    'https://api.allorigins.win/raw?url=',
    'https://proxy.cors.sh/',
    'https://corsproxy.cc/?',
  ];
  const proxies = proxyList || defaultProxies;

  // 1. 尝试直连
  try {
    const resp = await fetch(url, { ...options, signal: AbortSignal.timeout(8000) });
    if (resp.ok) return { response: resp, source: 'direct' };
  } catch(e) {}

  // 2. 尝试各代理
  for (const proxy of proxies) {
    try {
      const sep = proxy.includes('?url=') ? '' : '?url=';
      const proxyUrl = proxy + (sep ? encodeURIComponent(url) : encodeURIComponent(url));
      const resp = await fetch(proxy + encodeURIComponent(url), {
        ...options,
        signal: AbortSignal.timeout(10000)
      });
      if (resp.ok) return { response: resp, source: 'proxy', proxy: proxy };
    } catch(e) {}
  }

  // 3. 全部失败
  return { response: null, source: 'failed' };
}

// ===== 数据获取 =====

// --- A股：新浪财经 API（无需 Key） ---
async function fetchAStockData(code) {
  const sinaCode = toSinaCode(code);
  const symbol = code.trim();
  
  try {
    const fetchOpts = API_KEYS.sinaCookie
      ? { headers: { 'Cookie': API_KEYS.sinaCookie, 'Referer': 'https://finance.sina.com.cn/' } }
      : { headers: { 'Referer': 'https://finance.sina.com.cn/' } };
    
    const result = await corsFetch(`https://hq.sinajs.cn/list=${sinaCode}`, fetchOpts);
    if (!result.response) throw new Error('网络请求失败，请检查网络连接');
    
    const text = await result.response.text();
    
    // 解析 GBK 编码
    let decoded;
    try {
      const buffer = new Uint8Array(text.length);
      for (let i = 0; i < text.length; i++) buffer[i] = text.charCodeAt(i);
      decoded = new TextDecoder('gbk').decode(buffer);
    } catch(e) {
      decoded = text;
    }
    
    const match = decoded.match(/="([^"]+)"/);
    if (!match || !match[1]) throw new Error('无行情数据');
    
    const parts = match[1].split(',');
    if (parts.length < 32) throw new Error('数据不完整');
    
    const name = parts[0] || symbol;
    const price = parseFloat(parts[3]);
    const prevClose = parseFloat(parts[2]);
    const open = parseFloat(parts[1]);
    const high = parseFloat(parts[4]);
    const low = parseFloat(parts[5]);
    const volume = parseFloat(parts[8]);
    
    if (!price || isNaN(price)) throw new Error('无行情数据');
    
    const change = price - prevClose;
    const changePct = prevClose ? (change / prevClose) * 100 : 0;
    
    return {
      symbol, name, price, prevClose, change, changePct,
      high, low, open, volume,
      pe: parts[39] ? parseFloat(parts[39]) : null,
      marketCap: parts[45] ? parseFloat(parts[45]) * 1e8 : null,
      high52w: parts[41] ? parseFloat(parts[41]) : null,
      low52w: parts[42] ? parseFloat(parts[42]) : null,
      currency: 'CNY', market: 'CN',
      revenueGrowth: null, earningsGrowth: null,
      grossMargin: null, profitMargin: null,
      roe: null, roa: null,
      totalCash: null, totalDebt: null,
      freeCashflow: null, operatingCashflow: null,
      totalRevenue: null,
      beta: null, dividendYield: null,
      forwardPE: null, ps: null,
      shortRatio: null, shortPercent: null,
      sector: null, industry: null,
      analystStrongBuy: 0, analystBuy: 0, analystHold: 0,
      analystSell: 0, analystStrongSell: 0, analystTotal: 0,
      targetMean: null, targetHigh: null, targetLow: null,
      error: null,
      dataSource: 'sina'
    };
  } catch(e) {
    return { symbol, error: `A股数据获取失败: ${e.message}`, market: 'CN' };
  }
}

// --- 美股：Finnhub API（需要 Key，支持 CORS） ---
async function fetchUSStockDataFinnhub(symbol) {
  const s = symbol.toUpperCase().trim();
  if (!API_KEYS.finnhub) return { symbol: s, error: 'NO_FINNHUB_KEY', market: 'US' };
  
  try {
    const base = 'https://finnhub.io/api/v1';
    const tk = API_KEYS.finnhub;
    
    const [quoteRes, profileRes, metricRes, recRes, targetRes] = await Promise.allSettled([
      fetch(`${base}/quote?symbol=${s}&token=${tk}`),
      fetch(`${base}/stock/profile2?symbol=${s}&token=${tk}`),
      fetch(`${base}/stock/metric?symbol=${s}&metric=all&token=${tk}`),
      fetch(`${base}/stock/recommendation?symbol=${s}&token=${tk}`),
      fetch(`${base}/stock/price-target?symbol=${s}&token=${tk}`)
    ]);
    
    const data = { symbol: s, market: 'US', error: null, dataSource: 'finnhub' };
    
    // 行情
    if (quoteRes.status === 'fulfilled' && quoteRes.value.ok) {
      const q = await quoteRes.value.json();
      data.price = q.c;
      data.prevClose = q.pc;
      data.change = q.d;
      data.changePct = q.dp;
      data.high = q.h;
      data.low = q.l;
      data.open = q.o;
    }
    
    // 公司信息
    if (profileRes.status === 'fulfilled' && profileRes.value.ok) {
      const p = await profileRes.value.json();
      data.name = p.name || s;
      data.marketCap = p.marketCapitalization ? p.marketCapitalization * 1e6 : null;
      data.currency = p.currency || 'USD';
      data.sector = p.finnhubIndustry;
      data.country = p.country;
      data.exchange = p.exchange;
    }
    
    // 财务指标
    if (metricRes.status === 'fulfilled' && metricRes.value.ok) {
      const m = await metricRes.value.json();
      const met = m.metric || {};
      data.pe = met['peBasicExclExtraTTM'] || met['peBasicExclExtraAnnual'];
      data.forwardPE = met['peForwardPeBasicExclExtraAnnual'];
      data.pb = met['pbAnnual'] || met['pbQuarterly'];
      data.eps = met['epsBasicExclExtraAnnual'];
      data.roe = met['roeTTM'] || met['roeAnnual'];
      data.roa = met['roaTTM'] || met['roaAnnual'];
      data.grossMargin = met['grossMarginTTM'] ? met['grossMarginTTM'] / 100 : null;
      data.profitMargin = met['netProfitMarginTTM'] ? met['netProfitMarginTTM'] / 100 : null;
      data.revenueGrowth = met['revenueGrowthTTM'] ? met['revenueGrowthTTM'] / 100 : null;
      data.totalRevenue = met['revenueTTM'];
      data.freeCashflow = met['freeCashFlowTTM'];
      data.totalCash = met['totalCashEqAnnual'];
      data.totalDebt = met['totalDebtAnnual'];
      data.dividendYield = met['dividendYieldIndicatedAnnual'] ? met['dividendYieldIndicatedAnnual'] / 100 : null;
      data.beta = met['beta'];
      data.ps = met['psTTM'] || met['psAnnual'];
    }
    
    // 分析师评级
    if (recRes.status === 'fulfilled' && recRes.value.ok) {
      const recs = await recRes.value.json();
      if (recs && recs.length > 0) {
        const latest = recs[0];
        data.analystBuy = latest.buy || 0;
        data.analystHold = latest.hold || 0;
        data.analystSell = latest.sell || 0;
        data.analystStrongBuy = latest.strongBuy || 0;
        data.analystStrongSell = latest.strongSell || 0;
        data.analystTotal = (data.analystStrongBuy + data.analystBuy + data.analystHold + data.analystSell + data.analystStrongSell);
      }
    }
    
    // 目标价
    if (targetRes.status === 'fulfilled' && targetRes.value.ok) {
      const t = await targetRes.value.json();
      if (t.targetMean) {
        data.targetMean = t.targetMean;
        data.targetHigh = t.targetHigh;
        data.targetLow = t.targetLow;
      }
    }
    
    if (!data.price) data.error = '无法获取数据，请检查美股代码是否正确';
    return data;
  } catch(e) {
    return { symbol: s, error: `Finnhub 数据获取失败: ${e.message}`, market: 'US' };
  }
}

// --- 美股：Yahoo Finance 备用方案 ---
async function fetchUSStockDataYahoo(symbol) {
  const s = symbol.toUpperCase().trim();
  
  try {
    const headers = {
      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36',
      'Accept': 'application/json',
      'Accept-Language': 'en-US,en;q=0.9',
      'Referer': 'https://finance.yahoo.com/'
    };

    const chartUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${s}?interval=1d&range=3mo`;
    const summaryUrl = `https://query2.finance.yahoo.com/v10/finance/quoteSummary/${s}?modules=price,summaryDetail,defaultKeyStatistics,financialData,assetProfile,recommendationTrend`;

    const [chartResult, summaryResult] = await Promise.allSettled([
      corsFetch(chartUrl, { headers }),
      corsFetch(summaryUrl, { headers })
    ]);

    const data = { symbol: s, market: 'US', error: null, dataSource: 'yahoo' };

    // 处理图表数据
    if (chartResult.source !== 'failed' && chartResult.response) {
      try {
        const json = await chartResult.response.json();
        const result = json?.chart?.result?.[0];
        if (result) {
          const meta = result.meta;
          data.price = meta.regularMarketPrice;
          data.prevClose = meta.previousClose || meta.chartPreviousClose;
          data.change = data.price - data.prevClose;
          data.changePct = (data.change / data.prevClose) * 100;
          data.high = meta.regularMarketDayHigh;
          data.low = meta.regularMarketDayLow;
          data.currency = meta.currency || 'USD';
        }
      } catch(e) { console.warn('Chart parse error:', e); }
    }

    // 处理概要数据
    if (summaryResult.source !== 'failed' && summaryResult.response) {
      try {
        const json = await summaryResult.response.json();
        const r = json?.quoteSummary?.result?.[0];
        if (r) {
          const p = r.price || {};
          const sd = r.summaryDetail || {};
          const ks = r.defaultKeyStatistics || {};
          const fd = r.financialData || {};
          const ap = r.assetProfile || {};

          data.name = data.name || p.shortName || p.longName || s;
          data.marketCap = data.marketCap || p.marketCap?.raw || ks.marketCap?.raw;
          data.pe = data.pe || sd.trailingPE?.raw || ks.trailingPE?.raw;
          data.forwardPE = data.forwardPE || sd.forwardPE?.raw || ks.forwardPE?.raw;
          data.pb = data.pb || p.priceToBook?.raw || ks.priceToBook?.raw;
          data.eps = data.eps || sd.trailingEps?.raw || ks.trailingEps?.raw;
          data.beta = data.beta || ks.beta?.raw;
          data.dividendYield = data.dividendYield || sd.dividendYield?.raw;
          data.roe = data.roe || fd.returnOnEquity?.raw;
          data.roa = data.roa || fd.returnOnAssets?.raw;
          data.revenueGrowth = data.revenueGrowth || fd.revenueGrowth?.raw;
          data.earningsGrowth = data.earningsGrowth || fd.earningsGrowth?.raw;
          data.grossMargin = data.grossMargin || fd.grossMargins?.raw;
          data.profitMargin = data.profitMargin || fd.profitMargins?.raw;
          data.totalCash = data.totalCash || fd.totalCash?.raw;
          data.totalDebt = data.totalDebt || fd.totalDebt?.raw;
          data.freeCashflow = data.freeCashflow || fd.freeCashflow?.raw;
          data.operatingCashflow = data.operatingCashflow || fd.operatingCashflow?.raw;
          data.totalRevenue = data.totalRevenue || fd.totalRevenue?.raw;
          data.sector = data.sector || ap.sector;
          data.industry = data.industry || ap.industry;

          const rt = r.recommendationTrend || {};
          if (rt.trend && rt.trend.length > 0) {
            const latest = rt.trend[0];
            data.analystStrongBuy = latest.strongBuy || 0;
            data.analystBuy = latest.buy || 0;
            data.analystHold = latest.hold || 0;
            data.analystSell = latest.sell || 0;
            data.analystStrongSell = latest.strongSell || 0;
            data.analystTotal = data.analystStrongBuy + data.analystBuy + data.analystHold + data.analystSell + data.analystStrongSell;
          }
          data.targetMean = data.targetMean || fd.targetMeanPrice?.raw;
          data.targetHigh = data.targetHigh || fd.targetHighPrice?.raw;
          data.targetLow = data.targetLow || fd.targetLowPrice?.raw;
        }
      } catch(e) { console.warn('Summary parse error:', e); }
    }

    if (!data.price && !data.name) {
      data.error = 'NO_YAHOO_DATA: 无法从 Yahoo Finance 获取数据（可能需要 Finnhub Key）';
    }
    return data;
  } catch(e) {
    return { symbol: s, error: `Yahoo Finance 获取失败: ${e.message}`, market: 'US' };
  }
}

// ===== 格式化 =====
function fmt(num, decimals = 2) {
  if (num == null || isNaN(num)) return 'N/A';
  if (Math.abs(num) >= 1e12) return (num / 1e12).toFixed(decimals) + 'T';
  if (Math.abs(num) >= 1e9) return (num / 1e9).toFixed(decimals) + 'B';
  if (Math.abs(num) >= 1e6) return (num / 1e6).toFixed(decimals) + 'M';
  return num.toFixed(decimals);
}

function fmtPct(num) {
  if (num == null || isNaN(num)) return 'N/A';
  return (num > 0 ? '+' : '') + (num * 100).toFixed(2) + '%';
}

function fmtPrice(num) {
  if (num == null || isNaN(num)) return 'N/A';
  if (num < 10) return num.toFixed(3);
  if (num < 100) return num.toFixed(2);
  return num.toFixed(2);
}

function colorNum(num) {
  if (num == null || isNaN(num)) return 'gray';
  return num >= 0 ? 'up' : 'down';
}

// ===== 评分引擎 =====
function score(dataA, dataB) {
  const scores = { A: {}, B: {}, totalA: 0, totalB: 0, missingA: false, missingB: false };

  function scorePE(peA, peB) {
    if (!peA || !peB) return { A: 5, B: 5 };
    const a = Math.max(0, 10 - peA / 30);
    const b = Math.max(0, 10 - peB / 30);
    return { A: Math.min(10, Math.round(a * 10) / 10), B: Math.min(10, Math.round(b * 10) / 10) };
  }

  function scoreGrowth(gA, gB) {
    if (gA == null && gB == null) return { A: 5, B: 5 };
    const a = gA != null ? Math.min(10, Math.max(0, 5 + gA * 40)) : 5;
    const b = gB != null ? Math.min(10, Math.max(0, 5 + gB * 40)) : 5;
    return { A: Math.round(a * 10) / 10, B: Math.round(b * 10) / 10 };
  }

  function scoreProfit(gmA, gmB, pmA, pmB) {
    if (gmA == null && gmB == null && pmA == null && pmB == null) return { A: 5, B: 5 };
    const sa = (gmA || 0.4) * 6 + (pmA || 0.1) * 4;
    const sb = (gmB || 0.4) * 6 + (pmB || 0.1) * 4;
    return { A: Math.round(Math.min(10, sa) * 10) / 10, B: Math.round(Math.min(10, sb) * 10) / 10 };
  }

  function scoreFinance(cashA, debtA, cashB, debtB) {
    function f(cash, debt) {
      if (!cash || !debt) return 5;
      const ratio = cash / debt;
      return Math.min(10, Math.round(ratio * 3 * 10) / 10);
    }
    return { A: f(dataA.totalCash, dataA.totalDebt), B: f(dataB.totalCash, dataB.totalDebt) };
  }

  function scoreCap(mcapA, mcapB) {
    function f(mcap) {
      if (!mcap) return 5;
      if (mcap > 5e11) return 9;
      if (mcap > 1e11) return 7;
      if (mcap > 1e10) return 5;
      return 3;
    }
    return { A: f(dataA.marketCap), B: f(dataB.marketCap) };
  }

  function scoreFCF(fcfA, fcfB) {
    function f(fcf) {
      if (!fcf) return 5;
      if (fcf > 1e10) return 9;
      if (fcf > 1e9) return 7;
      if (fcf > 0) return 5;
      return 2;
    }
    return { A: f(dataA.freeCashflow), B: f(dataB.freeCashflow) };
  }

  function scoreROE(roeA, roeB) {
    function f(roe) {
      if (!roe) return 5;
      return Math.min(10, Math.round(roe * 30 * 10) / 10);
    }
    return { A: f(dataA.roe), B: f(dataB.roe) };
  }

  function scoreShort(sA, sB) {
    function f(s) {
      if (s == null) return 5;
      return Math.min(10, Math.max(0, Math.round((1 - s) * 10 * 10) / 10));
    }
    return { A: f(dataA.shortPercent), B: f(dataB.shortPercent) };
  }

  function scoreAnalyst(aData, bData) {
    function f(d) {
      const total = d.analystTotal || 0;
      if (total === 0) return 5;
      const buyPct = ((d.analystStrongBuy || 0) + (d.analystBuy || 0)) / total;
      return Math.min(10, Math.round(buyPct * 10 * 10) / 10);
    }
    return { A: f(dataA), B: f(dataB) };
  }

  // 检测是否有 A 股数据缺失
  if (dataA.market === 'CN' && dataA.revenueGrowth == null) scores.missingA = true;
  if (dataB.market === 'CN' && dataB.revenueGrowth == null) scores.missingB = true;

  scores.pe = scorePE(dataA.pe, dataB.pe);
  scores.growth = scoreGrowth(dataA.revenueGrowth, dataB.revenueGrowth);
  scores.profit = scoreProfit(dataA.grossMargin, dataB.grossMargin, dataA.profitMargin, dataB.profitMargin);
  scores.finance = scoreFinance(dataA.totalCash, dataA.totalDebt, dataB.totalCash, dataB.totalDebt);
  scores.cap = scoreCap(dataA.marketCap, dataB.marketCap);
  scores.fcf = scoreFCF(dataA.freeCashflow, dataB.freeCashflow);
  scores.roe = scoreROE(dataA.roe, dataB.roe);
  scores.short = scoreShort(dataA.shortPercent, dataB.shortPercent);
  scores.analyst = scoreAnalyst(dataA, dataB);

  const dims = ['pe','growth','profit','finance','cap','fcf','roe','short','analyst'];
  scores.totalA = Math.round(dims.reduce((s, d) => s + scores[d].A, 0) * 10) / 10;
  scores.totalB = Math.round(dims.reduce((s, d) => s + scores[d].B, 0) * 10) / 10;

  return scores;
}

// ===== 投资建议 =====
function verdict(dataA, dataB, scores) {
  const reasons = [];

  if (dataA.pe && dataB.pe) {
    if (dataA.pe < dataB.pe * 0.6) reasons.push({ stock: 'A', text: `PE ${dataA.pe.toFixed(1)} vs ${dataB.pe.toFixed(1)}，估值低${Math.round((1-dataA.pe/dataB.pe)*100)}%` });
    else if (dataB.pe < dataA.pe * 0.6) reasons.push({ stock: 'B', text: `PE ${dataB.pe.toFixed(1)} vs ${dataA.pe.toFixed(1)}，估值低${Math.round((1-dataB.pe/dataA.pe)*100)}%` });
  }

  if (dataA.revenueGrowth != null && dataB.revenueGrowth != null) {
    if (dataA.revenueGrowth > dataB.revenueGrowth * 1.5) reasons.push({ stock: 'A', text: `营收增速${fmtPct(dataA.revenueGrowth)} vs ${fmtPct(dataB.revenueGrowth)}，快${Math.round(dataA.revenueGrowth/dataB.revenueGrowth*100-100)}%` });
    else if (dataB.revenueGrowth > dataA.revenueGrowth * 1.5) reasons.push({ stock: 'B', text: `营收增速${fmtPct(dataB.revenueGrowth)} vs ${fmtPct(dataA.revenueGrowth)}，快${Math.round(dataB.revenueGrowth/dataA.revenueGrowth*100-100)}%` });
  }

  if (dataA.grossMargin != null && dataB.grossMargin != null) {
    if (dataA.grossMargin > dataB.grossMargin + 0.15) reasons.push({ stock: 'A', text: `毛利率${fmtPct(dataA.grossMargin)} vs ${fmtPct(dataB.grossMargin)}` });
    else if (dataB.grossMargin > dataA.grossMargin + 0.15) reasons.push({ stock: 'B', text: `毛利率${fmtPct(dataB.grossMargin)} vs ${fmtPct(dataA.grossMargin)}` });
  }

  let winner = 'tie';
  if (scores.totalA > scores.totalB + 5) winner = 'A';
  else if (scores.totalB > scores.totalA + 5) winner = 'B';

  return { reasons, winner };
}

    ${compRow('经营现金流', fmt(dataA.operatingCashflow), fmt(dataB.operatingCashflow), v => (dataA.currency === 'CNY' ? '¥' : '$') + v, true)}
    ${!isCnA && !isCnB ? compRow('市净率(PB)', dataA.pb ? dataA.pb.toFixed(1) + 'x' : 'N/A', dataB.pb ? dataB.pb.toFixed(1) + 'x' : 'N/A', v => v, false) : ''}
    ${!isCnA && !isCnB ? compRow('做空比例', dataA.shortPercent ? (dataA.shortPercent*100).toFixed(1) + '%' : 'N/A', dataB.shortPercent ? (dataB.shortPercent*100).toFixed(1) + '%' : 'N/A', v => v, false) : ''}
    ${!isCnA && !isCnB ? compRow('Beta', dataA.beta != null ? dataA.beta.toFixed(2) : 'N/A', dataB.beta != null ? dataB.beta.toFixed(2) : 'N/A') : ''}
  </div>
</div>

<!-- 九维评分卡 -->
<div class="card">
  <h3 style="margin-top:0">📊 九维评分卡</h3>
  <div class="score-row" style="border-bottom:2px solid #333;margin-bottom:4px">
    <span class="score-label" style="font-weight:bold">评分维度</span>
    <span class="score-vals">
      <span class="score-item" style="color:#ffd700;font-size:17px">${dataA.symbol}</span>
      <span style="font-size:14px;color:#888;min-width:40px;text-align:center">优势</span>
      <span class="score-item" style="color:#00d4ff;font-size:17px">${dataB.symbol}</span>
    </span>
  </div>
  ${scoreHTML}
  <div class="score-row" style="border-top:2px solid #ffd700;margin-top:8px;padding-top:10px">
    <span class="score-label" style="font-size:20px;font-weight:bold;color:#ffd700">🏆 综合总分</span>
    <span class="score-vals">
      <span class="score-item" style="font-size:26px;color:${winA ? '#ffd700' : '#888'}">${scores.totalA.toFixed(1)}</span>
      <span style="font-size:20px;color:#e94560;font-weight:bold">VS</span>
      <span class="score-item" style="font-size:26px;color:${winB ? '#00d4ff' : '#888'}">${scores.totalB.toFixed(1)}</span>
    </span>
  </div>
</div>

<!-- 券商评测 -->
${(() => {
  if (isCnA && isCnB) {
    return `<div class="card">
      <h3 style="margin-top:0;color:#ffd700">🏦 券商评测</h3>
      <p style="font-size:15px;color:#ffaa44;text-align:center;padding:8px;background:#1a0a00;border-radius:8px">A股券商评级数据开发中，暂显示 N/A。<br>美股请填入 Finnhub API Key 查看。</p>
    </div>`;
  }

  function analystBar(data, color) {
    const total = data.analystTotal || 0;
    if (total === 0) return '<p style="font-size:17px;color:#888;text-align:center">暂无分析师数据</p>';

    const strongBuy = data.analystStrongBuy || 0;
    const buy = data.analystBuy || 0;
    const hold = data.analystHold || 0;
    const sell = data.analystSell || 0;
    const strongSell = data.analystStrongSell || 0;

    const buyPct = ((strongBuy + buy) / total * 100).toFixed(0);
    const holdPct = (hold / total * 100).toFixed(0);
    const sellPct = ((sell + strongSell) / total * 100).toFixed(0);

    let consensus = '', consensusColor = '';
    if (buyPct >= 70) { consensus = '强烈看多'; consensusColor = '#4cff4c'; }
    else if (buyPct >= 50) { consensus = '偏多'; consensusColor = '#a0ffa0'; }
    else if (buyPct >= 30) { consensus = '中性偏多'; consensusColor = '#ffd700'; }
    else if (sellPct >= 50) { consensus = '偏空'; consensusColor = '#ff6666'; }
    else { consensus = '中性'; consensusColor = '#ffd700'; }

    let html = `<div style="text-align:center;margin-bottom:8px">
      <span style="font-size:17px;font-weight:bold;color:${color}">${data.symbol} · ${total} 位分析师</span><br>
      <span style="font-size:14px;color:${consensusColor}">共识：${consensus}</span>
    </div>`;

    html += `<div style="display:flex;height:28px;border-radius:6px;overflow:hidden;margin:6px 0">
      ${strongBuy > 0 ? `<div style="width:${(strongBuy/total*100).toFixed(1)}%;background:#00cc44;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff">${strongBuy}</div>` : ''}
      ${buy > 0 ? `<div style="width:${(buy/total*100).toFixed(1)}%;background:#66dd88;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff">${buy}</div>` : ''}
      ${hold > 0 ? `<div style="width:${(hold/total*100).toFixed(1)}%;background:#888888;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff">${hold}</div>` : ''}
      ${sell > 0 ? `<div style="width:${(sell/total*100).toFixed(1)}%;background:#dd6666;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff">${sell}</div>` : ''}
      ${strongSell > 0 ? `<div style="width:${(strongSell/total*100).toFixed(1)}%;background:#cc2200;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff">${strongSell}</div>` : ''}
    </div>`;

    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:#aaa;margin-bottom:4px">
      <span style="color:#00cc44">强力买入 ${strongBuy}</span>
      <span style="color:#66dd88">买入 ${buy}</span>
      <span style="color:#888">持有 ${hold}</span>
      <span style="color:#dd6666">卖出 ${sell}</span>
      <span style="color:#cc2200">强力卖出 ${strongSell}</span>
    </div>`;

    html += `<div style="display:flex;justify-content:space-around;font-size:18px;margin-top:2px">
      <span><span style="color:#4cff4c;font-weight:bold">买入</span> ${buyPct}%</span>
      <span><span style="color:#ffd700;font-weight:bold">持有</span> ${holdPct}%</span>
      <span><span style="color:#ff4444;font-weight:bold">卖出</span> ${sellPct}%</span>
    </div>`;

    return html;
  }

  let section = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px">';
  section += `<div style="background:#0f0f2a;border-radius:10px;padding:12px">${analystBar(dataA, '#ffd700')}</div>`;
  section += `<div style="background:#0f0f2a;border-radius:10px;padding:12px">${analystBar(dataB, '#00d4ff')}</div>`;
  section += '</div>';

  const hasTargetA = dataA.targetMean != null;
  const hasTargetB = dataB.targetMean != null;
  if (hasTargetA || hasTargetB) {
    section += '<div style="background:#0f0f2a;border-radius:10px;padding:14px;margin-top:8px">';
    section += '<p style="font-size:18px;font-weight:bold;color:#ffd700;text-align:center;margin-bottom:10px">🎯 目标价对比</p>';
    section += '<div class="compare-grid">';

    const symA = dataA.currency === 'CNY' ? '¥' : '$';
    const symB = dataB.currency === 'CNY' ? '¥' : '$';
    const tarA = hasTargetA ? `${symA}${dataA.targetLow.toFixed(2)} ~ <b style="color:#ffd700;font-size:20px">${symA}${dataA.targetMean.toFixed(2)}</b> ~ ${symA}${dataA.targetHigh.toFixed(2)}` : 'N/A';
    const tarB = hasTargetB ? `${symB}${dataB.targetLow.toFixed(2)} ~ <b style="color:#00d4ff;font-size:20px">${symB}${dataB.targetMean.toFixed(2)}</b> ~ ${symB}${dataB.targetHigh.toFixed(2)}` : 'N/A';
    section += `<div style="text-align:center;font-size:16px">${tarA}</div>`;
    section += '<div style="text-align:center;font-size:15px;color:#888;font-weight:bold">目标价</div>';
    section += `<div style="text-align:center;font-size:16px">${tarB}</div>`;

    if (hasTargetA && dataA.price) {
      const upsideA = ((dataA.targetMean - dataA.price) / dataA.price * 100).toFixed(1);
      const upColorA = upsideA > 0 ? '#4cff4c' : '#ff4444';
      section += `<div style="text-align:center;font-size:18px;font-weight:bold;color:${upColorA}">${upsideA > 0 ? '+' : ''}${upsideA}% 上行空间</div>`;
      section += '<div style="text-align:center;font-size:14px;color:#888">潜力</div>';
    } else {
      section += '<div></div><div></div>';
    }
    if (hasTargetB && dataB.price) {
      const upsideB = ((dataB.targetMean - dataB.price) / dataB.price * 100).toFixed(1);
      const upColorB = upsideB > 0 ? '#4cff4c' : '#ff4444';
      section += `<div style="text-align:center;font-size:18px;font-weight:bold;color:${upColorB}">${upsideB > 0 ? '+' : ''}${upsideB}% 上行空间</div>`;
    }

    section += '</div></div>';
  }
  return section;
})()}

<!-- 投资建议 -->
<div class="card verdict">
  <h3 style="margin-top:0;color:#ffd700">💡 投资建议</h3>
  ${v.reasons.length > 0 ? v.reasons.map(r => 
    `<p class="verdict-text">🔑 <b style="color:${r.stock==='A'?'#ffd700':'#00d4ff'}">${r.stock==='A'?dataA.symbol:dataB.symbol}</b> 胜出：${r.text}</p>`
  ).join('') : '<p class="verdict-text gray">两只股票各有所长，建议结合行业趋势和个人风险偏好判断</p>'}

  <div style="margin-top:12px;padding:12px;background:#0a0a1a;border-radius:10px">
    <p style="font-size:18px;line-height:1.8">
      <b style="color:#ffd700">${dataA.symbol}</b>：${scores.totalA >= scores.totalB ? '<span class="tag buy">综合更优</span>' : (scores.totalA >= scores.totalB - 3 ? '<span class="tag hold">差距不大</span>' : '<span class="tag sell">估值偏贵</span>')}
      ${dataA.pe && dataA.pe > 200 ? ' ⚠️ PE极高，需注意回调风险' : ''}
      ${dataA.pe && dataA.pe < 15 ? ' ✅ 低估值' : ''}
      ${dataA.grossMargin && dataA.grossMargin > 0.7 ? ' ✅ 顶级毛利率' : ''}
      <br>
      <b style="color:#00d4ff">${dataB.symbol}</b>：${scores.totalB >= scores.totalA ? '<span class="tag buy">综合更优</span>' : (scores.totalB >= scores.totalA - 3 ? '<span class="tag hold">差距不大</span>' : '<span class="tag sell">估值偏贵</span>')}
      ${dataB.pe && dataB.pe > 200 ? ' ⚠️ PE极高，需注意回调风险' : ''}
      ${dataB.pe && dataB.pe < 15 ? ' ✅ 低估值' : ''}
      ${dataB.grossMargin && dataB.grossMargin > 0.7 ? ' ✅ 顶级毛利率' : ''}
    </p>
    <p style="font-size:14px;color:#888;margin-top:8px;text-align:center">⚠️ 以上为数据分析，不构成投资建议。股市有风险，投资需谨慎。</p>
  </div>
</div>
  `;

  const resultEl = document.getElementById('result');
  if (resultEl) resultEl.innerHTML = html;
}

// ===== 主流程 =====
function quickCompare(a, b) {
  const ta = document.getElementById('tickerA');
  const tb = document.getElementById('tickerB');
  if (ta) ta.value = a;
  if (tb) tb.value = b;
  compare();
}

async function compare() {
  const codeA = document.getElementById('tickerA')?.value?.trim();
  const codeB = document.getElementById('tickerB')?.value?.trim();

  if (!codeA || !codeB) {
    showError('请输入两只股票的代码');
    return;
  }

  showLoading(true);
  hideError();
  const resultEl = document.getElementById('result');
  if (resultEl) resultEl.innerHTML = '';

  try {
    const [dataA, dataB] = await Promise.all([
      fetchStockData(codeA),
      fetchStockData(codeB)
    ]);

    // 处理错误
    let errorMsg = '';
    if (dataA.error && dataA.error !== 'NO_FINNHUB_KEY') {
      errorMsg += `${dataA.symbol}: ${dataA.error}\n`;
    }
    if (dataB.error && dataB.error !== 'NO_FINNHUB_KEY') {
      errorMsg += `${dataB.symbol}: ${dataB.error}\n`;
    }

    // 特殊处理：没有 Finnhub Key 且 Yahoo 也失败
    if (dataA.error === 'NO_FINNHUB_KEY' || dataB.error === 'NO_FINNHUB_KEY') {
      errorMsg = '📌 提示：未配置 Finnhub API Key，美股数据可能无法获取。\n\n请点击右上角 ⚙️ 填入免费 Finnhub Key，或在此页面顶部横幅中粘贴 Key。\n\n获取方式：访问 finnhub.io → 注册（免费）→ 复制 API Key';
    } else if (errorMsg.includes('NO_YAHOO_DATA')) {
      errorMsg = '📌 Yahoo Finance 数据获取失败（可能被浏览器 CORS 策略拦截）。\n\n✅ 解决方案：点击右上角 ⚙️ 填入 Finnhub API Key（免费注册 finnhub.io）';
    }

    if (errorMsg) {
      showError(errorMsg);
      // 如果至少有一个成功，仍然渲染
      if (dataA.price || dataB.price) {
        const scores = score(dataA, dataB);
        const v = verdict(dataA, dataB, scores);
        render(dataA, dataB, scores, v);
      }
    } else {
      const scores = score(dataA, dataB);
      const v = verdict(dataA, dataB, scores);
      render(dataA, dataB, scores, v);
    }
  } catch(e) {
    showError('数据获取失败: ' + e.message);
  }

  showLoading(false);
}

function showLoading(show) {
  const el = document.getElementById('loading');
  const btn = document.getElementById('searchBtn');
  if (el) el.classList.toggle('show', show);
  if (btn) btn.disabled = show;
}

function showError(msg) {
  const el = document.getElementById('error');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  const el = document.getElementById('error');
  if (el) el.classList.remove('show');
}

// ===== 页面初始化 =====
loadSettings();
updateKeyBanner();
</script>
</body>
</html>
