// ============================================================
// 工具函数
// ============================================================
function detectMarket(code) {
  return /^\d{6}$/.test(code.trim()) ? 'CN' : 'US';
}

function fmtNum(num, decimals) {
  if (num == null || isNaN(num)) return 'N/A';
  var abs = Math.abs(num);
  if (abs >= 1e12) return (num / 1e12).toFixed(decimals || 2) + '万亿';
  if (abs >= 1e8) return (num / 1e8).toFixed(decimals || 2) + '亿';
  if (abs >= 1e4) return (num / 1e4).toFixed(decimals || 2) + '万';
  return num.toFixed(decimals || 2);
}

function fmtPct(num) {
  if (num == null || isNaN(num)) return 'N/A';
  return (num > 0 ? '+' : '') + (num * 100).toFixed(2) + '%';
}

function fmtPrice(num, currency) {
  if (num == null || isNaN(num)) return 'N/A';
  var sym = currency === 'CNY' ? '¥' : '$';
  if (currency === 'CNY') {
    return sym + (num >= 100 ? num.toFixed(0) : num.toFixed(2));
  }
  return sym + num.toFixed(2);
}

function colorClass(num) {
  if (num == null || isNaN(num)) return 'gray';
  return num >= 0 ? 'up' : 'down';
}

function getFinnhubKey() {
  return localStorage.getItem('finnhub_key') || '';
}

function saveKey() {
  var key = document.getElementById('finnhubKey').value.trim();
  if (!key) { alert('请输入有效的 API Key'); return; }
  localStorage.setItem('finnhub_key', key);
  document.getElementById('apiSettings').style.display = 'none';
  alert('✅ API Key 已保存！现在可以查询非预设股票了。');
}

function toggleSettings() {
  var el = document.getElementById('apiSettings');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  if (el.style.display === 'block') {
    document.getElementById('finnhubKey').value = getFinnhubKey();
  }
}

// ============================================================
// 评分引擎（9维）
// ============================================================
function score(dataA, dataB) {
  var s = {
    pe: {A:0,B:0}, growth: {A:0,B:0}, profit: {A:0,B:0},
    finance: {A:0,B:0}, cap: {A:0,B:0}, fcf: {A:0,B:0},
    roe: {A:0,B:0}, analyst: {A:0,B:0}, valuation: {A:0,B:0}
  };

  // PE评分（越低越好，上限50）
  s.pe.A = dataA.pe > 0 ? Math.max(0, Math.min(10, 10 - (dataA.pe - 10) / 5)) : 5;
  s.pe.B = dataB.pe > 0 ? Math.max(0, Math.min(10, 10 - (dataB.pe - 10) / 5)) : 5;

  // 成长性
  function scG(g) { return g == null ? 5 : Math.min(10, Math.max(0, g * 40)); }
  s.growth.A = scG(dataA.revenueGrowth);
  s.growth.B = scG(dataB.revenueGrowth);

  // 盈利能力
  function scP(pm, om) { return Math.min(10, Math.max(0, (pm||0)*20 + (om||0)*15)); }
  s.profit.A = scP(dataA.profitMargin, dataA.operatingMargin);
  s.profit.B = scP(dataB.profitMargin, dataB.operatingMargin);

  // 财务稳健
  function scF(fcf, d2e) {
    if (!fcf && !d2e) return 5;
    var score = 5;
    if (fcf > 1e10) score += 3; else if (fcf > 1e9) score += 2; else if (fcf > 0) score += 1;
    if (d2e && d2e < 0.3) score += 2; else if (d2e && d2e < 0.6) score += 1;
    return Math.min(10, score);
  }
  s.finance.A = scF(dataA.freeCashFlow, dataA.debtToEquity);
  s.finance.B = scF(dataB.freeCashFlow, dataB.debtToEquity);

  // 现金流质量
  function scFCF(fcf) {
    if (!fcf) return 5;
    if (fcf > 1e10) return 9; if (fcf > 1e9) return 7; if (fcf > 0) return 5; return 2;
  }
  s.fcf.A = scFCF(dataA.freeCashFlow);
  s.fcf.B = scFCF(dataB.freeCashFlow);

  // ROE
  function scROE(r) { return r == null ? 5 : Math.min(10, Math.max(0, r * 30)); }
  s.roe.A = scROE(dataA.roe);
  s.roe.B = scROE(dataB.roe);

  // 分析师共识
  function scAn(d) {
    var ac = d.analystCounts; if (!ac) return 5;
    var total = (ac.strongBuy||0)+(ac.buy||0)+(ac.hold||0)+(ac.sell||0)+(ac.strongSell||0);
    if (total === 0) return 5;
    return Math.min(10, ((ac.strongBuy||0)+(ac.buy||0))/total * 10);
  }
  s.analyst.A = scAn(dataA);
  s.analyst.B = scAn(dataB);

  // 估值合理性（PEG）
  function scV(pe, peg) {
    if (peg && peg > 0) return peg < 1 ? 9 : peg < 1.5 ? 7 : peg < 2 ? 5 : 3;
    if (pe && pe > 0) return pe < 15 ? 9 : pe < 25 ? 7 : pe < 35 ? 5 : 3;
    return 5;
  }
  s.valuation.A = scV(dataA.pe, dataA.peg);
  s.valuation.B = scV(dataB.pe, dataB.peg);

  // 总分
  var dims = ['pe','growth','profit','finance','fcf','roe','analyst','valuation'];
  s.totalA = 0; s.totalB = 0;
  for (var i = 0; i < dims.length; i++) {
    s.totalA += s[dims[i]].A;
    s.totalB += s[dims[i]].B;
  }
  s.totalA = Math.round(s.totalA * 10) / 10;
  s.totalB = Math.round(s.totalB * 10) / 10;
  return s;
}

// ============================================================
// 深度报告生成（核心！）
// ============================================================
function generateDeepReport(dataA, dataB, scores) {
  var isCnA = dataA.market === 'CN';
  var isCnB = dataB.market === 'CN';
  var symA = isCnA ? '¥' : '$';
  var symB = isCnB ? '¥' : '$';

  // 上行空间
  var upsideA = dataA.targetMean && dataA.price ? (dataA.targetMean / dataA.price - 1) : null;
  var upsideB = dataB.targetMean && dataB.price ? (dataB.targetMean / dataB.price - 1) : null;

  // 评分维度中文名
  var dimNames = {
    pe:'估值合理性(PE)', growth:'成长性', profit:'盈利能力',
    finance:'财务稳健', fcf:'现金流', roe:'ROE回报',
    analyst:'分析师共识', valuation:'估值(PEG)'
  };

  // 胜出统计
  var winA = 0, winB = 0;
  var dims = ['pe','growth','profit','finance','fcf','roe','analyst','valuation'];
  for (var i = 0; i < dims.length; i++) {
    if (scores[dims[i]].A > scores[dims[i]].B) winA++;
    else if (scores[dims[i]].B > scores[dims[i]].A) winB++;
  }

  var html = '';

  // ========== 一、核心结论 ==========
  html += '<div class="report-section">';
  html += '<h2>一、核心结论（先说重点）</h2>';
  html += '<table class="report-table">';
  html += '<tr><th>维度</th><th>' + dataA.symbol + ' (' + dataA.name + ')</th><th>' + dataB.symbol + ' (' + dataB.name + ')</th><th>胜出</th></tr>';

  for (var i = 0; i < dims.length; i++) {
    var d = dims[i];
    var aVal = '-', bVal = '-';
    // 显示关键指标值
    if (d === 'pe') { aVal = dataA.pe ? dataA.pe.toFixed(1)+'x' : 'N/A'; bVal = dataB.pe ? dataB.pe.toFixed(1)+'x' : 'N/A'; }
    else if (d === 'growth') { aVal = dataA.revenueGrowth != null ? fmtPct(dataA.revenueGrowth) : 'N/A'; bVal = dataB.revenueGrowth != null ? fmtPct(dataB.revenueGrowth) : 'N/A'; }
    else if (d === 'profit') { aVal = dataA.profitMargin != null ? fmtPct(dataA.profitMargin) : 'N/A'; bVal = dataB.profitMargin != null ? fmtPct(dataB.profitMargin) : 'N/A'; }
    else if (d === 'finance') { aVal = dataA.debtToEquity != null ? dataA.debtToEquity.toFixed(2) : 'N/A'; bVal = dataB.debtToEquity != null ? dataB.debtToEquity.toFixed(2) : 'N/A'; }
    else if (d === 'fcf') { aVal = dataA.freeCashFlow ? fmtNum(dataA.freeCashFlow) : 'N/A'; bVal = dataB.freeCashFlow ? fmtNum(dataB.freeCashFlow) : 'N/A'; }
    else if (d === 'roe') { aVal = dataA.roe != null ? fmtPct(dataA.roe) : 'N/A'; bVal = dataB.roe != null ? fmtPct(dataB.roe) : 'N/A'; }
    else if (d === 'analyst') { aVal = dataA.analystCounts ? (dataA.analystCounts.strongBuy+dataA.analystCounts.buy)+'/'+Object.values(dataA.analystCounts).reduce(function(s,v){return s+v},0) : 'N/A'; bVal = dataB.analystCounts ? (dataB.analystCounts.strongBuy+dataB.analystCounts.buy)+'/'+Object.values(dataB.analystCounts).reduce(function(s,v){return s+v},0) : 'N/A'; }
    else if (d === 'valuation') { aVal = dataA.peg ? 'PEG '+dataA.peg.toFixed(1) : (dataA.pe ? 'PE '+dataA.pe.toFixed(1) : 'N/A'); bVal = dataB.peg ? 'PEG '+dataB.peg.toFixed(1) : (dataB.pe ? 'PE '+dataB.pe.toFixed(1) : 'N/A'); }

    var winner = scores[d].A > scores[d].B ? dataA.symbol : scores[d].B > scores[d].A ? dataB.symbol : '=';
    var winnerColor = scores[d].A > scores[d].B ? 'style="color:#ffd700;font-weight:bold"' : scores[d].B > scores[d].A ? 'style="color:#00d4ff;font-weight:bold"' : '';
    html += '<tr><td>' + dimNames[d] + '</td><td>' + aVal + '</td><td>' + bVal + '</td><td ' + winnerColor + '>' + winner + '</td></tr>';
  }

  // 总分行
  html += '<tr style="background:#1a1a0a"><td><b>综合总分</b></td><td><b style="color:' + (scores.totalA >= scores.totalB ? '#ffd700' : '#888') + '">' + scores.totalA.toFixed(1) + '</b></td><td><b style="color:' + (scores.totalB >= scores.totalA ? '#00d4ff' : '#888') + '">' + scores.totalB.toFixed(1) + '</b></td><td><b style="color:#ffd700">' + (scores.totalA > scores.totalB ? dataA.symbol : scores.totalB > scores.totalA ? dataB.symbol : '平局') + '</b></td></tr>';
  html += '</table>';

  // 结论文字
  var winner = scores.totalA > scores.totalB + 2 ? 'A' : scores.totalB > scores.totalA + 2 ? 'B' : 'tie';
  html += '<div class="verdict-box" style="margin-top:12px">';

    html += '<p>🏆 <b style="color:#ffd700">' + dataA.symbol + '</b> 综合评分更高（' + scores.totalA.toFixed(1) + ' vs ' + scores.totalB.toFixed(1) + '），在 <b>' + winA + '</b> 个维度胜出。</p>';
  } else if (winner === 'B') {
    html += '<p>🏆 <b style="color:#00d4ff">' + dataB.symbol + '</b> 综合评分更高（' + scores.totalB.toFixed(1) + ' vs ' + scores.totalA.toFixed(1) + '），在 <b>' + winB + '</b> 个维度胜出。</p>';

  }

    findings.push((dataA.revenueGrowth > dataB.revenueGrowth ? dataA.symbol : dataB.symbol) + ' 营收增速更快（' + fmtPct(Math.max(dataA.revenueGrowth, dataB.revenueGrowth)) + '）');
  }
  if (dataA.roe != null && dataB.roe != null && Math.abs(dataA.roe - dataB.roe) > 0.1) {
    findings.push((dataA.roe > dataB.roe ? dataA.symbol : dataB.symbol) + ' ROE更高（' + fmtPct(Math.max(dataA.roe, dataB.roe)) + '）');

  html += '<h2>二、公司定位对比</h2>';
  html += '<table class="report-table">';
  html += '<tr><th>项目</th><th>' + dataA.symbol + '</th><th>' + dataB.symbol + '</th></tr>';
  html += '<tr><td>公司名称</td><td>' + dataA.name + '</td><td>' + dataB.name + '</td></tr>';
  html += '<tr><td>行业</td><td>' + (dataA.industry||'N/A') + '</td><td>' + (dataB.industry||'N/A') + '</td></tr>';
  html += '<tr><td>交易所</td><td>' + (isCnA ? '中国A股' : dataA.exchange) + '</td><td>' + (isCnB ? '中国A股' : dataB.exchange) + '</td></tr>';
  html += '<tr><td>市值</td><td>' + (dataA.marketCap ? symA + fmtNum(dataA.marketCap) : 'N/A') + '</td><td>' + (dataB.marketCap ? symB + fmtNum(dataB.marketCap) : 'N/A') + '</td></tr>';
  html += '<tr><td>当前股价</td><td><span class="' + colorClass(dataA.changePct) + '">' + fmtPrice(dataA.price, dataA.currency) + ' (' + (dataA.changePct != null ? (dataA.changePct > 0 ? '+' : '') + dataA.changePct.toFixed(2) + '%' : 'N/A') + ')</span></td><td><span class="' + colorClass(dataB.changePct) + '">' + fmtPrice(dataB.price, dataB.currency) + ' (' + (dataB.changePct != null ? (dataB.changePct > 0 ? '+' : '') + dataB.changePct.toFixed(2) + '%' : 'N/A') + ')</span></td></tr>';
  html += '<tr><td>52周高/低</td><td>' + (dataA.week52High ? fmtPrice(dataA.week52High, dataA.currency) + ' / ' + fmtPrice(dataA.week52Low, dataA.currency) : 'N/A') + '</td><td>' + (dataB.week52High ? fmtPrice(dataB.week52High, dataB.currency) + ' / ' + fmtPrice(dataB.week52Low, dataB.currency) : 'N/A') + '</td></tr>';
  html += '</table>';

  if (dataA.business || dataB.business) {
    html += '<h3>业务定位</h3>';
    html += '<p style="color:#ccc;line-height:1.8">' + dataA.symbol + '：' + (dataA.business||'数据不足') + '</p>';
    html += '<p style="color:#ccc;line-height:1.8">' + dataB.symbol + '：' + (dataB.business||'数据不足') + '</p>';
  }
  if (dataA.moat || dataB.moat) {
    html += '<h3>护城河</h3>';
    html += '<p style="color:#ccc;line-height:1.8">' + dataA.symbol + '：' + (dataA.moat||'数据不足') + '</p>';
    html += '<p style="color:#ccc;line-height:1.8">' + dataB.symbol + '：' + (dataB.moat||'数据不足') + '</p>';
  }
  html += '</div>';

  // ========== 三、财务数据对比 ==========
  html += '<div class="report-section">';
  html += '<h2>三、财务数据对比</h2>';
  html += '<table class="report-table">';
  html += '<tr><th>指标</th><th>' + dataA.symbol + '</th><th>' + dataB.symbol + '</th><th>对比</th></tr>';

  function addRow(label, valA, valB, lowerBetter) {
    var aStr = valA != null ? valA : 'N/A';
    var bStr = valB != null ? valB : 'N/A';
    var cmp = '';
    if (valA != null && valB != null) {
      if (lowerBetter) cmp = valA < valB ? '✅A优' : valB < valA ? '✅B优' : '=';
      else cmp = valA > valB ? '✅A优' : valB > valA ? '✅B优' : '=';
    }
    html += '<tr><td>' + label + '</td><td>' + aStr + '</td><td>' + bStr + '</td><td>' + cmp + '</td></tr>';
  }

  addRow('股价', fmtPrice(dataA.price, dataA.currency), fmtPrice(dataB.price, dataB.currency), false);
  addRow('PE (TTM)', dataA.pe ? dataA.pe.toFixed(1)+'x' : 'N/A', dataB.pe ? dataB.pe.toFixed(1)+'x' : 'N/A', false);
  addRow('远期PE', dataA.forwardPe ? dataA.forwardPe.toFixed(1)+'x' : 'N/A', dataB.forwardPe ? dataB.forwardPe.toFixed(1)+'x' : 'N/A', false);
  addRow('PEG', dataA.peg ? dataA.peg.toFixed(1) : 'N/A', dataB.peg ? dataB.peg.toFixed(1) : 'N/A', false);
  addRow('PB', dataA.pb ? dataA.pb.toFixed(1)+'x' : 'N/A', dataB.pb ? dataB.pb.toFixed(1)+'x' : 'N/A', false);
  addRow('PS', dataA.ps ? dataA.ps.toFixed(1)+'x' : 'N/A', dataB.ps ? dataB.ps.toFixed(1)+'x' : 'N/A', false);
  addRow('营收增速', dataA.revenueGrowth != null ? fmtPct(dataA.revenueGrowth) : 'N/A', dataB.revenueGrowth != null ? fmtPct(dataB.revenueGrowth) : 'N/A', true);
  addRow('净利润增速', dataA.earningsGrowth != null ? fmtPct(dataA.earningsGrowth) : 'N/A', dataB.earningsGrowth != null ? fmtPct(dataB.earningsGrowth) : 'N/A', true);
  addRow('毛利率', dataA.grossMargin != null ? fmtPct(dataA.grossMargin) : 'N/A', dataB.grossMargin != null ? fmtPct(dataB.grossMargin) : 'N/A', true);
  addRow('净利率', dataA.profitMargin != null ? fmtPct(dataA.profitMargin) : 'N/A', dataB.profitMargin != null ? fmtPct(dataB.profitMargin) : 'N/A', true);
  addRow('经营利润率', dataA.operatingMargin != null ? fmtPct(dataA.operatingMargin) : 'N/A', dataB.operatingMargin != null ? fmtPct(dataB.operatingMargin) : 'N/A', true);
  addRow('ROE', dataA.roe != null ? fmtPct(dataA.roe) : 'N/A', dataB.roe != null ? fmtPct(dataB.roe) : 'N/A', true);
  addRow('债务/权益', dataA.debtToEquity != null ? dataA.debtToEquity.toFixed(2) : 'N/A', dataB.debtToEquity != null ? dataB.debtToEquity.toFixed(2) : 'N/A', false);
  addRow('流动比率', dataA.currentRatio != null ? dataA.currentRatio.toFixed(2) : 'N/A', dataB.currentRatio != null ? dataB.currentRatio.toFixed(2) : 'N/A', true);
  addRow('自由现金流', dataA.freeCashFlow ? fmtNum(dataA.freeCashFlow) : 'N/A', dataB.freeCashFlow ? fmtNum(dataB.freeCashFlow) : 'N/A', true);
  addRow('Beta', dataA.beta != null ? dataA.beta.toFixed(2) : 'N/A', dataB.beta != null ? dataB.beta.toFixed(2) : 'N/A', false);

  html += '</table></div>';

  // ========== 四、估值分析 ==========
  html += '<div class="report-section">';
  html += '<h2>四、估值分析</h2>';

  function valuationSection(data, sym, color) {
    html += '<div style="background:#0a0a1a;border:1px solid #222;border-radius:10px;padding:12px;margin:8px 0">';
    html += '<h3 style="color:' + color + '">' + sym + ' 估值分析</h3>';
    if (data.pe) {
      var peLevel = data.pe > 50 ? '极高' : data.pe > 30 ? '偏高' : data.pe > 15 ? '合理' : '极低';
      html += '<p>PE ' + data.pe.toFixed(1) + 'x —— 估值<b>' + peLevel + '</b>';
      if (data.peg) html += '｜ PEG ' + data.peg.toFixed(1) + '（' + (data.peg < 1 ? '低估' : data.peg < 1.5 ? '合理' : '偏高') + '）';
      html += '</p>';
    }
    if (data.targetMean) {
      var upside = (data.targetMean / data.price - 1) * 100;
      html += '<p>机构目标价均值 <b>' + fmtPrice(data.targetMean, data.currency) + '</b>，上行空间 <b class="' + (upside > 0 ? 'up' : 'down') + '">' + fmtPct(upside/100) + '</b>';

        html += '<br>目标价区间：' + fmtPrice(data.targetLow, data.currency) + ' ~ ' + fmtPrice(data.targetHigh, data.currency);

    html += '<div class="verdict-box" style="margin-top:8px">';
    html += '<p><b>估值对比结论：</b>';
    if (dataA.peg && dataB.peg) {
      html += dataA.peg < dataB.peg ? dataA.symbol + ' 的 PEG 更低（' + dataA.peg.toFixed(1) + ' vs ' + dataB.peg.toFixed(1) + '），估值更有效。' : dataB.peg < dataA.peg ? dataB.symbol + ' 的 PEG 更低（' + dataB.peg.toFixed(1) + ' vs ' + dataA.peg.toFixed(1) + '），估值更有效。' : '两只股票 PEG 相近，估值效率相当。';
    } else if (dataA.pe && dataB.pe) {
      html += dataA.pe < dataB.pe * 0.7 ? dataA.symbol + ' PE 明显更低（' + dataA.pe.toFixed(1) + 'x vs ' + dataB.pe.toFixed(1) + 'x），估值更安全。' : dataB.pe < dataA.pe * 0.7 ? dataB.symbol + ' PE 明显更低（' + dataB.pe.toFixed(1) + 'x vs ' + dataA.pe.toFixed(1) + 'x），估值更安全。' : '两只股票 PE 相近，估值水平相当。';
    }
    html += '</p></div>';
  }
  html += '</div>';

  // ========== 五、分析师共识 ==========
  html += '<div class="report-section">';
  html += '<h2>五、分析师共识</h2>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';

  function analystDetail(data, color) {
    var ac = data.analystCounts;
    if (!ac) { html += '<div style="background:#0a0a1a;border-radius:10px;padding:12px"><p style="color:#888">暂无分析师数据</p></div>'; return; }
    var total = (ac.strongBuy||0)+(ac.buy||0)+(ac.hold||0)+(ac.sell||0)+(ac.strongSell||0);
    if (total === 0) { html += '<div style="background:#0a0a1a;border-radius:10px;padding:12px"><p style="color:#888">暂无分析师数据</p></div>'; return; }

    var buyPct = ((ac.strongBuy||0)+(ac.buy||0)) / total * 100;
    var consensus = buyPct >= 70 ? '强烈看多' : buyPct >= 50 ? '偏多' : buyPct >= 30 ? '中性' : '偏空';
    var consensusColor = buyPct >= 70 ? '#4cff4c' : buyPct >= 50 ? '#a0ffa0' : buyPct >= 30 ? '#ffd700' : '#ff6666';

    html += '<div style="background:#0a0a1a;border:1px solid #222;border-radius:10px;padding:12px">';
    html += '<div style="text-align:center;margin-bottom:8px"><span style="font-size:17px;font-weight:bold;color:' + color + '">' + data.symbol + '</span> · <span style="color:#aaa">' + total + '位分析师</span></div>';
    html += '<div style="text-align:center;margin-bottom:8px"><span style="font-size:15px;color:' + consensusColor + ';font-weight:bold">' + consensus + '</span> · 买入共识 ' + buyPct.toFixed(0) + '%</div>';

    // 评级条
    var parts = [];
    if (ac.strongBuy > 0) parts.push('<span style="background:#00cc44;padding:2px 6px;border-radius:4px;font-size:12px;color:#fff">' + ac.strongBuy + '强买</span>');
    if (ac.buy > 0) parts.push('<span style="background:#66dd88;padding:2px 6px;border-radius:4px;font-size:12px;color:#fff">' + ac.buy + '买入</span>');
    if (ac.hold > 0) parts.push('<span style="background:#888;padding:2px 6px;border-radius:4px;font-size:12px;color:#fff">' + ac.hold + '持有</span>');
    if (ac.sell > 0) parts.push('<span style="background:#dd6666;padding:2px 6px;border-radius:4px;font-size:12px;color:#fff">' + ac.sell + '卖出</span>');
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:8px">' + parts.join('') + '</div>';

    if (data.targetMean) {
      html += '<div style="text-align:center;font-size:15px">目标价 <b>' + fmtPrice(data.targetMean, data.currency) + '</b>｜上行 <b class="' + colorClass(upsideA) + '">' + (data === dataA ? fmtPct(upsideA) : fmtPct(upsideB)) + '</b></div>';
    }
    html += '</div>';
  }

  analystDetail(dataA, '#ffd700');
  analystDetail(dataB, '#00d4ff');
  html += '</div></div>';

  // ========== 六、投资风险 ==========
  html += '<div class="report-section">';
  html += '<h2>六、投资风险</h2>';

  function riskSection(data, color) {
    html += '<div style="margin:8px 0">';
    html += '<h3 style="color:' + color + '">' + data.symbol + ' 主要风险</h3>';
    if (data.risks && data.risks.length > 0) {
      for (var j = 0; j < data.risks.length; j++) {
        html += '<div class="risk-item">' + (j+1) + '. ' + data.risks[j] + '</div>';
      }
    } else {
      html += '<p style="color:#888">暂无风险数据</p>';
    }
    html += '</div>';
  }

  riskSection(dataA, '#ffd700');
  riskSection(dataB, '#00d4ff');
  html += '</div>';

  // ========== 七、核心优势 ==========
  html += '<div class="report-section">';
  html += '<h2>七、核心优势</h2>';

  function strengthSection(data, color) {
    html += '<div style="margin:8px 0">';
    html += '<h3 style="color:' + color + '">' + data.symbol + ' 核心优势</h3>';
    if (data.strengths && data.strengths.length > 0) {
      for (var j = 0; j < data.strengths.length; j++) {
        html += '<div class="strength-item">' + (j+1) + '. ' + data.strengths[j] + '</div>';
      }
    } else {
      html += '<p style="color:#888">暂无优势数据</p>';
    }
    html += '</div>';
  }

  strengthSection(dataA, '#ffd700');
  strengthSection(dataB, '#00d4ff');
  html += '</div>';

  // ========== 八、最终建议 ==========
  html += '<div class="report-section">';
  html += '<h2>八、最终投资建议</h2>';

  function adviceBox(data, scoresTotal, otherTotal, color) {
    var peRisk = data.pe && data.pe > 50 ? '⚠️ PE极高，估值风险大' : data.pe && data.pe < 15 ? '✅ 估值合理偏低' : '';
    var growth = data.revenueGrowth && data.revenueGrowth > 0.2 ? '✅ 高成长' : data.revenueGrowth && data.revenueGrowth < 0 ? '⚠️ 营收负增长' : '';
    var roeFlag = data.roe && data.roe > 0.2 ? '✅ ROE优秀' : data.roe && data.roe < 0.05 ? '⚠️ ROE偏低' : '';

    html += '<div style="background:#0a0a1a;border:1px solid #333;border-radius:10px;padding:12px;margin:8px 0">';
    html += '<div style="font-size:18px;font-weight:bold;color:' + color + ';margin-bottom:8px">' + data.symbol + ' 评估</div>';
    if (peRisk) html += '<p>' + peRisk + '</p>';
    if (growth) html += '<p>' + growth + '</p>';
    if (roeFlag) html += '<p>' + roeFlag + '</p>';
    if (data.targetMean && data.price) {
      var ups = (data.targetMean / data.price - 1) * 100;
      html += '<p>机构目标价上行空间：<b class="' + (ups > 0 ? 'up' : 'down') + '">' + fmtPct(ups/100) + '</b></p>';
    }
    // 推荐度
    var rating = '';
    var stars = '';
    if (scoresTotal > otherTotal + 3) { rating = '推荐买入'; stars = '⭐⭐⭐⭐'; }
    else if (scoresTotal > otherTotal) { rating = '谨慎买入'; stars = '⭐⭐⭐'; }
    else if (scoresTotal === otherTotal) { rating = '持有观望'; stars = '⭐⭐'; }
    else { rating = '暂不推荐'; stars = '⭐'; }
    html += '<p style="font-size:17px;margin-top:8px">推荐度：' + stars + ' <b style="color:' + color + '">' + rating + '</b></p>';
    html += '</div>';
  }

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  adviceBox(dataA, scores.totalA, scores.totalB, '#ffd700');
  adviceBox(dataB, scores.totalB, scores.totalA, '#00d4ff');
  html += '</div>';

  // 总结
  html += '<div class="verdict-box" style="margin-top:12px">';
  html += '<p><b>综合判断：</b>';
  if (scores.totalA > scores.totalB + 3) {
    html += dataA.symbol + ' 综合质量明显优于 ' + dataB.symbol + '，适合优先考虑。但需结合估值判断是否入场时机。';
  } else if (scores.totalB > scores.totalA + 3) {
    html += dataB.symbol + ' 综合质量明显优于 ' + dataA.symbol + '，适合优先考虑。但需结合估值判断是否入场时机。';
  } else if (Math.abs(scores.totalA - scores.totalB) <= 3) {
    html += '两只股票综合质量接近，选择应基于：①估值吸引力（PE/PEG）；②个人对行业的偏好；③风险承受能力（Beta值）。';
  } else {
    html += scores.totalA > scores.totalB ? dataA.symbol : dataB.symbol;
    html += ' 综合评分略高，但差距不大。建议进一步研究具体业务和最新财报后再做决定。';
  }
  html += '</p>';
  html += '<p style="font-size:13px;color:#888;margin-top:8px">⚠️ 以上为数据分析，不构成投资建议。股市有风险，投资需谨慎。</p>';
  html += '</div></div>';

  return html;
}

// 数据获取
// ============================================================
function getStaticData(symbol) {
  var s = symbol.trim().toUpperCase();
  if (STATIC_DATA[s]) {
    var d = {};
    for (var key in STATIC_DATA[s]) d[key] = STATIC_DATA[s][key];
    d.market = detectMarket(s);
    d.dataSource = 'static';
    return d;
  }
  return null;
}

async function fetchFinnhubData(symbol) {
  var key = getFinnhubKey();
  if (!key) return {error: 'NO_KEY', symbol: symbol};

  try {
    // 基本报价
    var quoteUrl = 'https://finnhub.io/api/v1/quote?symbol=' + symbol + '&token=' + key;
    var profileUrl = 'https://finnhub.io/api/v1/stock/profile2?symbol=' + symbol + '&token=' + key;
    var metricUrl = 'https://finnhub.io/api/v1/stock/metric?symbol=' + symbol + '&metric=all&token=' + key;
    var recommendUrl = 'https://finnhub.io/api/v1/stock/recommendation?symbol=' + symbol + '&token=' + key;

    var results = {};
    for (var url of [quoteUrl, profileUrl, metricUrl, recommendUrl]) {
      var resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!resp.ok) continue;
      var data = await resp.json();
      results[url] = data;
    }

    var quote = results[quoteUrl] || {};
    var profile = results[profileUrl] || {};
    var metric = results[metricUrl] || {};
    var recommends = results[recommendUrl] || [];

    var d = {
      symbol: symbol,
      name: profile.name || symbol,
      currency: profile.currency || 'USD',
      exchange: profile.exchange || '',
      price: quote.c || null,
      prevClose: quote.pc || null,
      changePct: quote.dp || null,
      marketCap: profile.marketCapitalization ? profile.marketCapitalization * 1e6 : null,
      market: 'US',
      dataSource: 'finnhub'
    };

    var m = metric.metric || {};
    d.pe = m.peBasicExclExtraTTM || null;
    d.forwardPe = m.peForwardPeBasicExclExtraAnnual || null;
    d.pb = m.pbQuarterlyQuarterlyValueQuarterly || null;
    d.ps = m.psQuarterlyQuarterlyValueQuarterly || null;
    d.peg = m.pegForwardPeBasicExclExtraAnnual || null;
    d.revenueGrowth = m.revenueGrowthTTMYoy || null;
    d.earningsGrowth = m.epsGrowthTTMYoy || null;
    d.profitMargin = m.netProfitMarginTTM || null;
    d.operatingMargin = m.operatingMarginTTM || null;
    d.grossMargin = m.grossMarginTTM || null;
    d.roe = m.roeTTM || null;
    d.debtToEquity = m.totalDebtEquityQuarterly || null;
    d.currentRatio = m.currentRatioQuarterly || null;
    d.freeCashFlow = m.freeCashFlowTTM ? m.freeCashFlowTTM * 1e6 : null;
    d.operatingCashFlow = m.cashFlowFromOperationsTTM ? m.cashFlowFromOperationsTTM * 1e6 : null;
    d.week52High = m['52WeekHigh'] || null;
    d.week52Low = m['52WeekLow'] || null;
    d.beta = m.beta || null;
    d.industry = profile.finnhubIndustry || null;

    // 分析师数据
    if (recommends.length > 0) {
      var latest = recommends[0];
      d.analystCounts = {
        strongBuy: latest.strongBuy || 0,
        buy: latest.buy || 0,
        hold: latest.hold || 0,
        sell: latest.sell || 0,
        strongSell: latest.strongSell || 0
      };
    }

    // 目标价（需要另一次调用）
    try {
      var priceTargetUrl = 'https://finnhub.io/api/v1/stock/price-target?symbol=' + symbol + '&token=' + key;
      var ptResp = await fetch(priceTargetUrl, { signal: AbortSignal.timeout(5000) });
      if (ptResp.ok) {
        var pt = await ptResp.json();
        d.targetMean = pt.targetMean || null;
        d.targetHigh = pt.targetHigh || null;
        d.targetLow = pt.targetLow || null;
      }
    } catch(e) {}

    return d;
  } catch(e) {
    return {error: 'FETCH_ERROR', symbol: symbol, msg: e.message};
  }
}

async function fetchStockData(symbol) {
  // 先查内置数据
  var staticData = getStaticData(symbol);
  if (staticData) return staticData;

  // 再试 Finnhub
  var fhData = await fetchFinnhubData(symbol);
  if (!fhData.error) return fhData;

  // 都不行
  return {
    symbol: symbol,
    error: 'UNSUPPORTED',
    market: detectMarket(symbol)
  };
}

function quickCompare(a, b) {
  document.getElementById('tickerA').value = a;
  document.getElementById('tickerB').value = b;
  compare();
}

async function compare() {
  var codeA = document.getElementById('tickerA').value.trim().toUpperCase();
  var codeB = document.getElementById('tickerB').value.trim().toUpperCase();
  if (!codeA || !codeB) { showError('请输入两只股票的代码'); return; }

  showLoading(true);
  hideError();
  document.getElementById('result').innerHTML = '';

  setTimeout(async function() {
    var dataA = await fetchStockData(codeA);
    var dataB = await fetchStockData(codeB);

    var errMsg = '';
    if (dataA.error === 'UNSUPPORTED') errMsg += '「' + codeA + '』不在预设列表中，且未配置 Finnhub API Key。\n请点"设置"填入 Key 后重试。\n\n';
    if (dataB.error === 'UNSUPPORTED') errMsg += '「' + codeB + '』不在预设列表中，且未配置 Finnhub API Key。\n请点"设置"填入 Key 后重试。';
    if (dataA.error === 'FETCH_ERROR') errMsg += '获取『' + codeA + '』数据失败：' + (dataA.msg||'网络错误') + '\n\n';
    if (dataB.error === 'FETCH_ERROR') errMsg += '获取『' + codeB + '』数据失败：' + (dataB.msg||'网络错误') + '\n';

    if (errMsg) {
      showError(errMsg + '\n\n💡 提示：预设股票（ARM/MRVL/NVDA/MSFT/GOOGL/AAPL/AVGO/AMD + A股8只）可直接使用，无需 Key。');
      showLoading(false);
      return;
    }

    var scores = score(dataA, dataB);
    var html = generateDeepReport(dataA, dataB, scores);
    document.getElementById('result').innerHTML = html;
    showLoading(false);
  }, 100);
}

function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
  document.getElementById('searchBtn').disabled = show;
}

function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('error').classList.remove('show');
}

// 页面加载
console.log('投资深度比较APP已加载');
</script>
