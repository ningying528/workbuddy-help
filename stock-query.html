<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f1a">
<title>析投资助手</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0f0f1a; color: #fff; min-height: 100vh;
  padding-bottom: 30px; -webkit-tap-highlight-color: transparent;
}

/* ---- Header ---- */
.hdr {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  padding: 14px 14px 10px; border-bottom: 3px solid #e94560;
}
.hdr-title {
  font-size: 24px; font-weight: bold; color: #fff;
  text-align: center; margin-bottom: 10px; letter-spacing: 2px;
}
.hdr-title span { color: #e94560; }

/* Market Tabs */
.mtabs { display: flex; gap: 8px; margin-bottom: 10px; }
.mtab {
  flex: 1; padding: 12px 0; text-align: center;
  font-size: 20px; font-weight: bold; border: 3px solid #0f3460;
  border-radius: 14px; background: #16213e; color: #888;
  cursor: pointer; transition: .2s; user-select: none;
}
.mtab.active { background: #e94560; border-color: #e94560; color: #fff; }

/* Search */
.srow { display: flex; gap: 8px; }
.sinput {
  flex: 1; padding: 14px 16px; font-size: 22px;
  border: 3px solid #0f3460; border-radius: 16px;
  background: #16213e; color: #fff; outline: none;
}
.sinput:focus { border-color: #e94560; }
.sinput::placeholder { color: #666; font-size: 18px; }
.sbtn {
  padding: 0 22px; font-size: 22px; font-weight: bold;
  background: #e94560; color: #fff; border: none; border-radius: 16px; cursor: pointer;
}
.sbtn:active { background: #c73954; }

/* ---- Summary Card ---- */
.summary {
  margin: 12px 14px; background: #16213e; border: 2px solid #0f3460;
  border-radius: 16px; padding: 16px 18px; display: none;
}
.summary.show { display: block; }
.sname { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 8px; }
.sname .code { color: #888; font-size: 18px; font-weight: normal; margin-left: 8px; }
.sprice { font-size: 38px; font-weight: bold; margin: 4px 0; }
.schange { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
.sinfo { font-size: 19px; color: #aaa; line-height: 1.8; }
.sinfo b { color: #00d2ff; }

/* ---- TF Tabs ---- */
.ttabs { display: flex; gap: 8px; padding: 10px 14px; }
.ttab {
  flex: 1; padding: 10px 0; text-align: center;
  font-size: 18px; font-weight: bold; border: 3px solid #0f3460;
  border-radius: 12px; background: #16213e; color: #888; cursor: pointer; transition: .2s;
}
.ttab.active { background: #00d2ff; border-color: #00d2ff; color: #000; }

/* ---- Charts ---- */
.chart-box { margin: 0 0 4px; background: #16213e; }
#kline { width: 100%; height: 420px; }
#vol { width: 100%; height: 90px; }
#macd { width: 100%; height: 110px; }
#rsi { width: 100%; height: 90px; }
#psy { width: 100%; height: 90px; }

/* ---- Indicators ---- */
.ind-wrap { padding: 10px 14px; }
.ind-title {
  font-size: 22px; color: #00d2ff; font-weight: bold;
  margin-bottom: 8px; cursor: pointer;
}
.ind-title::after { content: ' ▼'; font-size: 16px; }
.ind-title.collapsed::after { content: ' ▶'; }
.ind-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 6px; overflow: hidden; max-height: 600px; transition: max-height .3s;
}
.ind-grid.collapsed { max-height: 0; }
.ind-item {
  background: rgba(0,0,0,.3); border-radius: 12px; padding: 10px 6px; text-align: center;
}
.ind-label { font-size: 15px; color: #888; }
.ind-val { font-size: 20px; font-weight: bold; margin-top: 4px; }

/* ---- Quick Buttons ---- */
.qsec { padding: 10px 14px; }
.qtitle {
  font-size: 20px; font-weight: bold; color: #e94560;
  margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
}
.qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.qbtn {
  background: #16213e; border: 2px solid #0f3460; border-radius: 12px;
  padding: 14px 4px; text-align: center; font-size: 18px; color: #fff;
  cursor: pointer; transition: .2s; user-select: none;
}
.qbtn:active { background: #0f3460; border-color: #e94560; }

/* Favorites */
.favs { display: flex; flex-wrap: wrap; gap: 8px; }
.fav {
  background: #0f3460; border: 2px solid #e94560; border-radius: 20px;
  padding: 8px 16px; font-size: 18px; color: #fff; cursor: pointer;
  white-space: nowrap; transition: .2s;
}
.fav:active { background: #e94560; }
.fav-del { margin-left: 6px; color: #ff3c3c; font-weight: bold; font-size: 20px; cursor: pointer; }

/* ---- Loading ---- */
.loading {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.85); display: none; z-index: 9999;
  justify-content: center; align-items: center; flex-direction: column;
}
.loading.show { display: flex; }
.spinner {
  width: 56px; height: 56px; border: 5px solid #0f3460;
  border-top-color: #e94560; border-radius: 50%;
  animation: spin .8s linear infinite; margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ldtxt { font-size: 22px; color: #fff; }

/* ---- Footer ---- */
.ft { text-align: center; padding: 16px; font-size: 16px; color: #555; }

/* Colors */
.up { color: #ff3c3c; }
.dn { color: #1a9e44; }
.neu { color: #ffd700; }

/* ---- Add Fav Button ---- */
.add-fav-btn {
  background: none; border: 2px dashed #e94560; color: #e94560;
  padding: 8px 16px; border-radius: 20px; font-size: 18px; cursor: pointer;
}
.add-fav-btn:active { background: rgba(233,69,96,.2); }
</style>
</head>
<body>

<div class="loading" id="ld">
  <div class="spinner"></div>
  <div class="ldtxt">正在查询数据...</div>
</div>

<div class="hdr">
  <div class="hdr-title">📊 <span>析</span>投资助手</div>
  <div class="mtabs">
    <div class="mtab active" onclick="switchMkt('a',this)">A 股</div>
    <div class="mtab" onclick="switchMkt('us',this)">美 股</div>
    <div class="mtab" onclick="switchMkt('hk',this)">港 股</div>
  </div>
  <div class="srow">
    <input class="sinput" id="inp" placeholder="输入股票代码，如 600519" onkeydown="if(event.key==='Enter')go()">
    <button class="sbtn" onclick="go()">查询</button>
  </div>
</div>

<div class="summary" id="sum"></div>

<div class="ttabs">
  <div class="ttab active" onclick="switchTF('day',this)">日线</div>
  <div class="ttab" onclick="switchTF('week',this)">周线</div>
  <div class="ttab" onclick="switchTF('month',this)">月线</div>
</div>

<div class="chart-box"><div id="kline"></div></div>
<div class="chart-box"><div id="vol"></div></div>
<div class="chart-box"><div id="macd"></div></div>
<div class="chart-box"><div id="rsi"></div></div>
<div class="chart-box"><div id="psy"></div></div>

<div class="ind-wrap">
  <div class="ind-title" onclick="toggleInd(this)">📈 技术指标</div>
  <div class="ind-grid" id="indGrid"></div>
</div>

<div class="qsec">
  <div class="qtitle">⭐ 我的收藏 <button class="add-fav-btn" onclick="addFav()">+ 添加当前股票</button></div>
  <div class="favs" id="favs"></div>
</div>

<div class="qsec">
  <div class="qtitle">🔍 快捷查询</div>
  <div class="qgrid" id="qA"></div>
  <div class="qgrid" id="qUS" style="display:none"></div>
  <div class="qgrid" id="qHK" style="display:none"></div>
</div>

<div class="ft">数据来源：腾讯财经 / Yahoo Finance · 仅供参考，不构成投资建议</div>

<script>
// ===== State =====
let mkt = 'a', tf = 'day', curCode = '', curName = '';
let allDates=[], allOpens=[], allCloses=[], allHighs=[], allLows=[], allVols=[];
let cK=null, cV=null, cM=null, cR=null, cP=null;

// ===== Favorites =====
function getFavs() {
  try { return JSON.parse(localStorage._favs || '[]'); } catch(e) { return []; }
}
function saveFavs(arr) {
  localStorage._favs = JSON.stringify(arr);
}
function renderFavs() {
  let f = getFavs(), d = document.getElementById('favs'), h = '';
  f.forEach((x, i) => {
    h += '<span class="fav" onclick="qs(\'' + x.code + '\')">' + x.name + '<span class="fav-del" onclick="event.stopPropagation();delFav(' + i + ')">×</span></span>';
  });
  if (!f.length) h = '<span style="color:#666;font-size:18px;">暂无收藏，查询后点「+」添加</span>';
  d.innerHTML = h;
}
function addFav() {
  if (!curCode) return;
  let f = getFavs();
  if (f.find(x => x.code === curCode)) { alert('已在收藏中'); return; }
  f.push({ code: curCode, name: curName || curCode, mkt: mkt });
  saveFavs(f); renderFavs();
}
function delFav(i) {
  let f = getFavs(); f.splice(i, 1); saveFavs(f); renderFavs();
}
renderFavs();

// ===== Quick Buttons =====
let stocksA = [
  ['茅台','sh600519'],['澜起','sh688981'],['比亚迪','sz002594'],['招行','sh600036'],
  ['宁德','sz300750'],['中芯','sh688981'],['寒武纪','sh688256'],['海光','sh688041']
];
let stocksUS = [
  ['英伟达','NVDA'],['苹果','AAPL'],['特斯拉','TSLA'],['亚马逊','AMZN'],
  ['微软','MSFT'],['谷歌','GOOGL'],['Meta','META'],['博通','AVGO']
];
let stocksHK = [
  ['腾讯','hk00700'],['阿里','hk09988'],['美团','hk03690'],['小米','hk01810']
];

function renderQuick(m, arr) {
  let d = document.getElementById('q' + m), h = '';
  arr.forEach(([n, c]) => { h += '<div class="qbtn" onclick="qs(\'' + c + '\')">' + n + '</div>'; });
  d.innerHTML = h;
}
renderQuick('A', stocksA);
renderQuick('US', stocksUS);
renderQuick('HK', stocksHK);

// ===== Indicator math =====
function MA(d,n){let r=[];for(let i=0;i<d.length;i++){if(i<n-1){r.push(null);continue;}let s=0;for(let j=0;j<n;j++)s+=d[i-j];r.push(s/n);}return r;}
function EMA(d,n){let r=[],k=2/(n+1),p=null;for(let i=0;i<d.length;i++){if(d[i]===null){r.push(null);continue;}if(p===null){r.push(d[i]);p=d[i];}else{let v=d[i]*k+p*(1-k);r.push(v);p=v;}}return r;}
function BOLL(d,n){let m=MA(d,n),u=[],dl=[];for(let i=0;i<d.length;i++){if(i<n-1){u.push(null);dl.push(null);continue;}let s=0,nn=Math.min(n,i+1);for(let j=0;j<nn;j++)s+=d[i-j];let mean=s/nn,vr=0;for(let j=0;j<nn;j++)vr+=Math.pow(d[i-j]-mean,2);let sd=Math.sqrt(vr/nn);u.push(mean+2*sd);dl.push(mean-2*sd);}return{mid:m,up:u,dn:dl};}
function MACD(d,f,s,sig){let ef=EMA(d,f),es=EMA(d,s),dif=[],dea=[],mk=2/(sig+1),dp=null;for(let i=0;i<d.length;i++)dif.push(ef[i]!==null&&es[i]!==null?ef[i]-es[i]:null);let vd=dif.filter(v=>v!==null);for(let i=0;i<vd.length;i++){if(dp===null){dea.push(vd[i]);dp=vd[i];}else{let v=vd[i]*mk+dp*(1-mk);dea.push(v);dp=v;}}let df=[],di=0;for(let i=0;i<dif.length;i++){if(dif[i]===null)df.push(null);else{df.push(dea[di]!==undefined?dea[di]:null);di++;}}let mc=[];for(let i=0;i<dif.length;i++)mc.push(dif[i]!==null&&df[i]!==null?(dif[i]-df[i])*2:null);return{dif,dea:df,macd:mc};}
function RSI(d,n){let r=[];for(let i=0;i<d.length;i++){if(i<n){r.push(null);continue;}let g=0,l=0;for(let j=0;j<n;j++){let dd=d[i-j]-d[i-j-1];if(dd>0)g+=dd;else l-=dd;}r.push(100-100/(1+g/(l||1)));}return r;}
function PSY(d,n){let r=[];for(let i=0;i<d.length;i++){if(i<n){r.push(null);continue;}let u=0;for(let j=0;j<n;j++){if(d[i-j]>d[i-j-1])u++;}r.push(u/n*100);}return r;}

// ===== Signal Analysis =====
function analyzeSignal() {
  let n = allCloses.length;
  if (!n) return { trend: '等待数据', color: 'neu', detail: '' };
  
  let last = allCloses[n-1];
  let ma5 = MA(allCloses, 5);
  let ma20 = MA(allCloses, 20);
  let ma60 = MA(allCloses, 60);
  let macdObj = MACD(allCloses, 13, 54, 5);
  
  let above5 = ma5[n-1] !== null && last > ma5[n-1];
  let above20 = ma20[n-1] !== null && last > ma20[n-1];
  let above60 = ma60[n-1] !== null && last > ma60[n-1];
  let maAligned = above5 && above20 && above60;
  let maBearish = !above5 && !above20 && !above60;
  
  let difLast = macdObj.dif.filter(v=>v!==null).pop();
  let deaLast = macdObj.dea.filter(v=>v!==null).pop();
  let macdLast = macdObj.macd.filter(v=>v!==null).pop();
  
  let detail = '';
  
  if (maAligned && difLast > deaLast && macdLast > 0) {
    return { trend: '强势多头', color: 'up', detail: '价格站上5/20/60均线 + MACD金叉向上' };
  } else if (maAligned) {
    return { trend: '多头排列', color: 'up', detail: '价格站上5/20/60均线，趋势向上' };
  } else if (above20 && above60) {
    return { trend: '偏多震荡', color: 'neu', detail: '站上20/60线，但5日线附近有压力' };
  } else if (maBearish && difLast < deaLast) {
    return { trend: '空头排列', color: 'dn', detail: '价格跌破5/20/60均线 + MACD死叉' };
  } else if (maBearish) {
    return { trend: '弱势空头', color: 'dn', detail: '价格跌破5/20/60均线，趋势向下' };
  } else if (!above20) {
    return { trend: '偏空震荡', color: 'neu', detail: '价格在20/60线下方，建议观望' };
  } else {
    return { trend: '震荡整理', color: 'neu', detail: '多空交织，等待方向选择' };
  }
}

// ===== Data Fetching =====
async function go() {
  let code = document.getElementById('inp').value.trim();
  if (!code) return;
  curCode = code; curName = '';
  showLd();
  try {
    if (mkt === 'a') await fetchA(code);
    else if (mkt === 'us') await fetchUS(code);
    else if (mkt === 'hk') await fetchH(code);
  } catch(e) { hideLd(); alert('查询失败：' + e.message); }
}

function qs(c) { document.getElementById('inp').value = c; go(); }

// A-share via Tencent
async function fetchA(code) {
  if (/^\d{6}$/.test(code)) {
    if (/^[6５]/.test(code)) code = 'sh' + code;
    else if (/^[0３２]/.test(code)) code = 'sz' + code;
    else if (/^[4８９]/.test(code)) code = 'bj' + code;
  }
  curCode = code;
  let tmap = { day: 'day', week: 'week', month: 'month' };
  let url = 'https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=' + code + ',' + tmap[tf] + ',,500,qfq';
  let purl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
  let resp = await fetch(purl, { signal: AbortSignal.timeout(15000) });
  if (!resp.ok) throw new Error('网络请求失败');
  let js = await resp.json();
  let sk = Object.keys(js.data || {})[0];
  if (!sk) throw new Error('未找到该股票');
  curName = js.data[sk].qt ? js.data[sk].qt[1] : code;
  let kk = tf==='day'?'qfqday':(tf==='week'?'qfqweek':'qfqmonth');
  let kl = js.data[sk][kk] || [];
  if (!kl.length) throw new Error('无K线数据');
  allDates=kl.map(k=>k[0]); allOpens=kl.map(k=>+k[1]); allCloses=kl.map(k=>+k[2]);
  allHighs=kl.map(k=>+k[3]); allLows=kl.map(k=>+k[4]); allVols=kl.map(k=>+k[5]||0);
  render();
}

// US stock via Yahoo
async function fetchUS(sym) {
  sym = sym.toUpperCase().replace(/^us\.?/i, '');
  curCode = sym; curName = sym;
  let tmap = { day: '1d', week: '1wk', month: '1mo' };
  let rmap = { day: '1y', week: '2y', month: '5y' };
  let yurl = 'https://query1.finance.yahoo.com/v8/finance/chart/' + sym + '?interval=' + tmap[tf] + '&range=' + rmap[tf];
  let purl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(yurl);
  let resp = await fetch(purl, { signal: AbortSignal.timeout(15000) });
  if (!resp.ok) throw new Error('请求失败，请检查代码');
  let js = await resp.json();
  let res = js.chart && js.chart.result ? js.chart.result[0] : null;
  if (!res) throw new Error('未找到该股票');
  curName = res.meta ? res.meta.symbol : sym;
  let ts = res.timestamp || [];
  let q = res.indicators && res.indicators.quote ? res.indicators.quote[0] : {};
  allDates = ts.map(t => new Date(t*1000).toISOString().split('T')[0]);
  allOpens = (q.open||[]).filter(v=>v!==null);
  allCloses = (q.close||[]).filter(v=>v!==null);
  allHighs = (q.high||[]).filter(v=>v!==null);
  allLows = (q.low||[]).filter(v=>v!==null);
  allVols = (q.volume||[]).map(v=>v||0);
  // Ensure all arrays same length
  let minLen = Math.min(allDates.length, allOpens.length, allCloses.length, allHighs.length, allLows.length, allVols.length);
  allDates = allDates.slice(0, minLen);
  allOpens = allOpens.slice(0, minLen); allCloses = allCloses.slice(0, minLen);
  allHighs = allHighs.slice(0, minLen); allLows = allLows.slice(0, minLen); allVols = allVols.slice(0, minLen);
  render();
}

// HK stock
async function fetchH(code) {
  if (/^\d{5}$/.test(code)) code = 'hk' + code;
  else if (!/^hk/i.test(code)) code = 'hk' + code;
  curCode = code; curName = code;
  let tmap = { day: 'day', week: 'week', month: 'month' };
  let url = 'https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=' + code + ',' + tmap[tf] + ',,500,qfq';
  let purl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
  let resp = await fetch(purl, { signal: AbortSignal.timeout(15000) });
  if (!resp.ok) throw new Error('网络请求失败');
  let js = await resp.json();
  let sk = Object.keys(js.data||{})[0];
  if (!sk) throw new Error('未找到该股票');
  curName = js.data[sk].qt ? js.data[sk].qt[1] : code;
  let kk = tf==='day'?'qfqday':(tf==='week'?'qfqweek':'qfqmonth');
  let kl = js.data[sk][kk] || [];
  if (!kl.length) throw new Error('无K线数据');
  allDates=kl.map(k=>k[0]); allOpens=kl.map(k=>+k[1]); allCloses=kl.map(k=>+k[2]);
  allHighs=kl.map(k=>+k[3]); allLows=kl.map(k=>+k[4]); allVols=kl.map(k=>+k[5]||0);
  render();
}

// ===== Render =====
function render() {
  if (!allCloses.length) return;
  let n = allCloses.length;
  let last = allCloses[n-1], prev = allCloses[n-2] || last;
  let chg = last - prev, chgPct = prev ? ((last - prev) / prev * 100) : 0;

  // Summary
  let sig = analyzeSignal();
  document.getElementById('sum').innerHTML =
    '<div class="sname">' + curName + '<span class="code">' + curCode + '</span></div>' +
    '<div class="sprice ' + (chg>=0?'up':'dn') + '">' + last.toFixed(2) + '</div>' +
    '<div class="schange ' + (chg>=0?'up':'dn') + '">' + (chg>=0?'+':'') + chg.toFixed(2) + ' (' + (chgPct>=0?'+':'') + chgPct.toFixed(2) + '%)</div>' +
    '<div class="sinfo">' +
    '<b>趋势信号：</b><span class="' + sig.color + '">' + sig.trend + '</span><br>' +
    '<b>说明：</b>' + sig.detail + '<br>' +
    '<b>最高：</b>' + Math.max(...allHighs.slice(-20)).toFixed(2) + ' | <b>最低：</b>' + Math.min(...allLows.slice(-20)).toFixed(2) +
    '</div>';
  document.getElementById('sum').classList.add('show');

  // Compute indicators
  let ma5=MA(allCloses,5), ma10=MA(allCloses,10), ma20=MA(allCloses,20);
  let ma60=MA(allCloses,60), ma120=MA(allCloses,120), ma250=MA(allCloses,250);
  let boll=BOLL(allCloses,20);
  let macd=MACD(allCloses,13,54,5);
  let rsi=RSI(allCloses,14);
  let psy=PSY(allCloses,12);

  // Indicator grid
  let items = [
    ['MA5',ma5],['MA10',ma10],['MA20',ma20],['MA60',ma60],
    ['MA120',ma120],['MA250',ma250],
    ['BOLL上',boll.up],['BOLL中',boll.mid],['BOLL下',boll.dn],
    ['DIF',macd.dif],['DEA',macd.dea],['MACD',macd.macd],
    ['RSI14',rsi],['PSY12',psy]
  ];
  let grid = document.getElementById('indGrid'), gh = '';
  items.forEach(([name,arr]) => {
    let v=null;
    for(let i=arr.length-1;i>=0;i--) if(arr[i]!==null) { v=arr[i]; break; }
    let cls = v!==null ? (name.includes('MA')||name.includes('BOLL')? (last>v?'up':'dn') : (v>=0?'up':'dn')) : '';
    // For BOLL special: show where close is relative to bands
    if (name.startsWith('BOLL') && v!==null) cls = '';
    if (name==='RSI14' && v!==null) cls = v>70?'dn':(v<30?'up':'');
    if (name==='PSY12' && v!==null) cls = v>75?'dn':(v<25?'up':'');
    gh += '<div class="ind-item"><div class="ind-label">'+name+'</div><div class="ind-val '+cls+'">'+(v!==null?v.toFixed(2):'-')+'</div></div>';
  });
  grid.innerHTML = gh;

  // K-line chart (simplified MAs)
  if (!cK) cK = echarts.init(document.getElementById('kline'));
  let cd = allDates.map((d,i)=>[allOpens[i],allCloses[i],allLows[i],allHighs[i]]);
  let xforms = allDates.length > 80 ? { formatter: v => { let p = v.match(/\d{4}-\d{2}-(\d{2})/); return p ? p[1] : v; } } : {};
  cK.setOption({
    backgroundColor:'#16213e',
    tooltip:{trigger:'axis'},
    legend:{data:['K线','MA5','MA10','MA20','MA60','MA120','MA250','BOLL上','BOLL中','BOLL下'],top:6,textStyle:{color:'#aaa',fontSize:12}},
    grid:{left:70,right:18,top:50,bottom:30},
    xAxis:{type:'category',data:allDates,axisLine:{lineStyle:{color:'#444'}},axisLabel:{color:'#888',fontSize:10,...xforms}},
    yAxis:{type:'value',axisLine:{lineStyle:{color:'#444'}},axisLabel:{color:'#888',fontSize:11},splitLine:{lineStyle:{color:'#1a1a2e'}}},
    dataZoom:[{type:'inside',start:30,end:100}],
    series:[
      {name:'K线',type:'candlestick',data:cd,itemStyle:{color:'#ff3c3c',color0:'#1a9e44',borderColor:'#ff3c3c',borderColor0:'#1a9e44'}},
      {name:'MA5',type:'line',data:ma5,lineStyle:{width:1.5,color:'#ff6b6b'},symbol:'none'},
      {name:'MA10',type:'line',data:ma10,lineStyle:{width:1.2,color:'#ff8c00'},symbol:'none'},
      {name:'MA20',type:'line',data:ma20,lineStyle:{width:1.5,color:'#ffd700'},symbol:'none'},
      {name:'MA60',type:'line',data:ma60,lineStyle:{width:1.5,color:'#00d2ff'},symbol:'none'},
      {name:'MA120',type:'line',data:ma120,lineStyle:{width:1.2,color:'#32cd32'},symbol:'none'},
      {name:'MA250',type:'line',data:ma250,lineStyle:{width:2,color:'#ff4500'},symbol:'none'},
      {name:'BOLL上',type:'line',data:boll.up,lineStyle:{width:1,color:'#00ff00',type:'dashed'},symbol:'none'},
      {name:'BOLL中',type:'line',data:boll.mid,lineStyle:{width:1,color:'#ffff00',type:'dashed'},symbol:'none'},
      {name:'BOLL下',type:'line',data:boll.dn,lineStyle:{width:1,color:'#00ff00',type:'dashed'},symbol:'none'},
    ]
  },true);

  // Volume
  if (!cV) cV = echarts.init(document.getElementById('vol'));
  let vc = allCloses.map((c,i)=>i>0&&c>=allCloses[i-1]?'#ff3c3c':'#1a9e44');
  cV.setOption({
    backgroundColor:'#16213e',
    grid:{left:70,right:18,top:8,bottom:18},
    xAxis:{type:'category',data:allDates,axisLine:{show:false},axisLabel:{show:false}},
    yAxis:{type:'value',axisLine:{lineStyle:{color:'#444'}},axisLabel:{color:'#888',fontSize:9},splitLine:{show:false}},
    dataZoom:[{type:'inside',start:30,end:100}],
    series:[{type:'bar',data:allVols.map((v,i)=>({value:v,itemStyle:{color:vc[i]}})),barWidth:'80%'}]
  },true);

  // MACD
  if (!cM) cM = echarts.init(document.getElementById('macd'));
  let mc = macd.macd.map(v=>v!==null?(v>=0?'#ff3c3c':'#1a9e44'):'#888');
  cM.setOption({
    backgroundColor:'#16213e',
    legend:{data:['DIF','DEA','MACD'],top:4,textStyle:{color:'#aaa',fontSize:10}},
    grid:{left:70,right:18,top:28,bottom:18},
    xAxis:{type:'category',data:allDates,axisLine:{show:false},axisLabel:{show:false}},
    yAxis:{type:'value',axisLine:{lineStyle:{color:'#444'}},axisLabel:{color:'#888',fontSize:9},splitLine:{lineStyle:{color:'#1a1a2e'}}},
    dataZoom:[{type:'inside',start:30,end:100}],
    series:[
      {name:'DIF',type:'line',data:macd.dif,lineStyle:{width:1.2,color:'#ffd700'},symbol:'none'},
      {name:'DEA',type:'line',data:macd.dea,lineStyle:{width:1.2,color:'#00d2ff'},symbol:'none'},
      {name:'MACD',type:'bar',data:macd.macd.map((v,i)=>({value:v,itemStyle:{color:mc[i]}}))}
    ]
  },true);

  // RSI
  if (!cR) cR = echarts.init(document.getElementById('rsi'));
  cR.setOption({
    backgroundColor:'#16213e',
    legend:{data:['RSI(14)'],top:4,textStyle:{color:'#aaa',fontSize:10}},
    grid:{left:70,right:18,top:28,bottom:18},
    xAxis:{type:'category',data:allDates,axisLine:{show:false},axisLabel:{show:false}},
    yAxis:{type:'value',min:0,max:100,axisLine:{lineStyle:{color:'#444'}},axisLabel:{color:'#888',fontSize:9},splitLine:{lineStyle:{color:'#1a1a2e'}}},
    dataZoom:[{type:'inside',start:30,end:100}],
    series:[{name:'RSI(14)',type:'line',data:rsi,lineStyle:{width:1.5,color:'#ff69b4'},symbol:'none',markLine:{silent:true,symbol:'none',lineStyle:{type:'dashed',color:'#666'},data:[{yAxis:70},{yAxis:30}]},areaStyle:{color:'rgba(255,105,180,0.08)'}}]
  },true);

  // PSY
  if (!cP) cP = echarts.init(document.getElementById('psy'));
  cP.setOption({
    backgroundColor:'#16213e',
    legend:{data:['PSY(12)'],top:4,textStyle:{color:'#aaa',fontSize:10}},
    grid:{left:70,right:18,top:28,bottom:18},
    xAxis:{type:'category',data:allDates,axisLine:{show:false},axisLabel:{show:false}},
    yAxis:{type:'value',min:0,max:100,axisLine:{lineStyle:{color:'#444'}},axisLabel:{color:'#888',fontSize:9},splitLine:{lineStyle:{color:'#1a1a2e'}}},
    dataZoom:[{type:'inside',start:30,end:100}],
    series:[{name:'PSY(12)',type:'line',data:psy,lineStyle:{width:1.5,color:'#ffa500'},symbol:'none',markLine:{silent:true,symbol:'none',lineStyle:{type:'dashed',color:'#666'},data:[{yAxis:75},{yAxis:25}]},areaStyle:{color:'rgba(255,165,0,0.08)'}}]
  },true);

  hideLd();
}

// ===== UI =====
function switchMkt(mm, el) {
  mkt = mm;
  document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('qA').style.display = mm==='a' ? '' : 'none';
  document.getElementById('qUS').style.display = mm==='us' ? '' : 'none';
  document.getElementById('qHK').style.display = mm==='hk' ? '' : 'none';
  let ph = { a:'输入A股代码，如 600519', us:'输入美股代码，如 NVDA', hk:'输入港股代码，如 hk00700' };
  document.getElementById('inp').placeholder = ph[mm];
  document.getElementById('inp').value = '';
}

function switchTF(tt, el) {
  tf = tt;
  document.querySelectorAll('.ttab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if (curCode) go();
}

function toggleInd(el) {
  el.classList.toggle('collapsed');
  document.getElementById('indGrid').classList.toggle('collapsed');
}

function showLd() { document.getElementById('ld').classList.add('show'); }
function hideLd() { document.getElementById('ld').classList.remove('show'); }

// init
window.onload = function() { document.getElementById('inp').focus(); };
</script>
</body>
</html>
