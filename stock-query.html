<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>析投资助手 - 股票行情查询</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f1a;
  --card: #16213e;
  --border: #0f3460;
  --price-up: #ff3c3c;
  --price-down: #1a9e44;
  --accent: #e94560;
  --blue: #00d2ff;
  --text: #ffffff;
  --muted: #888;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 120px;
  -webkit-tap-highlight-color: transparent;
}
.header {
  position: sticky; top: 0; background: #1a1a2e;
  padding: 16px; z-index: 100; border-bottom: 2px solid var(--border);
}
.header-title { font-size: 24px; font-weight: bold; color: var(--accent); margin-bottom: 12px; text-align: center; }
.market-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.market-tab {
  flex: 1; padding: 10px 0; text-align: center; font-size: 18px; font-weight: bold;
  border: 2px solid var(--border); border-radius: 12px; background: var(--card);
  color: var(--muted); cursor: pointer; transition: all 0.2s; user-select: none;
}
.market-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.search-row { display: flex; gap: 10px; }
.search-input-wrap { flex: 1; position: relative; }
.search-input {
  width: 100%; padding: 16px 20px; font-size: 22px;
  border: 3px solid var(--border); border-radius: 16px;
  background: var(--card); color: var(--text); outline: none; transition: border-color 0.3s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); font-size: 18px; }
.search-btn {
  padding: 0 28px; font-size: 22px; font-weight: bold;
  background: var(--accent); color: #fff; border: none; border-radius: 16px;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.search-btn:active { background: #c73954; transform: scale(0.96); }
.quick-section { padding: 16px; }
.section-title { font-size: 22px; font-weight: bold; color: var(--accent); margin-bottom: 12px; }
.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.quick-btn {
  background: var(--card); border: 2px solid var(--border); border-radius: 14px;
  padding: 14px 4px; text-align: center; font-size: 17px; color: var(--text);
  cursor: pointer; transition: all 0.2s; user-select: none; line-height: 1.3;
}
.quick-btn:active { background: #0f3460; transform: scale(0.95); }
.quick-btn:hover { border-color: var(--accent); }
.loading { text-align: center; padding: 60px 20px; font-size: 22px; color: var(--muted); display: none; }
.loading.show { display: block; }
.spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.result-card {
  margin: 0 16px 20px; background: var(--card); border: 3px solid var(--accent);
  border-radius: 20px; overflow: hidden; display: none;
}
.result-card.show { display: block; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.result-header {
  padding: 24px; display: flex; justify-content: space-between; align-items: flex-start;
  border-bottom: 2px solid var(--border);
}
.stock-name { font-size: 30px; font-weight: bold; }
.stock-code { font-size: 18px; color: var(--muted); margin-top: 4px; }
.stock-price-wrap { text-align: right; }
.stock-price { font-size: 44px; font-weight: bold; font-variant-numeric: tabular-nums; }
.stock-change { font-size: 22px; font-weight: bold; margin-top: 4px; }
.price-up { color: var(--price-up); }
.price-down { color: var(--price-down); }
.price-flat { color: #888; }
.result-body { padding: 20px 24px; }
.data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.data-item { text-align: center; }
.data-label { font-size: 16px; color: var(--muted); margin-bottom: 6px; }
.data-value { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; }
.detail-section { margin-top: 20px; border-top: 2px solid var(--border); padding-top: 20px; }
.detail-title { font-size: 20px; color: var(--blue); font-weight: bold; margin-bottom: 12px; }
.detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.detail-item {
  display: flex; justify-content: space-between; padding: 10px 14px;
  background: rgba(0,0,0,0.2); border-radius: 10px;
}
.detail-label { font-size: 17px; color: var(--muted); }
.detail-value { font-size: 17px; font-weight: bold; font-variant-numeric: tabular-nums; }
.error-msg { text-align: center; padding: 40px 20px; font-size: 20px; color: var(--accent); display: none; }
.error-msg.show { display: block; }
.hint { text-align: center; padding: 60px 20px; font-size: 20px; color: var(--muted); }
.hint.hide { display: none; }
.footer {
  position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e;
  border-top: 2px solid var(--border); padding: 12px; text-align: center;
  font-size: 15px; color: var(--muted); z-index: 100;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">析投资助手 - 股票行情查询</div>
  <div class="market-tabs">
    <div class="market-tab active" onclick="switchMarket('ashare', this)">A股</div>
    <div class="market-tab" onclick="switchMarket('us', this)">美股</div>
    <div class="market-tab" onclick="switchMarket('hk', this)">港股</div>
  </div>
  <div class="search-row">
    <div class="search-input-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="输入股票代码，如：600519 或 NVDA" onkeydown="if(event.key==='Enter')doSearch()">
    </div>
    <button class="search-btn" onclick="doSearch()">查询</button>
  </div>
</div>

<div class="quick-section">
  <div class="section-title">快捷查询</div>
  <div class="quick-grid" id="quickGrid">
    <div class="quick-btn" data-market="ashare" onclick="quickSearch('sh600519')">贵州茅台</div>
    <div class="quick-btn" data-market="ashare" onclick="quickSearch('sh688981')">澜起科技</div>
    <div class="quick-btn" data-market="ashare" onclick="quickSearch('sz002594')">比亚迪</div>
    <div class="quick-btn" data-market="ashare" onclick="quickSearch('sh600036')">招商银行</div>
    <div class="quick-btn" data-market="us" style="display:none" onclick="quickSearch('NVDA')">英伟达</div>
    <div class="quick-btn" data-market="us" style="display:none" onclick="quickSearch('AAPL')">苹果</div>
    <div class="quick-btn" data-market="us" style="display:none" onclick="quickSearch('TSLA')">特斯拉</div>
    <div class="quick-btn" data-market="us" style="display:none" onclick="quickSearch('AMZN')">亚马逊</div>
    <div class="quick-btn" data-market="hk" style="display:none" onclick="quickSearch('hk00700')">腾讯控股</div>
    <div class="quick-btn" data-market="hk" style="display:none" onclick="quickSearch('hk09988')">阿里巴巴</div>
  </div>
</div>

<div class="hint" id="hint">输入股票代码，或点击上方快捷按钮查询行情</div>

<div class="loading" id="loading">
  <div class="spinner"></div><br>正在查询行情数据...
</div>

<div class="error-msg" id="errorMsg"></div>

<div class="result-card" id="resultCard">
  <div class="result-header">
    <div>
      <div class="stock-name" id="stockName">-</div>
      <div class="stock-code" id="stockCode">-</div>
    </div>
    <div class="stock-price-wrap">
      <div class="stock-price" id="stockPrice">-</div>
      <div class="stock-change" id="stockChange">-</div>
    </div>
  </div>
  <div class="result-body">
    <div class="data-grid">
      <div class="data-item"><div class="data-label">今开</div><div class="data-value" id="openPrice">-</div></div>
      <div class="data-item"><div class="data-label">最高</div><div class="data-value" id="highPrice">-</div></div>
      <div class="data-item"><div class="data-label">最低</div><div class="data-value" id="lowPrice">-</div></div>
      <div class="data-item"><div class="data-label">昨收</div><div class="data-value" id="prevClose">-</div></div>
      <div class="data-item"><div class="data-label">成交量</div><div class="data-value" id="volume">-</div></div>
      <div class="data-item"><div class="data-label">成交额</div><div class="data-value" id="amount">-</div></div>
    </div>
    <div class="detail-section">
      <div class="detail-title">详细数据</div>
      <div class="detail-grid">
        <div class="detail-item"><span class="detail-label">换手率</span><span class="detail-value" id="turnover">-</span></div>
        <div class="detail-item"><span class="detail-label">市盈率</span><span class="detail-value" id="pe">-</span></div>
        <div class="detail-item"><span class="detail-label">市净率</span><span class="detail-value" id="pb">-</span></div>
        <div class="detail-item"><span class="detail-label">总市值</span><span class="detail-value" id="marketCap">-</span></div>
        <div class="detail-item"><span class="detail-label">52周最高</span><span class="detail-value" id="week52High">-</span></div>
        <div class="detail-item"><span class="detail-label">52周最低</span><span class="detail-value" id="week52Low">-</span></div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  数据来源：腾讯财经 / Yahoo Finance · 仅供参考，不构成投资建议
</div>

<script>
let currentMarket = 'ashare';

function switchMarket(market, tabEl) {
  currentMarket = market;
  document.querySelectorAll('.market-tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  document.querySelectorAll('.quick-btn').forEach(btn => {
    const btnMarket = btn.getAttribute('data-market') || 'ashare';
    btn.style.display = btnMarket === market ? '' : 'none';
  });
  const placeholderMap = {
    'ashare': '输入A股代码，如：600519 或 sh600519',
    'us': '输入美股代码，如：NVDA 或 AAPL',
    'hk': '输入港股代码，如：hk00700'
  };
  document.getElementById('searchInput').placeholder = placeholderMap[market];
  document.getElementById('searchInput').value = '';
}

function quickSearch(code) {
  document.getElementById('searchInput').value = code;
  doSearch();
}

async function doSearch() {
  const input = document.getElementById('searchInput').value.trim();
  if (!input) { showError('请输入股票代码'); return; }
  showLoading();
  try {
    if (currentMarket === 'ashare') { await searchAShare(input); }
    else if (currentMarket === 'us') { await searchUSStock(input); }
    else if (currentMarket === 'hk') { await searchHKStock(input); }
  } catch(e) { showError('查询失败：' + e.message); }
}

async function searchAShare(input) {
  let code = input;
  if (/^\d{6}$/.test(input)) {
    if (input.startsWith('6') || input.startsWith('5')) code = 'sh' + input;
    else if (input.startsWith('0') || input.startsWith('3') || input.startsWith('2')) code = 'sz' + input;
    else if (input.startsWith('4') || input.startsWith('8') || input.startsWith('9')) code = 'bj' + input;
  } else if (!/^(sh|sz|bj)/i.test(input)) {
    code = 'sh600519';
  }
  const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://qt.gtimg.cn/q=' + code);
  const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
  if (!resp.ok) throw new Error('网络请求失败');
  const text = await resp.text();
  const match = text.match(/v_\w+="([^"]+)"/);
  if (!match) throw new Error('未找到该股票，请检查代码');
  const fields = match[1].split('~');
  const name = fields[1] || input;
  const price = parseFloat(fields[3]) || 0;
  const prevClose = parseFloat(fields[4]) || 0;
  const open = parseFloat(fields[5]) || 0;
  const high = parseFloat(fields[33]) || 0;
  const low = parseFloat(fields[34]) || 0;
  const change = parseFloat(fields[31]) || 0;
  const changePct = parseFloat(fields[32]) || 0;
  const vol = parseInt(fields[6]) || 0;
  const amount = parseFloat(fields[38]) || 0;
  const turnover = parseFloat(fields[39]) || 0;
  const pe = fields[41] || '-';
  const colorClass = change > 0 ? 'price-up' : (change < 0 ? 'price-down' : 'price-flat');
  document.getElementById('stockName').textContent = name;
  document.getElementById('stockCode').textContent = (fields[2] || code).toUpperCase() + ' \u00b7 A\u80a1';
  document.getElementById('stockPrice').textContent = price.toFixed(2);
  document.getElementById('stockPrice').className = 'stock-price ' + colorClass;
  const changeStr = (change >= 0 ? '+' : '') + change.toFixed(2) + '  (' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%)';
  const changeEl = document.getElementById('stockChange');
  changeEl.textContent = changeStr;
  changeEl.className = 'stock-change ' + colorClass;
  document.getElementById('openPrice').textContent = open.toFixed(2);
  document.getElementById('openPrice').className = 'data-value ' + (open >= prevClose ? 'price-up' : 'price-down');
  document.getElementById('highPrice').textContent = high.toFixed(2);
  document.getElementById('highPrice').className = 'data-value price-up';
  document.getElementById('lowPrice').textContent = low.toFixed(2);
  document.getElementById('lowPrice').className = 'data-value price-down';
  document.getElementById('prevClose').textContent = prevClose.toFixed(2);
  document.getElementById('volume').textContent = formatVolume(vol);
  document.getElementById('amount').textContent = formatAmount(amount);
  document.getElementById('turnover').textContent = turnover.toFixed(2) + '%';
  document.getElementById('pe').textContent = pe;
  document.getElementById('pb').textContent = '-';
  document.getElementById('marketCap').textContent = '-';
  document.getElementById('week52High').textContent = '-';
  document.getElementById('week52Low').textContent = '-';
  showResult();
}

async function searchUSStock(input) {
  let symbol = input.toUpperCase().replace(/^us\.?/i, '');
  const url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + symbol + '?interval=1d&range=1d';
  const resp = await fetch(url, { signal: AbortSignal.timeout(10000), headers: { 'Accept': 'application/json' } });
  if (!resp.ok) throw new Error('请求失败，请检查股票代码');
  const data = await resp.json();
  const result = data.chart && data.chart.result ? data.chart.result[0] : null;
  if (!result) throw new Error('未找到该股票，请检查代码');
  const meta = result.meta || {};
  const quotes = result.indicators && result.indicators.quote ? result.indicators.quote[0] : {};
  const prevClose = meta.chartPreviousClose || meta.previousClose || 0;
  const price = meta.regularMarketPrice || prevClose;
  const openArr = quotes.open || [];
  const open = openArr[openArr.length - 1] || prevClose;
  const high = meta.regularMarketDayHigh || 0;
  const low = meta.regularMarketDayLow || 0;
  const vol = meta.regularMarketVolume || 0;
  const change = price - prevClose;
  const changePct = prevClose ? (change / prevClose * 100) : 0;
  const wk52High = meta.fiftyTwoWeekHigh || 0;
  const wk52Low = meta.fiftyTwoWeekLow || 0;
  const marketCap = meta.marketCap || 0;
  const colorClass = change > 0 ? 'price-up' : (change < 0 ? 'price-down' : 'price-flat');
  document.getElementById('stockName').textContent = meta.longName || meta.shortName || symbol;
  document.getElementById('stockCode').textContent = symbol + ' \u00b7 ' + (meta.exchangeName || '');
  document.getElementById('stockPrice').textContent = '$' + price.toFixed(2);
  document.getElementById('stockPrice').className = 'stock-price ' + colorClass;
  const changeStr = (change >= 0 ? '+' : '') + change.toFixed(2) + '  (' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%)';
  const changeEl = document.getElementById('stockChange');
  changeEl.textContent = changeStr;
  changeEl.className = 'stock-change ' + colorClass;
  const openStr = typeof open === 'number' ? '$' + open.toFixed(2) : '-';
  document.getElementById('openPrice').textContent = openStr;
  document.getElementById('openPrice').className = 'data-value ' + (open >= prevClose ? 'price-up' : 'price-down');
  document.getElementById('highPrice').textContent = '$' + high.toFixed(2);
  document.getElementById('highPrice').className = 'data-value price-up';
  document.getElementById('lowPrice').textContent = '$' + low.toFixed(2);
  document.getElementById('lowPrice').className = 'data-value price-down';
  document.getElementById('prevClose').textContent = '$' + prevClose.toFixed(2);
  document.getElementById('volume').textContent = formatUSVolume(vol);
  document.getElementById('amount').textContent = '-';
  document.getElementById('turnover').textContent = '-';
  document.getElementById('pe').textContent = '-';
  document.getElementById('pb').textContent = '-';
  document.getElementById('marketCap').textContent = formatUSMarketCap(marketCap);
  document.getElementById('week52High').textContent = '$' + wk52High.toFixed(2);
  document.getElementById('week52Low').textContent = '$' + wk52Low.toFixed(2);
  showResult();
}

async function searchHKStock(input) {
  let code = input;
  if (/^\d{5}$/.test(input)) code = 'hk' + input;
  else if (!/^hk/i.test(input)) code = 'hk' + input;
  const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://qt.gtimg.cn/q=' + code);
  const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
  if (!resp.ok) throw new Error('网络请求失败');
  const text = await resp.text();
  const match = text.match(/v_(\w+)="([^"]+)"/);
  if (!match) throw new Error('未找到该股票，请检查代码');
  const fields = match[2].split('~');
  const name = fields[1] || input;
  const price = parseFloat(fields[3]) || 0;
  const prevClose = parseFloat(fields[4]) || 0;
  const open = parseFloat(fields[5]) || 0;
  const high = parseFloat(fields[33]) || 0;
  const low = parseFloat(fields[34]) || 0;
  const change = parseFloat(fields[31]) || 0;
  const changePct = parseFloat(fields[32]) || 0;
  const vol = parseInt(fields[6]) || 0;
  const amount = parseFloat(fields[38]) || 0;
  const turnover = parseFloat(fields[39]) || 0;
  const colorClass = change > 0 ? 'price-up' : (change < 0 ? 'price-down' : 'price-flat');
  document.getElementById('stockName').textContent = name;
  document.getElementById('stockCode').textContent = (fields[2] || code).toUpperCase() + ' \u00b7 \u6e2f\u80a1';
  document.getElementById('stockPrice').textContent = price.toFixed(2);
  document.getElementById('stockPrice').className = 'stock-price ' + colorClass;
  const changeStr = (change >= 0 ? '+' : '') + change.toFixed(2) + '  (' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%)';
  const changeEl = document.getElementById('stockChange');
  changeEl.textContent = changeStr;
  changeEl.className = 'stock-change ' + colorClass;
  document.getElementById('openPrice').textContent = open.toFixed(2);
  document.getElementById('openPrice').className = 'data-value ' + (open >= prevClose ? 'price-up' : 'price-down');
  document.getElementById('highPrice').textContent = high.toFixed(2);
  document.getElementById('highPrice').className = 'data-value price-up';
  document.getElementById('lowPrice').textContent = low.toFixed(2);
  document.getElementById('lowPrice').className = 'data-value price-down';
  document.getElementById('prevClose').textContent = prevClose.toFixed(2);
  document.getElementById('volume').textContent = formatVolume(vol);
  document.getElementById('amount').textContent = formatAmount(amount);
  document.getElementById('turnover').textContent = turnover.toFixed(2) + '%';
  document.getElementById('pe').textContent = '-';
  document.getElementById('pb').textContent = '-';
  document.getElementById('marketCap').textContent = '-';
  document.getElementById('week52High').textContent = '-';
  document.getElementById('week52Low').textContent = '-';
  showResult();
}

function formatVolume(vol) {
  if (vol >= 10000) return (vol / 10000).toFixed(2) + '\u4e07\u624b';
  return vol + '\u624b';
}
function formatAmount(amt) {
  if (amt >= 100000000) return (amt / 100000000).toFixed(2) + '\u4ebf\u5143';
  if (amt >= 10000) return (amt / 10000).toFixed(2) + '\u4e07\u5143';
  return amt.toFixed(2) + '\u5143';
}
function formatUSVolume(vol) {
  if (vol >= 1e9) return (vol / 1e9).toFixed(2) + 'B';
  if (vol >= 1e6) return (vol / 1e6).toFixed(2) + 'M';
  if (vol >= 1e3) return (vol / 1e3).toFixed(2) + 'K';
  return vol.toString();
}
function formatUSMarketCap(cap) {
  if (cap >= 1e12) return '$' + (cap / 1e12).toFixed(2) + 'T';
  if (cap >= 1e9) return '$' + (cap / 1e9).toFixed(2) + 'B';
  if (cap >= 1e6) return '$' + (cap / 1e6).toFixed(2) + 'M';
  return '$' + cap.toFixed(0);
}
function showLoading() {
  document.getElementById('loading').classList.add('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('hint').classList.add('hide');
}
function showResult() {
  document.getElementById('loading').classList.remove('show');
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('hint').classList.add('hide');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function showError(msg) {
  document.getElementById('loading').classList.remove('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('hint').classList.add('hide');
  const el = document.getElementById('errorMsg');
  el.textContent = '\u26a0\ufe0f ' + msg;
  el.classList.add('show');
}
window.onload = function() {
  document.getElementById('searchInput').focus();
};
</script>
</body>
</html>
